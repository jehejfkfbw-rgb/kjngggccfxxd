<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما لايت برو | CimaLight Pro Ultimate</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --bg-glass: rgba(21, 28, 44, 0.85);
            --accent: #e50914;
            --accent-hover: #f6121d;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1a0507 0%, var(--bg-main) 70%);
        }

        /* رأس الصفحة الفخم */
        header {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        nav { display: flex; gap: 20px; align-items: center; }
        
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            padding: 8px 16px;
            border-radius: 8px;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
            background-color: rgba(229, 9, 20, 0.1);
        }

        .container { max-width: 1350px; margin: 30px auto; padding: 0 25px; }

        /* بانر الترحيب السينمائي */
        .hero {
            background: linear-gradient(135deg, rgba(229,9,20,0.2) 0%, rgba(11,15,25,0.8) 100%), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover;
            padding: 60px 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, var(--bg-main), transparent);
        }

        .hero-content { position: relative; z-index: 2; max-width: 600px; }
        .hero h1 { font-size: 38px; font-weight: 900; margin-bottom: 12px; line-height: 1.2; }
        .hero p { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; }

        /* أدوات التحكم والبحث */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            outline: none;
        }

        .filter-select {
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-select:focus { border-color: var(--accent); outline: none; }

        /* شبكة عرض الفيديوهات */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        .card-img-container {
            position: relative;
            height: 360px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img { transform: scale(1.05); }

        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            color: var(--accent);
            border: 1px solid rgba(229, 9, 20, 0.3);
        }

        .card-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-content h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .card-content p { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; line-height: 1.5; }
        
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        /* الأقسام المخفية والظاهرة */
        .section { display: none; }
        .section.active { display: block; }

        /* مشغل الفيديو السينمائي */
        .player-container {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            animation: fadeIn 0.4s ease;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            max-height: 600px;
            border-radius: 14px;
            background: black;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        /* لوحة التحكم الفخمة */
        .form-box {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            max-width: 650px;
            margin: 20px auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 10px;
            font-size: 14px;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            outline: none;
        }

        .alert {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            display: none;
            animation: shake 0.4s ease;
        }
        .alert-error { background-color: rgba(229, 9, 20, 0.2); border: 1px solid var(--accent); color: #ff8085; }
        .alert-success { background-color: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchSection('home')">
            <span>🎬</span> CimaLight Pro
        </div>
        <nav>
            <a onclick="switchSection('home')" id="nav-home" class="active">الرئيسية</a>
            <a onclick="switchSection('admin')" id="nav-admin">لوحة المطور</a>
        </nav>
    </header>

    <div class="container">
        
        <!-- قسم الرئيسية -->
        <div id="home-section" class="section active">
            <div class="hero">
                <div class="hero-content">
                    <h1>عالم السينما بين يديك</h1>
                    <p>استمتع بمشاهدة أحدث الأفلام والمسلسلات بجودة سينمائية فائقة السرعة وبدون إعلانات مزعجة.</p>
                </div>
            </div>

            <div class="controls-bar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="ابحث عن فيلم أو مسلسل..." oninput="renderVideos()">
                </div>
                <select id="filter-type" class="filter-select" onchange="renderVideos()">
                    <option value="الكل">عرض جميع العروض</option>
                    <option value="فيلم">أفلام سينمائية</option>
                    <option value="مسلسل">مسلسلات تليفزيونية</option>
                </select>
            </div>

            <div id="video-grid" class="grid"></div>

            <div id="player-section" class="player-container" style="display: none;">
                <div class="player-header">
                    <h2 id="player-title" style="font-size: 22px;"></h2>
                    <button class="btn" style="width: auto; padding: 6px 15px; background: #334155;" onclick="closePlayer()">إغلاق المشغل ✕</button>
                </div>
                <video id="main-video-player" controls autoplay></video>
                <p id="player-desc" style="margin-top: 15px; color: var(--text-muted); line-height: 1.6;"></p>
            </div>
        </div>

        <!-- قسم لوحة المطور -->
        <div id="admin-section" class="section">
            <div id="login-container" class="form-box">
                <h2 style="margin-bottom: 20px; text-align: center;">تسجيل دخول المطور</h2>
                <div id="login-alert" class="alert"></div>
                <div class="form-group">
                    <label>البريد الإلكتروني:</label>
                    <input type="email" id="admin-email" placeholder="أدخل إيميلك...">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="admin-pass" placeholder="كلمة المرور...">
                </div>
                <button class="btn" onclick="loginAdmin()">دخول لوحة التحكم الآمنة</button>
            </div>

            <div id="dashboard-container" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2>🛠️ لوحة تحكم وإدارة المحتوى</h2>
                    <button class="btn" style="width: auto; background: #334155;" onclick="logoutAdmin()">تسجيل الخروج</button>
                </div>

                <div class="form-box" style="max-width: 100%;">
                    <div id="upload-alert" class="alert"></div>
                    <h3 style="margin-bottom: 20px; color: var(--accent);">➕ إضافة فيديو جديد من جهازك</h3>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>عنوان الفيلم أو المسلسل:</label>
                            <input type="text" id="v-title" placeholder="اكتب العنوان...">
                        </div>
                        <div class="form-group">
                            <label>نوع المحتوى:</label>
                            <select id="v-type">
                                <option value="فيلم">فيلم</option>
                                <option value="مسلسل">مسلسل</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>المدة بالدقائق (أقصى 120 دقيقة للأفلام):</label>
                            <input type="number" id="v-duration" value="95" min="1" max="300">
                        </div>
                        <div class="form-group">
                            <label>اختر صورة الغلاف من جهازك:</label>
                            <input type="file" id="v-thumb-file" accept="image/*">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>اختر ملف الفيديو من جهازك (MP4):</label>
                        <input type="file" id="v-video-file" accept="video/mp4">
                    </div>

                    <div class="form-group">
                        <label>وصف قصة العمل:</label>
                        <textarea id="v-desc" rows="3" placeholder="تفاصيل أحداث الفيلم أو المسلسل..."></textarea>
                    </div>
                    
                    <button class="btn" onclick="uploadNewVideo()">نشر العمل على المنصة فوراً</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const ADMIN_EMAIL = "mohamedadel@gmail.com";
        const ADMIN_PASS = "cima2026password";

        let videos = JSON.parse(localStorage.getItem('cimapro_videos')) || [];
        let isAdminLoggedIn = localStorage.getItem('admin_logged') === 'true';

        window.onload = function() {
            renderVideos();
            if (isAdminLoggedIn) {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'block';
            }
        };

        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            
            document.getElementById(sectionId + '-section').classList.add('active');
            if(sectionId === 'home') document.getElementById('nav-home').classList.add('active');
            if(sectionId === 'admin') document.getElementById('nav-admin').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderVideos() {
            const grid = document.getElementById('video-grid');
            const filter = document.getElementById('filter-type').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            grid.innerHTML = '';

            let filtered = videos.filter(v => {
                let matchesFilter = (filter === 'الكل' || v.type === filter);
                let matchesSearch = v.title.toLowerCase().includes(searchQuery) || v.desc.toLowerCase().includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: var(--text-muted);"><h3>لا توجد عروض مطابقة للبحث حالياً.</h3></div>`;
                return;
            }

            filtered.forEach(v => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-container">
                            <img src="${v.thumb}" alt="${v.title}">
                            <div class="card-badge">${v.type}</div>
                        </div>
                        <div class="card-content">
                            <h3>${v.title}</h3>
                            <p>${v.desc.substring(0, 80)}...</p>
                            <div class="card-meta">
                                <span>⏱️ ${v.duration} دقيقة</span>
                                <span style="color: #facc15;">⭐ 4.8 / 5</span>
                            </div>
                            <button class="btn" onclick="playVideo(${v.id})">مشاهدة الآن</button>
                        </div>
                    </div>
                `;
            });
        }

        function playVideo(id) {
            const v = videos.find(item => item.id === id);
            if (!v) return;

            const playerSection = document.getElementById('player-section');
            playerSection.style.display = 'block';
            document.getElementById('player-title').innerText = `🎥 العرض الحالي: ${v.title}`;
            document.getElementById('player-desc').innerText = v.desc;
            
            const player = document.getElementById('main-video-player');
            player.src = v.url;
            player.play();

            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function closePlayer() {
            const player = document.getElementById('main-video-player');
            player.pause();
            player.src = '';
            document.getElementById('player-section').style.display = 'none';
        }

        function loginAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();
            const alertBox = document.getElementById('login-alert');

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                isAdminLoggedIn = true;
                localStorage.setItem('admin_logged', 'true');
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'block';
            } else {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة!';
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            localStorage.setItem('admin_logged', 'false');
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('dashboard-container').style.display = 'none';
        }

        function uploadNewVideo() {
            const title = document.getElementById('v-title').value.trim();
            const type = document.getElementById('v-type').value;
            const duration = parseInt(document.getElementById('v-duration').value);
            const thumbFile = document.getElementById('v-thumb-file').files[0];
            const videoFile = document.getElementById('v-video-file').files[0];
            const desc = document.getElementById('v-desc').value.trim();
            const alertBox = document.getElementById('upload-alert');

            alertBox.style.display = 'none';

            // الشرط البرمجي الصارم للأفلام (أقصى مدة 120 دقيقة)
            if (type === 'فيلم' && duration > 120) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = '❌ شرط النظام يمنع نهائياً نشر أفلام تتجاوز مدتها ساعتين (120 دقيقة)!';
                return;
            }

            if (!title || !thumbFile || !videoFile) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = '⚠️ يرجى التأكد من كتابة العنوان واختيار صورة الغلاف وملف الفيديو من جهازك.';
                return;
            }

            const readerThumb = new FileReader();
            const readerVideo = new FileReader();

            readerThumb.onload = function(e) {
                const thumbResult = e.target.result;
                
                readerVideo.onload = function(ev) {
                    const videoResult = ev.target.result;

                    const newVid = {
                        id: Date.now(),
                        title,
                        type,
                        duration,
                        thumb: thumbResult,
                        url: videoResult,
                        desc: desc || 'لا يوجد وصف متاح لهذا العمل حالياً.'
                    };

                    videos.push(newVid);
                    localStorage.setItem('cimapro_videos', JSON.stringify(videos));

                    alertBox.style.display = 'block';
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = `🎉 تم رفع ونشر "${title}" بنجاح على المنصة!`;

                    // إعادة التعيين
                    document.getElementById('v-title').value = '';
                    document.getElementById('v-thumb-file').value = '';
                    document.getElementById('v-video-file').value = '';
                    document.getElementById('v-desc').value = '';

                    renderVideos();
                };
                readerVideo.readAsDataURL(videoFile);
            };
            readerThumb.readAsDataURL(thumbFile);
        }
    </script>
</body>
</html>
