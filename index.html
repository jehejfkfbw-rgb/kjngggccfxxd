<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09031B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop stop-color=%22%23F10CFF%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%238B35FF%22/%3E%3Cstop offset=%221%22 stop-color=%22%2300E7FF%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2217%22 fill=%22url(%23g)%22/%3E%3Ctext x=%2232%22 y=%2246%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2240%22 font-weight=%22900%22 fill=%22white%22%3ES%3C/text%3E%3C/svg%3E">
<title>SnapVibe | منصة التواصل الاجتماعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --icon:url("snapvibe-logo.png");
  --bg:#000000;--surface:#151517;--surface2:#1c1c20;--line:#28282c;
  --text:#FFFFFF;--muted:#8b8b92;--purple:#B51CFF;--cyan:#25F4EE;--pink:#FE2C55;
  --danger:#FF3B5C;--success:#2ECC71;--warning:#FFC531;
  --grad:linear-gradient(135deg,#F10CFF 0%,#8B35FF 45%,#00E7FF 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000}
body{font-family:Cairo,system-ui,sans-serif;color:var(--text);display:flex;justify-content:center;letter-spacing:-.1px}
button,input,textarea{font:inherit}
input,textarea{background:var(--surface);color:var(--text);border:1px solid transparent;border-radius:10px;padding:11px 13px;outline:none;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(254,44,85,.55);outline-offset:2px}
#app{width:100%;max-width:480px;height:100dvh;min-height:560px;background:var(--bg);position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.hidden{display:none!important}
svg{width:24px;height:24px;display:block}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:481px){#app{height:92dvh;margin:4dvh 0;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 80px rgba(0,0,0,.6)}}

/* Brand / splash */
.s-logo{width:150px;height:150px;border-radius:38px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:94px;font-weight:900;font-family:Arial,sans-serif;line-height:1;text-shadow:0 8px 28px rgba(0,0,0,.3);box-shadow:0 24px 70px rgba(254,44,85,.28),0 0 45px rgba(37,244,238,.14);animation:s-pop .6s cubic-bezier(.2,.8,.2,1)}
.splash-welcome{font-size:14px;color:#eee;margin-top:18px;font-weight:600}.splash-title{font-size:22px;margin-top:20px;font-weight:800;letter-spacing:-.3px}
.splash-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8;max-width:280px}
@keyframes s-pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.splash{align-items:center;justify-content:center;text-align:center;padding:30px;background:var(--bg)}
.logo{width:88px;height:88px;border-radius:22px;overflow:hidden;display:grid;place-items:center;background-image:var(--icon);background-size:cover;background-position:center}
.brand{font-size:29px;font-weight:800;margin-top:16px;letter-spacing:-.4px}
.tagline{font-size:13px;color:var(--muted);margin-top:3px}
.loader{width:110px;height:2.5px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:28px}
.loader i{display:block;width:40%;height:100%;background:var(--pink);animation:load 1.05s infinite}
@keyframes load{from{transform:translateX(260%)}to{transform:translateX(-260%)}}

/* Auth */
.auth{padding:38px 24px 24px;overflow:auto}
.auth-head{text-align:center;margin-bottom:30px}
.auth-head .logo{width:54px;height:54px;border-radius:16px;margin:0 auto 16px}
h1,h2,p{margin:0}
h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.muted{color:var(--muted);font-size:13px;line-height:1.75}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}
.field input,.field textarea{
width:100%;background:var(--surface);color:var(--text);border:1px solid transparent;
border-radius:10px;padding:14px 15px;outline:none;font-size:14.5px
}
.field input:focus,.field textarea:focus{border-color:var(--text)}
.error{color:var(--danger);font-size:12px;margin-top:6px;display:none}
.btn{border:0;border-radius:9px;padding:13px 16px;font-weight:700;font-size:14px;min-height:46px}
.btn-primary{background:var(--pink);color:#fff}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#04140c}
.btn-sm{min-height:34px;padding:7px 12px;font-size:12px;border-radius:8px}
.full{width:100%}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.7;margin-top:13px}
.auth-switch{display:block;width:100%;margin-top:13px;border:0;background:none;color:var(--muted);font-size:12px;padding:9px;text-align:center;cursor:pointer}.auth-switch b{color:var(--pink);font-weight:700}.secure-warning{margin:12px 0;padding:11px 12px;border:0;background:rgba(255,197,49,.09);border-radius:10px;color:#f6d47a;font-size:11px;line-height:1.7}.review-box{margin:12px 0;padding:14px;border:0;background:var(--surface);border-radius:12px;text-align:center}.review-box b{display:block;color:var(--warning);font-size:14px;margin-bottom:4px;font-weight:700}.review-box span{color:var(--muted);font-size:11px}

.permission-screen{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px}.permission-screen h1{font-size:20px;margin:14px 0 8px}.permission-screen p{max-width:320px;margin-bottom:20px}.permission-icon{width:82px;height:82px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:38px}
/* Top bar */
.topbar{height:54px;min-height:54px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;position:relative;background:rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:4}
.topbar .side{position:absolute;display:grid;place-items:center;width:38px;height:38px;border:0;background:transparent;color:var(--text)}
.topbar .right{right:8px}.topbar .left{left:8px}
.settings-btn{position:absolute;left:8px;top:9px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:19px;display:grid;place-items:center}.settings-sheet{padding-bottom:24px}.settings-sheet .setting-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 2px;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;color:var(--text);margin-top:0;text-align:right}.settings-sheet .setting-item.danger{color:var(--danger)}

/* Feed */
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.feed::-webkit-scrollbar{display:none}
.video-card{height:100%;min-height:100%;scroll-snap-align:start;position:relative;background:#000;overflow:hidden}
.video-card>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.sound-btn{position:absolute;right:12px;top:64px;z-index:4;width:38px;height:38px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center}.sound-btn svg{width:20px;height:20px}
.video-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 22%,transparent 56%,rgba(0,0,0,.82))}
.feed-head{position:absolute;top:0;left:0;right:0;z-index:2;padding:15px 16px;text-align:center;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.feed-head span{color:rgba(255,255,255,.5);margin-right:24px}
.meta{position:absolute;right:16px;left:80px;bottom:22px;z-index:2}
.user{font-size:15px;font-weight:700;margin-bottom:5px}
.caption{font-size:13.5px;line-height:1.7;color:#f2f2f2}
.song{display:inline-flex;gap:5px;align-items:center;margin-top:8px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);border:0;color:#fff;font-size:10.5px}
.song svg{width:13px;height:13px;color:var(--cyan)}
.actions{position:absolute;left:10px;bottom:22px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:19px}
.avatar{display:grid;place-items:center;background:var(--grad);font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);margin-bottom:2px}
.action{border:0;background:none;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.action svg{width:30px;height:30px}
.action span{font-size:11.5px;font-weight:700}
.action.liked{color:var(--pink)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:35px;line-height:1.8}

/* Bottom nav */
.bottom{height:64px;min-height:64px;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:6;padding-bottom:max(5px,env(safe-area-inset-bottom))}
.nav{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
.nav.active{color:var(--text)}
.nav-icon{width:22px;height:22px;display:grid;place-items:center;font-size:19px}.top-search{position:absolute;left:8px;top:9px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:19px;display:grid;place-items:center;pointer-events:auto;z-index:20;cursor:pointer}.home-topbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}.home-topbar b{pointer-events:auto;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.5)}.search-title{font-weight:700;margin:16px 2px 7px;color:var(--muted);font-size:12px}.person-result{min-height:64px}.search-person-info{flex:1;min-width:0;overflow:hidden}.search-person-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.video-result{align-items:flex-start}.video-result video{flex:0 0 60px}
.search-panel{max-height:75vh;overflow:auto}.search-result{display:flex;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;margin-top:0}.search-result video{width:58px;height:74px;object-fit:cover;border-radius:8px}.messages-list{max-height:58vh;overflow:auto}.message-row{padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;margin-top:0}.message-bubble{padding:9px 12px;border-radius:14px;background:var(--surface2);margin-top:6px;line-height:1.6}.message-compose{display:flex;gap:7px;margin-top:10px}.message-compose input{flex:1}.terms{line-height:1.9;text-align:right;color:#eee;font-size:13px}.terms strong{color:var(--pink)}
.add{position:relative;width:46px;height:32px;border:0;border-radius:8px;background:#fff;color:#0a0a0a;display:grid;place-items:center;margin-top:-2px;z-index:1}
.add:before,.add:after{content:"";position:absolute;top:0;bottom:0;width:100%;border-radius:8px;z-index:-1}
.add:before{background:var(--cyan);left:-6px}
.add:after{background:var(--pink);right:-6px}
.add svg{width:20px;height:20px}

.account-box{margin:0 18px 14px;padding:16px;border:0;background:var(--surface);border-radius:14px}.account-email{font-size:11px;color:var(--muted);direction:ltr;text-align:center;margin-top:3px}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn-outline-danger{background:transparent;color:var(--danger);border:1px solid rgba(255,59,92,.4)}
/* Profile */
.profile-head{text-align:center;padding:24px 18px 14px}
.avatar.lg{width:88px;height:88px;border-radius:50%;margin:0 auto 10px;font-size:29px;position:relative}
.avatar-edit{position:absolute;bottom:0;left:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--bg)}
.avatar-edit svg{width:13px;height:13px}
.profile-name{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.icon-btn{border:0;background:none;color:var(--muted);padding:3px}
.stats{display:flex;justify-content:center;gap:38px;margin-top:12px}
.stats b{display:block;font-size:16px;font-weight:700}.stats span{color:var(--muted);font-size:11px}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.cell{aspect-ratio:9/14;background:var(--surface);position:relative;overflow:hidden}
.cell video{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:5px;right:5px;border-radius:6px;padding:2px 6px;font-size:9px;font-weight:700}
.pending{background:var(--warning);color:#2a2000}.approved{background:var(--success);color:#04140c}.rejected{background:var(--danger);color:#fff}
.privacy{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 5px;font-size:9px}
.review-note{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:0;border-radius:12px;padding:11px 12px;font-size:10px;color:var(--muted)}
.review-note b{color:var(--text);white-space:nowrap}.review-note span{line-height:1.6}

/* Create */
.camera{flex:1;position:relative;background:#000;overflow:hidden}
.camera>video,.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camera:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 30%,rgba(0,0,0,.58))}
.cambar{position:absolute;top:0;left:0;right:0;z-index:4;height:58px;display:flex;justify-content:space-between;align-items:center;padding:9px 12px}
.round{width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center}
.music-row{position:absolute;top:67px;left:12px;right:12px;z-index:4;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.music-row::-webkit-scrollbar{display:none}
.music{flex:0 0 auto;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.4);color:#fff;border-radius:18px;padding:6px 10px;font-size:10px}
.music.sel{background:var(--pink);color:#fff;border-color:transparent;font-weight:700}
.controls{position:absolute;bottom:23px;left:0;right:0;z-index:4;display:flex;justify-content:center;align-items:center;gap:30px}
.rec{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center}
.rec i{width:54px;height:54px;border-radius:50%;background:var(--pink);display:block;transition:.2s}
.rec.recording i{width:26px;height:26px;border-radius:7px}
.tool{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.tool small{display:block;font-size:8px}
.timer{position:absolute;top:17px;left:0;right:0;text-align:center;z-index:5;color:var(--pink);font-weight:700}

/* Sheets / modals */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow:auto;background:var(--surface2);border-radius:20px 20px 0 0;padding:16px 18px max(18px,env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(20px)}to{transform:none}}
.handle{width:34px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.sheet h2{font-size:16px;margin-bottom:13px;font-weight:700}
.preview-thumb{width:100%;max-height:190px;object-fit:cover;border-radius:12px;background:#000;margin-bottom:12px}
.privacy-list{display:grid;gap:7px;margin:12px 0}
.privacy-opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.privacy-opt.sel{border-color:var(--pink);background:rgba(254,44,85,.1)}
.privacy-opt svg{width:20px}.privacy-opt b{font-size:13px}.privacy-opt small{display:block;color:var(--muted);font-size:10px}
.comments{height:67%;display:flex;flex-direction:column}
.comment-list{flex:1;overflow:auto}
.comment{display:flex;gap:9px;padding:9px 0}
.cav{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.comment-name{color:var(--muted);font-size:10px}.comment-text{font-size:13px}
.comment-input{display:flex;gap:7px;margin-top:8px}
.comment-input input{flex:1;border:0;background:var(--surface);color:var(--text);border-radius:20px;padding:10px 14px;outline:none}
.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--pink);display:grid;place-items:center;color:#fff}
.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:60;background:#242428;border:0;padding:9px 15px;border-radius:22px;font-size:11px;white-space:nowrap;animation:fade .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* Admin */
.admin-list{flex:1;overflow:auto;padding:4px 14px}
.filters{display:flex;gap:7px;overflow:auto;padding:11px 11px 0}
.admin-card{display:flex;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;margin-bottom:0}
.admin-thumb{width:64px;height:88px;flex:none;background:#000;border-radius:8px;overflow:hidden}
.admin-thumb video{width:100%;height:100%;object-fit:cover}
.admin-info{min-width:0;flex:1}.admin-info b{font-size:12px}.admin-cap{font-size:10px;color:var(--muted);line-height:1.6;margin:3px 0 8px}
.admin-actions{display:flex;gap:5px;flex-wrap:wrap}
.status{font-size:9px;border-radius:6px;padding:2px 6px;margin-right:4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}

.brand-s,.s-logo{display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-weight:900;text-shadow:0 3px 18px rgba(0,0,0,.25)}
.brand-s{width:76px;height:76px;border-radius:20px;font-size:44px;margin:0 auto 16px;box-shadow:0 12px 32px rgba(254,44,85,.22)}.s-logo{width:150px;height:150px;border-radius:38px;font-size:94px;margin:0 auto 24px}.relation-tabs{display:flex;gap:6px;overflow:auto;padding:3px 0 8px;scrollbar-width:none}.relation-tabs::-webkit-scrollbar{display:none}.relation-tabs .btn{white-space:nowrap}.relation-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:0;padding:12px 0;border-bottom:1px solid var(--line)}.relation-main{display:flex;align-items:center;gap:9px;min-width:0}.relation-main>div:last-child{min-width:0}.relation-actions{display:flex;gap:6px;flex-shrink:0}.request-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(254,44,85,.14);color:var(--pink);font-size:10px;font-weight:600}.message-request{border:0;background:var(--surface);border-radius:12px;padding:12px;margin-bottom:8px}.message-request .request-actions{display:flex;gap:7px;margin-top:9px}.message-request .request-actions button{flex:1}.profile-relations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.profile-relations .btn{width:100%;min-width:0}@media(max-width:520px){.profile-relations{grid-template-columns:1fr 1fr}.relation-actions .btn{padding:7px 9px;font-size:10px}}
</style>
</head>
<body>
<div id="app"><div id="bootSplash" class="screen splash" aria-label="SnapVibe"><div class="s-logo">S</div><div class="splash-welcome splash-title">أهلاً بيك 👋</div><div class="splash-welcome">مرحبًا بك في SnapVibe</div><div class="splash-desc">منصتك الاجتماعية لمشاركة الفيديوهات القصيرة، اكتشاف محتوى جديد والتواصل مع الآخرين.</div><div class="loader"><i></i></div></div></div>
<script>
(function(){
  function fallback(){
    var a=document.getElementById('app');
    if(!a || !a.querySelector('#bootSplash')) return;

      Object.entries(rawAccounts).forEach(([key,a])=>{

 // مهم: شاشة الدخول تظهر قبل تحميل قاعدة البيانات في الخلفية، لذلك نضمن تحميلها عند الضغط على دخول.

let audioUnlocked=false;
let feedObserver=null;
function videoGesture(v){
  // أول لمسة من المستخدم تسمح للمتصفح بتشغيل الصوت، ثم نفعّل صوت الفيديو الحالي فقط.
  audioUnlocked=true;
  const card=v.closest('.video-card');
  document.querySelectorAll('#feed video').forEach(x=>{
    if(x!==v){x.pause();x.muted=true; const b=x.closest('.video-card')?.querySelector('.sound-btn'); if(b)b.textContent='🔇';}
  });
  v.muted=false;
  v.play().catch(()=>{v.muted=true;});
  const b=card?.querySelector('.sound-btn'); if(b){b.textContent=v.muted?'🔇':'🔊';b.setAttribute('aria-label',v.muted?'تشغيل الصوت':'كتم الصوت');}
}

function toggleSound(e,btn){
 e.stopPropagation();

 const card=btn.closest('.video-card'),v=card?.querySelector('video'); if(!v)return;
 document.querySelectorAll('#feed video').forEach(x=>{
   if(x!==v){x.pause();x.muted=true; const b=x.closest('.video-card')?.querySelector('.sound-btn'); if(b)b.textContent='🔇';}
 });
 v.muted=!v.muted;
 if(!v.muted){v.play().catch(()=>{});btn.textContent='🔊';btn.setAttribute('aria-label','كتم الصوت')}
 else{btn.textContent='🔇';btn.setAttribute('aria-label','تشغيل الصوت')}

// نفس المشكلة: كانت تُستدعى عند التمرير في الفيديوهات لكنها غير موجودة أصلًا
// (لا يوجد تحميل صفحات إضافي حاليًا، فتُركت بدون أي عملية لمنع توقف الصفحة).
function loadMoreFeed(){}
function setupFeedPlayback(){
 const feed=document.getElementById('feed');
 const videos=[...document.querySelectorAll('#feed video')];
 if(!videos.length)return;
 if(feedObserver)feedObserver.disconnect();
 if(feed && !feed.dataset.infiniteBound){
   feed.dataset.infiniteBound="1";
   feed.addEventListener('scroll',()=>{
     if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-Math.max(700,feed.clientHeight*1.5))loadMoreFeed();
   },{passive:true});
 }
 if(feed && !feed.dataset.wheelBound){
   feed.dataset.wheelBound="1";
   feed.addEventListener('wheel',()=>{setTimeout(()=>{if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-900)loadMoreFeed()},80)},{passive:true});
 }
 feedObserver=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
     const v=entry.target, card=v.closest('.video-card'), b=card?.querySelector('.sound-btn');
     if(entry.isIntersecting && entry.intersectionRatio>=0.7){
       videos.forEach(x=>{
         if(x!==v){x.pause();x.muted=true;const bb=x.closest('.video-card')?.querySelector('.sound-btn');if(bb)bb.textContent='🔇';}
       });
       v.play().catch(()=>{});
       // لا يمكن للمتصفح إجبار الصوت بدون تفاعل المستخدم. بعد أول تفاعل، ينتقل الصوت للفيديو الظاهر فقط.
       if(audioUnlocked){v.muted=false; if(b)b.textContent='🔊'; v.play().catch(()=>{v.muted=true;if(b)b.textContent='🔇';});}
       else {v.muted=true;if(b)b.textContent='🔇';}
     }else if(!entry.isIntersecting){
       v.pause();v.muted=true;if(b)b.textContent='🔇';
     }
   });
 },{threshold:[0.7]});
 videos.forEach(v=>feedObserver.observe(v));
}

 const inp=app.querySelector('#messageText'),text=inp?.value.trim();if(!text)return;const now=Date.now();me.messages=relList(me,'messages');to.messages=relList(to,'messages');const msg={id:'m'+now+Math.random().toString(36).slice(2),from:me.email,to:to.email,text,at:now};me.messages.push(msg);to.messages.push(msg);save();render();
}

function runSearch(q){
 const box=document.getElementById('searchResults');
 if(!box)return;
 const raw=String(q||'').trim();
 const query=normalizeSearchText(raw);
 if(!query){
   box.innerHTML='<div class="empty" style="height:auto;padding:25px">اكتب اسم الشخص أو اسم المستخدم أو جزءًا من وصف الفيديو.</div>';
   return;
 }
 const me=account();
 const people=realPeople().filter(a=>{
   const name=normalizeSearchText(a.name);
   const email=normalizeSearchText(a.email);
   return name.includes(query)||email.includes(query)||email.replace(/@.*/,'').includes(query);
 }).slice(0,30);
 const vids=visibleVideos().filter(v=>{
   const owner=normalizeSearchText(v.ownerName);
   const caption=normalizeSearchText(v.caption);
   return owner.includes(query)||caption.includes(query);
 }).slice(0,20);
 let html='';
 if(people.length){
   html+='<div class="search-title">الأشخاص</div>';
   html+=people.map(a=>{
     const rel=me?relationStatus(a.email):'none';
     const avatar=a.avatar?`<img src="${esc(a.avatar)}" alt="${esc(a.name||'صورة الحساب')}">`:initials(a.name);
     let action='';
     if(me){
       if(rel==='friends') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إزالة الصداقة</button><button class="btn btn-sm btn-ghost" onclick="closeSearch();openChat('${esc(a.email)}')">💬</button>`;
       else if(rel==='sent') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إلغاء الطلب</button>`;
       else if(rel==='incoming') action=`<button class="btn btn-sm btn-primary" onclick="acceptFriendRequest('${esc(a.email)}')">قبول الطلب</button>`;
       else action=`<button class="btn btn-sm btn-primary" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">متابعة</button>`;
     }
     return `<div class="search-result person-result"><div class="avatar sm">${avatar}</div><div class="search-person-info"><b>${esc(a.name||'مستخدم')}</b><div class="muted">@${esc(String(a.email).split('@')[0])}</div></div>${action}</div>`;
   }).join('');
 }
 if(vids.length){
   html+='<div class="search-title">الفيديوهات</div>';
   html+=vids.map(v=>`<div class="search-result video-result"><video src="${esc(videoSrc(v))}" muted playsinline controls></video><div style="flex:1;min-width:0"><b>@${esc(v.ownerName||'مستخدم')}</b><div class="muted" style="margin-top:3px">${esc(v.caption||'بدون وصف')}</div><button class="btn btn-sm btn-primary" style="margin-top:7px" onclick="closeSearch();state.ui.comments='${esc(v.id)}';render()">عرض الفيديو</button></div></div>`).join('');
 }
 box.innerHTML=html||'<div class="empty" style="height:auto;padding:25px">لم يتم العثور على شخص أو فيديو بهذا الاسم.</div>';
}

/* ---------- IndexedDB for local video blobs ---------- */
const DB="viral_video_db",STORE="files";
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(id,blob){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function dbGet(id){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,"readonly"),r=tx.objectStore(STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function hydrateVideos(){for(const v of state.videos){if(v.fileId&&!v.src){try{const b=await dbGet(v.fileId);if(b)v.src=URL.createObjectURL(b)}catch(e){}}}}
async function removeFile(id){try{const db=await dbOpen();const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id)}catch(e){}}

async function requestMediaPermissions(){
  if(location.protocol==="content:"){
    state.ui.permissions=true;render();
    const title=app.querySelector("#permissionTitle"),text=app.querySelector("#permissionText"),retry=app.querySelector("#permissionRetry");
    if(title)title.textContent="المتصفح يمنع الكاميرا من الملف المحلي";
    if(text)text.innerHTML="أنت فاتح SnapVibe من شاشة التنزيلات <b>content://</b>. في هذه الحالة Chrome لا يسمح لصفحة الملف المحلي بطلب الكاميرا والميكروفون. استخدم زر <b>تصوير بكاميرا الهاتف</b> أسفل، أو افتح SnapVibe من رابط <b>HTTPS</b>.";
    if(retry)retry.style.display="none";
    return false;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    toast("المتصفح لا يدعم الكاميرا والميكروفون. استخدم Chrome حديثًا.");
    return false
  }
  if(!window.isSecureContext && location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){
    toast("افتح SnapVibe من رابط HTTPS حتى تعمل أذونات الكاميرا والمايك.");
    return false
  }
  try{
    const temp=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"user"}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    temp.getTracks().forEach(t=>t.stop());
    state.ui.permissions=false;
    render();
    setTimeout(startCamera,120);
    return true
  }catch(e){
    console.error("SnapVibe permission error:",e);
    state.ui.permissions=true;
    render();
    const title=app.querySelector("#permissionTitle"), text=app.querySelector("#permissionText"), retry=app.querySelector("#permissionRetry");
    if(title)title.textContent="الكاميرا والميكروفون غير مسموح بهما";
    if(text)text.innerHTML="اسمح للمتصفح باستخدام <b>الكاميرا والميكروفون</b> ثم اضغط إعادة المحاولة.<br>في Chrome على الهاتف: افتح <b>إعدادات الموقع 🔒</b> بجوار عنوان الصفحة، واجعل الكاميرا والميكروفون على <b>سماح</b>.";
    if(retry)retry.style.display="block";
    return false
  }
}

async function startCamera(){
 const v=app.querySelector("#camPreview"),fallback=app.querySelector("#camFallback"),err=app.querySelector("#camErrorText");if(!v)return;
 if(!window.isSecureContext && location.hostname!="localhost" && location.hostname!="127.0.0.1"){
   if(fallback)fallback.classList.remove("hidden");
   if(err)err.textContent="الكاميرا والميكروفون يحتاجان HTTPS أو localhost. ارفع index.html على موقع HTTPS مثل Vercel أو Netlify.";
   return;
 }
 if(!navigator.mediaDevices?.getUserMedia){
   if(fallback)fallback.classList.remove("hidden");
   if(err)err.textContent="المتصفح الحالي لا يدعم تشغيل الكاميرا. استخدم Chrome أو Edge حديثًا.";
   return;
 }
 try{
  if(!stream) stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:1080},height:{ideal:1920}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  v.srcObject=stream;
  await v.play().catch(()=>{});
  if(fallback)fallback.classList.add("hidden");
 }catch(e){
  if(fallback)fallback.classList.remove("hidden");
  if(err)err.textContent=e?.name==="NotAllowedError"?"تم رفض إذن الكاميرا أو الميكروفون. افتح إعدادات الموقع واسمح بالوصول ثم اضغط تشغيل الكاميرا.":"تعذر تشغيل الكاميرا. جرّب Chrome على HTTPS أو localhost.";
 }
}
function stopMusic(){
 if(musicTimer){clearInterval(musicTimer);musicTimer=null}
 musicStep=0;
}
function setupAudioMix(){
 if(!stream)return stream;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
  mixDest=audioCtx.createMediaStreamDestination();
  micSource=audioCtx.createMediaStreamSource(stream);
  const micGain=audioCtx.createGain();micGain.gain.value=1;micSource.connect(micGain).connect(mixDest);
  if(state.ui.song!==SONGS[0]) startMusic(audioCtx,mixDest);
  const tracks=[...stream.getVideoTracks(),...mixDest.stream.getAudioTracks()];
  return new MediaStream(tracks);
 }catch(e){return stream}
}
function startMusic(ctx,dest){
 stopMusic();
 const patterns={
  "إيقاع هادي":[220,247,262,247],
  "حماس ورقص":[262,330,392,330],
  "شعبي مصري":[196,220,247,220],
  "بيانو حزين":[220,196,174,196],
  "تريند 🔥":[330,392,494,392]
 };
 const notes=patterns[state.ui.song]||patterns["إيقاع هادي"];
 musicStep=0;
 const playNote=()=>{
   const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=notes[musicStep%notes.length];
   g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.055,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.34);
   o.connect(g).connect(dest);o.start();o.stop(ctx.currentTime+.36);musicStep++;
 };
 playNote();musicTimer=setInterval(playNote,380);
}
function stopCamera(){
 stopMusic();
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 recordStream=null;
 if(timer){clearInterval(timer);timer=null}
}

function renderCreate(){
 if(state.ui.permissions)return `<div class="screen fade"><div class="permission-screen"><div class="permission-icon">📷🎙️</div><h1 id="permissionTitle">السماح بالكاميرا والميكروفون</h1><p id="permissionText" class="muted">SnapVibe يحتاج إذن الكاميرا والميكروفون حتى تقدر تصور فيديو بالصوت والصورة. اضغط الزر وسيسأل المتصفح عن الإذنين، ولن يبدأ التسجيل قبل موافقتك.</p><button id="permissionRetry" class="btn btn-primary full" style="display:none" onclick="requestMediaPermissions()">إعادة المحاولة</button><button class="btn btn-primary full" onclick="requestMediaPermissions()">السماح وتشغيل الكاميرا</button><button class="btn btn-primary full" style="margin-top:9px" onclick="openPhoneCamera()">📷 تصوير بكاميرا الهاتف</button><button class="btn btn-ghost full" style="margin-top:9px" onclick="state.ui.permissions=false;render();setTimeout(()=>document.getElementById('videoFile')?.click(),50)">رفع فيديو من الجهاز</button><input id="cameraCapture" type="file" accept="video/*" capture="environment" class="hidden" onchange="uploadVideo(event)"><p class="note" style="margin-top:14px">لو الصفحة مفتوحة من <b>content://</b> في شاشة التنزيلات، استخدم «تصوير بكاميرا الهاتف» أو افتح الموقع من HTTPS حتى تعمل أذونات الكاميرا والميكروفون داخل SnapVibe.</p></div></div>`;
 if(state.ui.stage==="preview")return `<div class="screen fade"><div class="camera"><video class="preview" src="${esc(state.ui.recorded)}" autoplay loop playsinline controls></video><div class="cambar"><button class="round" onclick="retake()">${ICON.close}</button><b>معاينة</b><span style="width:40px"></span></div><div class="controls"><button class="btn btn-ghost btn-sm" onclick="retake()">إعادة</button><button class="btn btn-primary btn-sm" onclick="state.ui.publish=true;render()">التالي</button></div></div>${publishSheet()}</div>`;
 return `<div class="screen fade"><div class="camera"><video id="camPreview" autoplay muted playsinline></video><div id="camFallback" class="empty hidden" style="position:absolute;inset:0;z-index:3;background:#05060b"><div><b>الكاميرا أو الميكروفون غير متاحين</b><br><span id="camErrorText">اسمح للمتصفح باستخدام الكاميرا والميكروفون، أو ارفع فيديو من جهازك.</span><br><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="startCamera()">تشغيل الكاميرا</button><button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="openPhoneCamera()">📷 تصوير بكاميرا الهاتف</button></div></div>
 <div class="cambar"><button class="round" onclick="go('home')">${ICON.close}</button><b>فيديو جديد</b><span style="width:40px"></span></div>
 <div class="music-row">${SONGS.map(s=>`<button class="music ${state.ui.song===s?"sel":""}" onclick="state.ui.song='${esc(s)}';render();setTimeout(startCamera,50)">${ICON.music}${esc(s)}</button>`).join("")}</div>
 ${state.ui.recording?`<div class="timer">${timerText(state.ui.seconds||0)}</div>`:""}
 <div class="controls"><button class="tool" onclick="document.getElementById('videoFile').click()">${ICON.upload}</button><button class="rec ${state.ui.recording?"recording":""}" onclick="recordToggle()"><i></i></button><button class="tool" onclick="toast('🎙️ صوت الميكروفون سيُحفظ داخل الفيديو عند التسجيل')" aria-label="الميكروفون">${ICON.mic}</button></div>
 <input id="videoFile" type="file" accept="video/*" class="hidden" onchange="uploadVideo(event)"><input id="cameraCapture" type="file" accept="video/*" capture="environment" class="hidden" onchange="uploadVideo(event)"><div style="position:absolute;bottom:4px;left:12px;right:12px;z-index:4;text-align:center;color:rgba(255,255,255,.65);font-size:9px">الحد الأقصى للفيديو 5 دقائق. التسجيل يحفظ صوت الميكروفون. تشغيل الكاميرا يحتاج HTTPS أو localhost.</div></div></div>`
}
function timerText(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function bestMime(){
 const types=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"];
 return types.find(t=>window.MediaRecorder?.isTypeSupported?.(t))||"";
}
function recordToggle(){
 if(!stream){toast("فعّل الكاميرا والميكروفون أولًا");return}
 if(!state.ui.recording){
  chunks=[];recordStream=setupAudioMix();
  try{
   const mime=bestMime();recorder=mime?new MediaRecorder(recordStream,{mimeType:mime}):new MediaRecorder(recordStream);
  }catch(e){toast("التسجيل غير متاح على هذا المتصفح. جرّب Chrome حديثًا.");return}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
   const type=recorder.mimeType||"video/webm";
   const blob=new Blob(chunks,{type});
   state.ui.recorded=URL.createObjectURL(blob);state.ui.recordedBlob=blob;state.ui.recordedIsBlob=true;state.ui.videoDuration=state.ui.seconds||0;state.ui.stage="preview";state.ui.recording=false;stopCamera();render();
  };
  recorder.start(250);state.ui.recording=true;state.ui.seconds=0;render();setTimeout(startCamera,30);
  timer=setInterval(()=>{state.ui.seconds++;const t=app.querySelector(".timer");if(t)t.textContent=timerText(state.ui.seconds);if(state.ui.seconds>=MAX_VIDEO_SECONDS)recordToggle()},1000)
 }else{
  if(timer){clearInterval(timer);timer=null}state.ui.recording=false;
  if(recorder&&recorder.state!=="inactive")recorder.stop();
 }
}
function uploadVideo(e){
 const f=e.target.files[0];if(!f)return;
 if(!f.type.startsWith("video/")){toast("اختر ملف فيديو صحيحًا");return}
 // لا يوجد حد لعدد الفيديوهات التي يمكن نشرها. الحد الأساسي هنا هو مدة الفيديو (5 دقائق) ومساحة تخزين الجهاز/المتصفح.
 if(f.size>1024*1024*1024){toast("حجم الملف كبير جدًا لهذا المتصفح؛ جرّب ملفًا أصغر مع بقاء حد المدة 5 دقائق");return}
 const url=URL.createObjectURL(f);
 const probe=document.createElement("video");
 probe.preload="metadata";
 probe.onloadedmetadata=()=>{
   const duration=Number(probe.duration)||0;
   URL.revokeObjectURL(probe.src);
   if(duration>MAX_VIDEO_SECONDS+0.2){
     toast("الحد الأقصى للفيديو 5 دقائق فقط");
     e.target.value="";
     return;
   }
   state.ui.recorded=URL.createObjectURL(f);state.ui.recordedBlob=f;state.ui.recordedIsBlob=true;state.ui.uploadFile=f;state.ui.stage="preview";state.ui.videoDuration=duration;stopCamera();render();
 };
 probe.onerror=()=>{URL.revokeObjectURL(probe.src);toast("تعذر قراءة مدة الفيديو");e.target.value=""};
 probe.src=url;
}
function retake(){if(state.ui.recorded)try{URL.revokeObjectURL(state.ui.recorded)}catch(e){};state.ui.recorded=null;state.ui.recordedBlob=null;state.ui.uploadFile=null;state.ui.videoDuration=0;state.ui.stage="camera";render();setTimeout(startCamera,120)}
function publishSheet(){
 if(!state.ui.publish)return "";
 const opts=[["public",ICON.globe,"عام","يظهر للجميع بعد موافقة المطور"],["friends",ICON.users,"الأصدقاء فقط","مخصص للأصدقاء"],["private",ICON.lock,"خاص","يظهر لك فقط"]];
 return `<div class="overlay" onclick="if(event.target===this){state.ui.publish=false;render()}"><section class="sheet"><div class="handle"></div><h2>نشر الفيديو</h2><div class="review-box"><b>⏳ سيرسل للمطور أولًا</b><span>الفيديو يُحفظ كـ «قيد المراجعة» ويشاهده المطور بالصوت والصورة قبل أن يصبح منشورًا.</span></div><video class="preview-thumb" src="${esc(state.ui.recorded)}" controls playsinline></video><div class="field"><textarea id="caption" rows="3" placeholder="اكتب وصف الفيديو...">${esc(state.ui.captionDraft||"")}</textarea></div><div class="privacy-list">${opts.map(o=>`<button class="privacy-opt ${state.ui.privacy===o[0]?"sel":""}" onclick="state.ui.privacy='${o[0]}';state.ui.captionDraft=app.querySelector("#caption")?.value||"";render()">${o[1]}<div><b>${o[2]}</b><small>${o[3]}</small></div></button>`).join("")}</div><button class="btn btn-primary full" onclick="publish()">نشر الفيديو</button></section></div>`
}
async function publish(){
 if(!state.ui.recorded){toast("لا يوجد فيديو للنشر");return}
 const a=account();if(!a||!state.session){toast("سجل الدخول أولًا");return}
 if(Number(state.ui.videoDuration)>MAX_VIDEO_SECONDS+0.2){toast("الحد الأقصى للفيديو 5 دقائق فقط");return}
 const id="v"+Date.now(),file=state.ui.uploadFile||state.ui.recordedBlob;
 const v={id,ownerEmail:state.session.email,ownerName:a.name,caption:app.querySelector("#caption")?.value.trim()||"فيديو جديد على SnapVibe ✨",privacy:state.ui.privacy,status:"pending",song:state.ui.song,likes:[],comments:[],createdAt:Date.now()};
 try{
   if(file){v.fileId=id;await dbPut(id,file)}
   else if(state.ui.recorded){const b=await fetch(state.ui.recorded).then(r=>r.blob());v.fileId=id;await dbPut(id,b)}
   // إذا تم إعداد سيرفر، أرسل الفيديو للمطور فعليًا عبر API.
   if(BACKEND_URL && file){
     const fd=new FormData();
     fd.append("video",file,file.name||("snapvibe-"+id+".webm"));
     fd.append("metadata",JSON.stringify(v));
     const resp=await fetch(BACKEND_URL.replace(/\/$/,"")+"/videos",{method:"POST",body:fd});
     if(!resp.ok)throw new Error("upload_failed");
     const remote=await resp.json().catch(()=>({}));
     if(remote.url)v.src=remote.url;
     if(remote.id)v.remoteId=remote.id;
   }
 }catch(e){
   console.error("SnapVibe publish error:",e);
   toast(BACKEND_URL?"تعذر إرسال الفيديو إلى الخادم. تحقق من رابط السيرفر ثم حاول مرة أخرى.":"تعذر حفظ الفيديو. حاول مرة أخرى.");
   return;
 }
 state.videos.unshift(v);save();
 if(state.ui.recorded)try{URL.revokeObjectURL(state.ui.recorded)}catch(e){}
 state.ui.publish=false;state.ui.recorded=null;state.ui.recordedBlob=null;state.ui.uploadFile=null;state.ui.videoDuration=0;state.ui.captionDraft="";state.screen="profile";render();
 setTimeout(()=>toast("تم الإرسال ✅ الفيديو الآن قيد المراجعة من المطور"),80);
}

/* ---------- Admin ---------- */
function renderAdmin(){
 const users=adminUsers();
 const f=state.ui.adminFilter;
 const ownerFilter=state.ui.adminOwner; const list=state.videos.filter(v=>(!ownerFilter||v.ownerEmail===ownerFilter)&&(f==="all"||v.status===f));
 return `<div class="screen fade"><div class="topbar"><b>لوحة المطور</b><button class="topbar side left" onclick="adminLogout()">${ICON.close}</button></div>
 <div class="review-note" style="margin:10px 11px 0"><b>👁️ المراجعة قبل النشر</b><span>كل فيديو يرسله أي شخص يصل هنا أولًا، حتى لو اختار عام أو أصدقاء أو خاص. لا يظهر للناس إلا بعد موافقة المطور.</span></div><div style="padding:10px 11px 0;display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-sm ${state.ui.adminTab==='videos'?'btn-primary':'btn-ghost'}" onclick="state.ui.adminTab='videos';state.ui.adminOwner=null;render()">🎬 الفيديوهات (${state.videos.length}) · قيد المراجعة ${state.videos.filter(v=>v.status==="pending").length}</button><button class="btn btn-sm ${state.ui.adminTab==='users'?'btn-primary':'btn-ghost'}" onclick="state.ui.adminTab='users';render()">👥 الأشخاص (${users.length})</button></div>
 ${state.ui.adminTab==='users'?renderAdminUsers(users):`<div class="filters">${[["all","الكل"],["pending","قيد المراجعة"],["approved","مقبول"],["rejected","مرفوض"]].map(x=>`<button class="btn btn-sm ${f===x[0]?"btn-primary":"btn-ghost"}" onclick="state.ui.adminFilter='${x[0]}';render()">${x[1]}</button>`).join("")}</div><div class="admin-list">${list.length?list.map(adminCard).join(""):`<div class="empty">لا توجد فيديوهات في هذا التصنيف.</div>`}</div>`}
 ${adminBanSheet()}</div>`
}
function renderAdminUsers(users){
 return `<div class="admin-list">${users.length?users.map(adminUserCard).join(""):`<div class="empty">لا يوجد أشخاص مسجلون حتى الآن.</div>`}</div>`
}
function adminUserCard(a){
 const blocked=isBanned(a);
 const mine=state.videos.filter(v=>v.ownerEmail===a.email);
 const status=banText(a);
 return `<div class="admin-card" style="display:block"><div style="display:flex;align-items:center;gap:10px"><div class="avatar sm">${a.avatar?`<img src="${esc(a.avatar)}">`:initials(a.name)}</div><div class="admin-info"><b>${esc(a.name||'مستخدم')}</b><div class="admin-cap">${esc(a.email)}<br>العمر: ${esc(a.age||'—')} سنة · الفيديوهات: ${mine.length}</div></div></div><div style="margin-top:8px"><span class="status ${blocked?'rejected':'approved'}">${blocked?'غير نشط · '+esc(status):'نشط'}</span>${blocked&&a.banReason?`<div class="admin-cap" style="margin-top:5px">السبب: ${esc(a.banReason)}</div>`:""}</div><div class="admin-actions" style="margin-top:9px">${blocked?`<button class="btn btn-sm btn-success" onclick="unbanUser('${esc(a.email)}')">🔓 رفع الحظر</button>`:`<button class="btn btn-sm btn-danger" onclick="openBan('${esc(a.email)}')">🚫 حظر الحساب</button>`}<button class="btn btn-sm btn-ghost" onclick="adminUserVideos('${esc(a.email)}')">🎬 فيديوهات الشخص</button></div></div>`
}
function adminUserVideos(email){state.ui.adminTab='videos';state.ui.adminFilter='all';state.ui.adminOwner=email;render()}
function adminCard(v){
 const p={public:"عام",friends:"أصدقاء",private:"خاص"}[v.privacy];
 const owner=state.accounts[v.ownerEmail];
 const blocked=owner&&isBanned(owner);
 return `<div class="admin-card"><div class="admin-thumb"><video src="${esc(videoSrc(v))}" controls preload="metadata" playsinline></video></div><div class="admin-info"><b>@${esc(v.ownerName)} <span class="status ${v.status}">${esc(v.status==="pending"?"قيد المراجعة":v.status==="approved"?"مقبول":"مرفوض")}</span></b><div class="admin-cap">${esc(v.caption)}<br>${p||""}${blocked?`<br>🚫 ${esc(banText(owner))}${owner.banReason?`<br>السبب: ${esc(owner.banReason)}`:""}`:""}</div><div class="admin-actions"><button class="btn btn-sm btn-success" onclick="statusVideo('${v.id}','approved')">${ICON.check} قبول</button><button class="btn btn-sm btn-danger" onclick="statusVideo('${v.id}','rejected')">رفض</button><button class="btn btn-sm btn-ghost" onclick="deleteVideo('${v.id}')">حذف</button>${owner&&!blocked?`<button class="btn btn-sm btn-danger" onclick="openBan('${esc(v.ownerEmail)}')">🚫 حظر صاحب الحساب</button>`:''}</div></div></div>`
}
function openBan(email){
 const e=accountKey(email);
 if(!e){toast('الحساب غير موجود');return}
 state.ui.banTarget=e;render();
}
function closeBan(){state.ui.banTarget=null;render()}
function adminBanSheet(){
 if(!state.ui.banTarget)return '';
 const a=getAccount(state.ui.banTarget);if(!a)return '';
 const blocked=isBanned(a);
 return `<div class="overlay" onclick="if(event.target===this)closeBan()"><section class="sheet"><div class="handle"></div><h2>حظر الحساب</h2><p class="muted">${esc(a.name)} · ${esc(a.email)}</p><div class="review-box" style="margin:8px 0"><b>الحالة: ${blocked?'غير نشط 🚫':'نشط ✅'}</b><span>اختر أحد الخيارين فقط: 24 ساعة أو حظر دائم.</span></div><button class="btn btn-danger full" onclick="banUser('${esc(a.email)}','permanent')">🚫 حظر دائم</button><button class="btn btn-primary full" style="margin-top:8px" onclick="banUser('${esc(a.email)}',24)">⏱️ حظر لمدة 24 ساعة</button>${blocked?`<button class="btn btn-success full" style="margin-top:8px" onclick="unbanUser('${esc(a.email)}')">🔓 إلغاء الحظر</button>`:''}<button class="btn btn-ghost full" style="margin-top:8px" onclick="closeBan()">إلغاء</button></section></div>`;
}
function banUser(email,mode){
 const e=accountKey(email);
 const a=getAccount(e);
 if(!e||!a){toast('الحساب غير موجود');return}
 const now=Date.now();
 const permanent=mode==='permanent';
 const hours=permanent?0:24;
 a.banned=true;
 a.bannedPermanent=permanent;
 a.banType=permanent?'permanent':'24h';
 a.banHours=hours;
 a.banStartedAt=now;
 a.bannedUntil=permanent?null:now+(24*60*60*1000);
 a.banReason='حظر من المطور';
 a.lastModerationAction={type:'ban',hours,permanent,at:now};
 state.videos.forEach(v=>{if(v.ownerEmail===e)v.blockedByBan=true});
 save();
 try{syncChannel?.postMessage({type:'ban',email:e,until:a.bannedUntil,permanent})}catch(err){}
 if(state.session?.email===e&&!state.session?.isAdmin){
   state.session=null;clearSession();state.screen='auth';state.ui.authMode='login';state.ui.banNotice=banText(a);
 }
 state.ui.banTarget=null;render();
 toast(permanent?'تم حظر الحساب نهائيًا':'تم حظر الحساب لمدة 24 ساعة');
}
function unbanUser(email){
 const e=accountKey(email);
 const a=getAccount(e);if(!e||!a){toast('الحساب غير موجود');return}
 a.banned=false;a.bannedPermanent=false;a.bannedUntil=null;a.banHours=0;a.banStartedAt=null;a.banReason=null;a.banType=null;a.lastModerationAction={type:'unban',at:Date.now()};
 state.videos.forEach(v=>{if(v.ownerEmail===e)v.blockedByBan=false});
 save();
 try{syncChannel?.postMessage({type:'unban',email:e})}catch(err){}
 state.ui.banTarget=null;render();toast('تم إلغاء الحظر — الحساب نشط الآن');
}
function statusVideo(id,status){const v=state.videos.find(x=>x.id===id);if(v){v.status=status;save();render();toast(status==="approved"?"تم قبول الفيديو ونشره":"تم رفض الفيديو")}}
async function deleteVideo(id){state.videos=state.videos.filter(x=>x.id!==id);await removeFile(id);save();render();toast("تم حذف الفيديو")}
function adminLogout(){state.session=null;clearSession();state.screen="auth";state.ui.authMode="login";render()}

/* ---------- Init ---------- */
function init(){
  setTimeout(function(){
    try{
      var sess=null;
      try{sess=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");}catch(e){}
      state.session=(sess&&sess.email)?sess:null;
      state.screen=state.session?(state.session.isAdmin?"admin":"home"):"auth";
      if(!state.session) state.ui.authMode="login";
    }catch(e){
      state.session=null; state.screen="auth"; state.ui.authMode="login";
    }
    try{render();}catch(e){
      console.error("SnapVibe startup render error",e);
      try{state.session=null;state.screen="auth";state.ui.authMode="login";render();}catch(e2){}
    }
    setTimeout(function(){
      try{
        load();
        Object.values(state.accounts||{}).forEach(function(a){
          a.friends=Array.isArray(a.friends)?a.friends:[];
          a.followers=Array.isArray(a.followers)?a.followers:[];
          a.following=Array.isArray(a.following)?a.following:[];
          a.friendRequests=Array.isArray(a.friendRequests)?a.friendRequests:[];
          a.sentFriendRequests=Array.isArray(a.sentFriendRequests)?a.sentFriendRequests:[];
          a.messages=Array.isArray(a.messages)?a.messages:[];
        });
      }catch(e){console.warn("Background state load skipped",e);}
      try{
        Promise.race([hydrateVideos(),new Promise(function(resolve){setTimeout(resolve,1000);})])
          .then(function(){if(state.screen==="home"){try{render();}catch(e){}}})
          .catch(function(){});
      }catch(e){}
    },0);
  },700);
}
// ارسم شاشة البداية فورًا؛ لا ننتظر أي تخزين أو IndexedDB أو مؤقت.
// هذا مهم خصوصًا عند فتح الملف من content://downloads على الهاتف.
try{render();}catch(e){
  app.innerHTML='<div class="screen splash"><div class="s-logo">S</div><div class="splash-welcome splash-title">أهلاً بيك 👋</div><div class="splash-welcome">مرحبًا بك في SnapVibe</div><div class="loader"><i></i></div></div>';
}
init();
</script>
