<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09031B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop stop-color=%22%23F10CFF%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%238B35FF%22/%3E%3Cstop offset=%221%22 stop-color=%22%2300E7FF%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2217%22 fill=%22url(%23g)%22/%3E%3Ctext x=%2232%22 y=%2246%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2240%22 font-weight=%22900%22 fill=%22white%22%3ES%3C/text%3E%3C/svg%3E">
<title>SnapVibe | منصة التواصل الاجتماعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --icon:url("snapvibe-logo.png");
  --bg:#000000;--surface:#151517;--surface2:#1c1c20;--line:#28282c;
  --text:#FFFFFF;--muted:#8b8b92;--purple:#B51CFF;--cyan:#25F4EE;--pink:#FE2C55;
  --danger:#FF3B5C;--success:#2ECC71;--warning:#FFC531;
  --grad:linear-gradient(135deg,#F10CFF 0%,#8B35FF 45%,#00E7FF 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000}
body{font-family:Cairo,system-ui,sans-serif;color:var(--text);display:flex;justify-content:center;letter-spacing:-.1px}
button,input,textarea{font:inherit}
input,textarea{background:var(--surface);color:var(--text);border:1px solid transparent;border-radius:10px;padding:11px 13px;outline:none;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(254,44,85,.55);outline-offset:2px}
#app{width:100%;max-width:480px;height:100dvh;min-height:560px;background:var(--bg);position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.hidden{display:none!important}
svg{width:24px;height:24px;display:block}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:481px){#app{height:92dvh;margin:4dvh 0;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 80px rgba(0,0,0,.6)}}

/* Brand / splash */
.s-logo{width:150px;height:150px;border-radius:38px;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:94px;font-weight:900;font-family:Arial,sans-serif;line-height:1;text-shadow:0 8px 28px rgba(0,0,0,.3);box-shadow:0 24px 70px rgba(254,44,85,.28),0 0 45px rgba(37,244,238,.14);animation:s-pop .6s cubic-bezier(.2,.8,.2,1)}
.splash-welcome{font-size:14px;color:#eee;margin-top:18px;font-weight:600}.splash-title{font-size:22px;margin-top:20px;font-weight:800;letter-spacing:-.3px}
.splash-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8;max-width:280px}
@keyframes s-pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.splash{align-items:center;justify-content:center;text-align:center;padding:30px;background:var(--bg)}
.logo{width:88px;height:88px;border-radius:22px;overflow:hidden;display:grid;place-items:center;background-image:var(--icon);background-size:cover;background-position:center}
.brand{font-size:29px;font-weight:800;margin-top:16px;letter-spacing:-.4px}
.tagline{font-size:13px;color:var(--muted);margin-top:3px}
.loader{width:110px;height:2.5px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:28px}
.loader i{display:block;width:40%;height:100%;background:var(--pink);animation:load 1.05s infinite}
@keyframes load{from{transform:translateX(260%)}to{transform:translateX(-260%)}}

/* Auth */
.auth{padding:38px 24px 24px;overflow:auto}
.auth-head{text-align:center;margin-bottom:30px}
.auth-head .logo{width:54px;height:54px;border-radius:16px;margin:0 auto 16px}
h1,h2,p{margin:0}
h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.muted{color:var(--muted);font-size:13px;line-height:1.75}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}
.field input,.field textarea{
width:100%;background:var(--surface);color:var(--text);border:1px solid transparent;
border-radius:10px;padding:14px 15px;outline:none;font-size:14.5px
}
.field input:focus,.field textarea:focus{border-color:var(--text)}
.error{color:var(--danger);font-size:12px;margin-top:6px;display:none}
.btn{border:0;border-radius:9px;padding:13px 16px;font-weight:700;font-size:14px;min-height:46px}
.btn-primary{background:var(--pink);color:#fff}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#04140c}
.btn-sm{min-height:34px;padding:7px 12px;font-size:12px;border-radius:8px}
.full{width:100%}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.7;margin-top:13px}
.auth-switch{display:block;width:100%;margin-top:13px;border:0;background:none;color:var(--muted);font-size:12px;padding:9px;text-align:center;cursor:pointer}.auth-switch b{color:var(--pink);font-weight:700}.secure-warning{margin:12px 0;padding:11px 12px;border:0;background:rgba(255,197,49,.09);border-radius:10px;color:#f6d47a;font-size:11px;line-height:1.7}.review-box{margin:12px 0;padding:14px;border:0;background:var(--surface);border-radius:12px;text-align:center}.review-box b{display:block;color:var(--warning);font-size:14px;margin-bottom:4px;font-weight:700}.review-box span{color:var(--muted);font-size:11px}

.permission-screen{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px}.permission-screen h1{font-size:20px;margin:14px 0 8px}.permission-screen p{max-width:320px;margin-bottom:20px}.permission-icon{width:82px;height:82px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:38px}
/* Top bar */
.topbar{height:54px;min-height:54px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;position:relative;background:rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:4}
.topbar .side{position:absolute;display:grid;place-items:center;width:38px;height:38px;border:0;background:transparent;color:var(--text)}
.topbar .right{right:8px}.topbar .left{left:8px}
.settings-btn{position:absolute;left:8px;top:9px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:19px;display:grid;place-items:center}.settings-sheet{padding-bottom:24px}.settings-sheet .setting-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 2px;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;color:var(--text);margin-top:0;text-align:right}.settings-sheet .setting-item.danger{color:var(--danger)}
.settings-group-label{font-size:11px;color:var(--muted);font-weight:700;margin:16px 2px 4px;text-transform:uppercase;letter-spacing:.3px}
.setting-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--line);flex:none;transition:.2s}
.switch i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;display:block}
.switch.on{background:var(--pink)}.switch.on i{transform:translateX(-18px)}
.mini-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--muted);vertical-align:middle}
.mini-badge.biz{background:rgba(37,244,238,.14);color:var(--cyan);border:1px solid rgba(37,244,238,.35)}

/* Feed */
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.feed::-webkit-scrollbar{display:none}
.video-card{height:100%;min-height:100%;scroll-snap-align:start;position:relative;background:#000;overflow:hidden}
.video-card>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.sound-btn{position:absolute;right:12px;top:64px;z-index:4;width:38px;height:38px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center}.sound-btn svg{width:20px;height:20px}
.video-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 22%,transparent 56%,rgba(0,0,0,.82))}
.user-row{display:flex;align-items:center;gap:10px}
.follow-chip{border:1px solid var(--pink);background:rgba(254,44,85,.14);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:4px 12px;box-shadow:0 0 12px rgba(254,44,85,.55)}
.follow-chip.sent{border-color:var(--line);background:rgba(255,255,255,.08);box-shadow:none;color:var(--muted)}
.meta{position:absolute;right:16px;left:80px;bottom:22px;z-index:2}
.user{font-size:15px;font-weight:700;margin-bottom:5px}
.caption{font-size:13.5px;line-height:1.7;color:#f2f2f2}
.song{display:inline-flex;gap:5px;align-items:center;margin-top:8px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);border:0;color:#fff;font-size:10.5px}
.song svg{width:13px;height:13px;color:var(--cyan)}
.actions{position:absolute;left:10px;bottom:22px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:19px}
.avatar{display:grid;place-items:center;background:var(--grad);font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);margin-bottom:2px}
.action{border:0;background:none;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.action svg{width:30px;height:30px;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.action span{font-size:11.5px;font-weight:700;text-shadow:0 0 10px rgba(255,255,255,.35)}
.action.liked{color:var(--pink)}
.action.liked svg{filter:drop-shadow(0 0 10px rgba(254,44,85,.9))}
.action.liked span{text-shadow:0 0 10px rgba(254,44,85,.75)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:35px;line-height:1.8}

/* Bottom nav */
.bottom{height:64px;min-height:64px;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:6;padding-bottom:max(5px,env(safe-area-inset-bottom))}
.nav{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
.nav svg{transition:filter .15s,color .15s}
.nav.active{color:var(--pink)}
.nav.active svg{filter:drop-shadow(0 0 8px rgba(254,44,85,.85))}
.nav.active span{text-shadow:0 0 8px rgba(254,44,85,.55)}
.nav-icon{width:22px;height:22px;display:grid;place-items:center;font-size:19px}.top-search{position:absolute;left:8px;top:9px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:19px;display:grid;place-items:center;pointer-events:auto;z-index:20;cursor:pointer}.home-topbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}.home-topbar b{pointer-events:auto;font-weight:800;font-size:17px;letter-spacing:.2px;text-shadow:0 0 14px rgba(254,44,85,.55),0 0 26px rgba(37,244,238,.3),0 1px 8px rgba(0,0,0,.6)}.search-title{font-weight:700;margin:16px 2px 7px;color:var(--muted);font-size:12px}.person-result{min-height:64px}.search-person-info{flex:1;min-width:0;overflow:hidden}.search-person-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.video-result{align-items:flex-start}.video-result video{flex:0 0 60px}
.search-panel{max-height:75vh;overflow:auto}.search-result{display:flex;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;margin-top:0}.search-result video{width:58px;height:74px;object-fit:cover;border-radius:8px}.messages-list{max-height:58vh;overflow:auto}.message-row{padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;margin-top:0}.message-bubble{padding:9px 12px;border-radius:14px;background:var(--surface2);margin-top:6px;line-height:1.6}.message-compose{display:flex;gap:7px;margin-top:10px}.message-compose input{flex:1}.terms{line-height:1.9;text-align:right;color:#eee;font-size:13px}.terms strong{color:var(--pink)}
.add{position:relative;width:46px;height:32px;border:0;border-radius:8px;background:#fff;color:#0a0a0a;display:grid;place-items:center;margin-top:-2px;z-index:1;box-shadow:0 0 18px rgba(254,44,85,.45),0 0 18px rgba(37,244,238,.3)}
.add:before,.add:after{content:"";position:absolute;top:0;bottom:0;width:100%;border-radius:8px;z-index:-1}
.add:before{background:var(--cyan);left:-6px}
.add:after{background:var(--pink);right:-6px}
.add svg{width:20px;height:20px}

.account-box{margin:0 18px 14px;padding:16px;border:0;background:var(--surface);border-radius:14px}.account-email{font-size:11px;color:var(--muted);direction:ltr;text-align:center;margin-top:3px}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn-outline-danger{background:transparent;color:var(--danger);border:1px solid rgba(255,59,92,.4)}
/* Profile */
.profile-head{text-align:center;padding:24px 18px 14px}
.avatar.lg{width:88px;height:88px;border-radius:50%;margin:0 auto 10px;font-size:29px;position:relative}
.avatar-edit{position:absolute;bottom:0;left:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--bg)}
.avatar-edit svg{width:13px;height:13px}
.profile-name{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.icon-btn{border:0;background:none;color:var(--muted);padding:3px}
.stats{display:flex;justify-content:center;gap:26px;margin-top:12px}
.stats b{display:block;font-size:17px;font-weight:800;text-shadow:0 0 12px rgba(254,44,85,.4)}.stats span{color:var(--muted);font-size:10.5px}
.edit-profile-btn{display:flex;align-items:center;justify-content:center;gap:7px;margin:14px auto 0;border:1px solid var(--pink);background:rgba(254,44,85,.12);color:#fff;font-weight:700;font-size:12.5px;border-radius:22px;padding:9px 18px;box-shadow:0 0 16px rgba(254,44,85,.4)}
.edit-profile-btn svg{width:14px;height:14px}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.cell{aspect-ratio:9/14;background:var(--surface);position:relative;overflow:hidden}
.discover-tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 14px;scrollbar-width:none}
.discover-tabs::-webkit-scrollbar{display:none}
.discover-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;border-radius:18px;padding:7px 14px}
.discover-chip.sel{background:var(--pink);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(254,44,85,.6)}
.discover-cell{cursor:pointer;border-radius:6px}
.discover-cell video{width:100%;height:100%;object-fit:cover}
.dstat{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 6px;font-size:9.5px;text-shadow:0 0 8px rgba(254,44,85,.7)}
.cell video{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:5px;right:5px;border-radius:6px;padding:2px 6px;font-size:9px;font-weight:700}
.pending{background:var(--warning);color:#2a2000}.approved{background:var(--success);color:#04140c}.rejected{background:var(--danger);color:#fff}
.privacy{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 5px;font-size:9px}
.review-note{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:0;border-radius:12px;padding:11px 12px;font-size:10px;color:var(--muted)}
.review-note b{color:var(--text);white-space:nowrap}.review-note span{line-height:1.6}

/* Create */
.camera{flex:1;position:relative;background:#000;overflow:hidden}
.camera>video,.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camera:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 30%,rgba(0,0,0,.58))}
.cambar{position:absolute;top:0;left:0;right:0;z-index:4;height:58px;display:flex;justify-content:space-between;align-items:center;padding:9px 12px}
.round{width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;box-shadow:0 0 10px rgba(37,244,238,.25)}
.music-row{position:absolute;top:67px;left:12px;right:12px;z-index:4;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.music-row::-webkit-scrollbar{display:none}
.music{flex:0 0 auto;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.4);color:#fff;border-radius:18px;padding:6px 10px;font-size:10px}
.music.sel{background:var(--pink);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 0 14px rgba(254,44,85,.65)}
.music.more{background:rgba(37,244,238,.14);border-color:rgba(37,244,238,.4);color:var(--cyan);font-weight:700}
.music-item{display:flex;align-items:center;gap:8px;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:11px 2px;font-size:13px}
.music-item svg{width:15px;height:15px;margin-inline-start:auto;color:var(--pink)}
.music-item.sel{color:var(--pink);font-weight:700}
.controls{position:absolute;bottom:23px;left:0;right:0;z-index:4;display:flex;justify-content:center;align-items:center;gap:30px}
.rec{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;box-shadow:0 0 24px rgba(254,44,85,.55)}
.rec i{width:54px;height:54px;border-radius:50%;background:var(--pink);display:block;transition:.2s;box-shadow:0 0 22px rgba(254,44,85,.85)}
.rec.recording{box-shadow:0 0 34px rgba(254,44,85,.9)}
.rec.recording i{width:26px;height:26px;border-radius:7px}
.tool{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;box-shadow:0 0 10px rgba(37,244,238,.3)}
.tool small{display:block;font-size:8px}
.timer{position:absolute;top:17px;left:0;right:0;text-align:center;z-index:5;color:var(--pink);font-weight:700}

/* Sheets / modals */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow:auto;background:var(--surface2);border-radius:20px 20px 0 0;padding:16px 18px max(18px,env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(20px)}to{transform:none}}
.handle{width:34px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.sheet h2{font-size:16px;margin-bottom:13px;font-weight:700}
.preview-thumb{width:100%;max-height:190px;object-fit:cover;border-radius:12px;background:#000;margin-bottom:12px}
.privacy-list{display:grid;gap:7px;margin:12px 0}
.privacy-opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.privacy-opt.sel{border-color:var(--pink);background:rgba(254,44,85,.1)}
.privacy-opt svg{width:20px}.privacy-opt b{font-size:13px}.privacy-opt small{display:block;color:var(--muted);font-size:10px}
.comments{height:67%;display:flex;flex-direction:column}
.comment-list{flex:1;overflow:auto}
.comment{display:flex;gap:9px;padding:9px 0}
.cav{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.comment-name{color:var(--muted);font-size:10px}.comment-text{font-size:13px}
.comment-input{display:flex;gap:7px;margin-top:8px}
.comment-input input{flex:1;border:0;background:var(--surface);color:var(--text);border-radius:20px;padding:10px 14px;outline:none}
.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--pink);display:grid;place-items:center;color:#fff}

let banCountdownTimer=null;
function formatCountdown(ms){
 if(ms<0)ms=0;
 const t=Math.floor(ms/1000);
 const h=String(Math.floor(t/3600)).padStart(2,'0');
 const m=String(Math.floor((t%3600)/60)).padStart(2,'0');
 const s=String(t%60).padStart(2,'0');
 return `${h}:${m}:${s}`;
}
function stopBanCountdown(){if(banCountdownTimer){clearInterval(banCountdownTimer);banCountdownTimer=null}}

 stopBanCountdown();
 banCountdownTimer=setInterval(()=>{
   if(!state.ui.banUntil||state.ui.banPermanent){stopBanCountdown();return}
   const remain=state.ui.banUntil-Date.now();
   if(remain<=0){
     stopBanCountdown();
     state.ui.banNotice=null;state.ui.banUntil=null;state.ui.banPermanent=false;
     toast('✅ انتهت مدة الحظر، الحساب رجع نشط. تقدر تسجّل الدخول الآن.');

     return;
   }
   const el=document.getElementById('banCountdownVal');

 },1000);
}

const DISPOSABLE_EMAIL_DOMAINS=new Set([
  "10minutemail.com","guerrillamail.com","mailinator.com","tempmail.com","temp-mail.org",
  "yopmail.com","sharklasers.com","getnada.com","emailondeck.com","moakt.com"
]);
const COMMON_PASSWORDS=new Set(["123456","12345678","123456789","password","password123","qwerty","000000","111111","123123"]);
function signupAttempts(){try{return JSON.parse(localStorage.getItem(SIGNUP_ATTEMPTS_KEY)||"[]").filter(t=>Date.now()-t<15*60*1000)}catch(e){return[]}}
function rememberSignupAttempt(){try{const a=signupAttempts();a.push(Date.now());localStorage.setItem(SIGNUP_ATTEMPTS_KEY,JSON.stringify(a))}catch(e){}}
function signupRiskCheck(email,password){
  const domain=email.split("@")[1].toLowerCase();
  const local=email.split("@")[0];
  let score=0, reasons=[];
  if(DISPOSABLE_EMAIL_DOMAINS.has(domain)){score+=80;reasons.push("بريد مؤقت")}
  if(COMMON_PASSWORDS.has(password.toLowerCase())){score+=35;reasons.push("كلمة سر شائعة")}
  if(local.length<3){score+=20;reasons.push("اسم بريد قصير جدًا")}
  if(/^(.)\\1+$/.test(local)){score+=35;reasons.push("نمط بريد غير طبيعي")}
  if(/[<>"'`]/.test(email)){score+=50;reasons.push("صيغة بريد غير آمنة")}
  const attempts=signupAttempts().length;
  if(attempts>=5){score+=45;reasons.push("محاولات تسجيل كثيرة")}
  return {score,reasons,attempts};
}
function loginRateLimited(){
  try{
    const a=JSON.parse(localStorage.getItem(LOGIN_ATTEMPTS_KEY)||"[]").filter(t=>Date.now()-t<10*60*1000);
    if(a.length>=8)return true;
  }catch(e){}
  return false;
}
function rememberLoginAttempt(){try{const a=(()=>{try{return JSON.parse(localStorage.getItem(LOGIN_ATTEMPTS_KEY)||"[]")}catch(e){return[]}})().filter(t=>Date.now()-t<10*60*1000);a.push(Date.now());localStorage.setItem(LOGIN_ATTEMPTS_KEY,JSON.stringify(a))}catch(e){}}
let saveDebounce=null,remoteUnsub=null;
function stripLocalOnly(v){const x={...v};delete x.fileId;delete x.src;return x}
function save(){
  // 1) حفظ محلي فوري (نسخة احتياطية سريعة على الجهاز، تشتغل حتى بدون إنترنت)
  try{
    const videos=state.videos.map(stripLocalOnly);
    localStorage.setItem(STORAGE_KEY,JSON.stringify({accounts:state.accounts,videos,withdrawals:state.withdrawals||[]}));
  }catch(e){
    console.warn("SnapVibe storage unavailable",e);
  }
  try{syncChannel?.postMessage({type:"state-updated",at:Date.now()})}catch(e){}
  // 2) مزامنة حقيقية مع Firebase عشان أي جهاز تاني يشوف نفس البيانات فورًا
  if(FIREBASE_READY){
    clearTimeout(saveDebounce);
    saveDebounce=setTimeout(()=>{
      const videos=state.videos.map(stripLocalOnly);
      remoteDoc().set({accounts:state.accounts,videos,withdrawals:state.withdrawals||[],updatedAt:Date.now()})
        .catch(e=>{console.warn("Firestore sync failed",e);toast("⚠️ تعذّر الاتصال بالسيرفر، تم الحفظ محليًا على هذا الجهاز فقط")});
    },250);
  }
}
function saveSession(){
  try{localStorage.setItem(SESSION_KEY,JSON.stringify(state.session||null))}catch(e){}
}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
function applyLoadedState(x){
  const rawAccounts=x.accounts||{};
  const normalizedAccounts={};
  Object.entries(rawAccounts).forEach(([key,a])=>{
    const email=String(a?.email||key||'').trim().toLowerCase();
    if(!email)return;
    normalizedAccounts[email]={...a,email,friends:Array.isArray(a.friends)?a.friends:[],followers:Array.isArray(a.followers)?a.followers:[],following:Array.isArray(a.following)?a.following:[],friendRequests:Array.isArray(a.friendRequests)?a.friendRequests:[],sentFriendRequests:Array.isArray(a.sentFriendRequests)?a.sentFriendRequests:[],messages:Array.isArray(a.messages)?a.messages:[],banReason:("banReason" in a?a.banReason:null),lastModerationAction:("lastModerationAction" in a?a.lastModerationAction:null),isPrivate:!!a.isPrivate,accountType:a.accountType==="business"?"business":"personal",bizCategory:a.bizCategory||null,earningsWithdrawn:Number(a.earningsWithdrawn)||0};
  });
  state.accounts=normalizedAccounts;
  ensureUserCodes();
  state.videos=Array.isArray(x.videos)?x.videos.map(v=>({...v})):[];
  state.withdrawals=Array.isArray(x.withdrawals)?x.withdrawals:[];
}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(x) applyLoadedState(x);
    if(!state.session){const sess=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(sess)state.session=sess}
  }catch(e){}
  // الاتصال الحقيقي: أي تغيير يحصل من أي جهاز تاني هيوصل هنا لحظيًا
  if(FIREBASE_READY){
    try{
      if(remoteUnsub) remoteUnsub();
      remoteUnsub=remoteDoc().onSnapshot(snap=>{
        if(snap.metadata.hasPendingWrites) return; // ده صدى لحفظنا إحنا، عندنا نسخة أحدث محليًا بالفعل
        const x=snap.data();
        if(!x) return;
        applyLoadedState(x);
        render();
      },err=>console.warn("Firestore listen error",err));
    }catch(e){console.warn("Firestore listener setup error",e)}
  }
}
function go(screen){stopCamera();state.screen=screen;render()}

function render(){
  if(state.session&&!state.session.isAdmin){
    const a=account();
    if(a&&isBanned(a)){
      const permanent=a.bannedPermanent===true||a.banType==='permanent';
      state.session=null;
      state.screen="auth";
      state.ui.authMode="login";
      state.ui.banNotice=banText(a);
      state.ui.banPermanent=permanent;
      state.ui.banUntil=permanent?null:(Number(a.bannedUntil)||null);
    }
  }
  const map={splash:renderSplash,auth:renderAuth,onboarding:renderOnboarding,home:renderHome,profile:renderProfile,create:renderCreate,admin:renderAdmin,discover:renderDiscover,userProfile:renderUserProfile,earnings:renderEarnings};
  app.innerHTML=(map[state.screen]||renderAuth)();
  setTimeout(()=>{app.querySelector("input")?.focus(); if(state.screen==="home") setupFeedPlayback();},20);
  if(state.screen==="auth"&&state.ui.banUntil&&!state.ui.banPermanent){startBanCountdown()}else{stopBanCountdown()}
  if(state.ui.toast) app.insertAdjacentHTML("beforeend",`<div class="toast">${esc(state.ui.toast)}</div>`);
}

 if(!FIREBASE_READY||!authApp){toast("⚠️ لازم تظبط إعدادات Firebase الأول");return}
 try{
   const provider=new firebase.auth.GoogleAuthProvider();
   const result=await authApp.signInWithPopup(provider);
   const user=result.user;
   const email=String(user?.email||"").trim().toLowerCase();
   if(!email){toast("تعذر الحصول على البريد من حساب جوجل");return}
   if(email===ADMIN_EMAIL){toast("هذا البريد محجوز لحساب المطور");return}
   try{ if(!Object.keys(state.accounts||{}).length){ load(); } }catch(ex){}
   const existing=getAccount(email);
   if(existing){
     if(isBanned(existing)){
       const permanent=existing.bannedPermanent===true||existing.banType==='permanent';
       state.ui.banNotice=banText(existing);
       state.ui.banPermanent=permanent;
       state.ui.banUntil=permanent?null:(Number(existing.bannedUntil)||null);

 }catch(e){
   console.error("Google sign-in error",e);

   toast("تعذر تسجيل الدخول بحساب جوجل. تأكد إنك فعّلت Google Sign-In في Firebase وحاول مرة أخرى.");
 }
}

async function login(){
 const e=app.querySelector("#email").value.trim().toLowerCase(),p=app.querySelector("#pass").value,err=app.querySelector("#authErr");
 // مهم: شاشة الدخول تظهر قبل تحميل قاعدة البيانات في الخلفية، لذلك نضمن تحميلها عند الضغط على دخول.
 try{
   if(!Object.keys(state.accounts||{}).length){ load(); }
 }catch(ex){ console.warn("Login state load error",ex); }
 err.style.display="none";
 if(loginRateLimited()){err.textContent="تم إيقاف محاولات الدخول مؤقتًا للحماية. جرّب بعد 10 دقائق.";err.style.display="block";return}
 if(!validEmail(e)){rememberLoginAttempt();err.textContent="اكتب بريدًا إلكترونيًا صحيحًا";err.style.display="block";return}
 if(p.length<4){rememberLoginAttempt();err.textContent="كلمة السر غير صحيحة";err.style.display="block";return}
 if(e===ADMIN_EMAIL&&p===ADMIN_PASS){state.session={email:e,isAdmin:true};saveSession();state.screen="admin";render();return}
 if(getAccount(e)){
   const existing=getAccount(e);
   if(existing.authProvider==="google"){rememberLoginAttempt();err.textContent="هذا الحساب مسجل بجوجل. استخدم زر «تسجيل الدخول بجوجل» تحت.";err.style.display="block";return}
   if(existing.password!==p){rememberLoginAttempt();err.textContent="كلمة السر غير صحيحة";err.style.display="block";return}
   if(isBanned(existing)){
     const permanent=existing.bannedPermanent===true||existing.banType==='permanent';
     state.ui.banNotice=banText(existing);
     state.ui.banPermanent=permanent;
     state.ui.banUntil=permanent?null:(Number(existing.bannedUntil)||null);
     render();
     return;
   }
   state.session={email:e};saveSession();state.ui.banNotice=null;state.ui.banUntil=null;state.ui.banPermanent=false;state.screen="home";render();return
 }
 err.textContent="هذا الحساب غير موجود. الحسابات الجديدة يجب أن تُنشأ من زر «إنشاء حساب جديد».";err.style.display="block"
}
function finishSignup(){
  try{
    const nameEl=app.querySelector("#name"),ageEl=app.querySelector("#age"),err=app.querySelector("#obErr");
    const n=(nameEl?.value||"").trim(), a=Number(ageEl?.value);
    if(err)err.style.display="none";
    if(!n){if(err){err.textContent="اكتب اسمك";err.style.display="block";}return}
    if(!Number.isInteger(a)||a<13||a>100){if(err){err.textContent="اكتب سنًا صحيحًا من 13 إلى 100";err.style.display="block";}return}
    if(!state.pending||!state.pending.email||!state.pending.password){
      state.ui.authMode="login"; state.screen="auth";
      render();
      return;
    }
    const email=String(state.pending.email).trim().toLowerCase();
    state.accounts[email]={email,name:n,age:a,password:state.pending.password,authProvider:state.pending.authProvider||"password",code:generateUserCode(),avatar:null,bannedUntil:null,bannedPermanent:false,banHours:0,banStartedAt:null,banReason:null,lastModerationAction:null,friends:[],followers:[],following:[],friendRequests:[],sentFriendRequests:[],messages:[],trustScore:state.pending.trustScore??100,riskFlags:state.pending.riskFlags||[],emailVerified:false,createdAt:Date.now(),isPrivate:false,accountType:"personal",bizCategory:null,earningsWithdrawn:0};
    state.session={email};
    state.pending=null;
    // ننتقل فورًا للرئيسية، ثم نحاول الحفظ. حتى لو منع content:// التخزين، لا يعلق الزر.
    state.screen="home";
    try{saveSession()}catch(e){}
    try{save()}catch(e){}
    render();
  }catch(e){
    console.error("SnapVibe signup error",e);
    state.pending=null;
    state.session=null;
    state.screen="auth";
    state.ui.authMode="signup";
    try{render()}catch(e2){}
  }
}

function videoSrc(v){return v.demoSrc||v.videoURL||v.src||""}
// تم فقدان هاتين الدالتين في نسخة سابقة، وهذا كان يوقف الشاشة الرئيسية بعد كل تسجيل دخول
// (الخطأ: feedVideos is not defined) ويرجع المستخدم لشاشة الدخول بدون سبب واضح.
function canViewVideo(v){
 if(!v||v.status!=="approved")return false;
 if(v.blockedByBan)return false;
 const owner=getAccount(v.ownerEmail);
 if(owner&&isBanned(owner))return false;
 const me=account();
 const isOwner=!!me&&accountKey(me.email)===accountKey(v.ownerEmail);
 if(isOwner)return true;
 // الحساب الخاص: فيديوهاته لا تظهر إلا للأصدقاء المقبولين، حتى لو كان الفيديو نفسه "عام".
 if(owner&&owner.isPrivate&&!isFriend(v.ownerEmail))return false;
 if(v.privacy==="private")return false;
 if(v.privacy==="friends")return !!me&&isFriend(v.ownerEmail);
 return true;
}
function visibleVideos(){return state.videos.filter(canViewVideo)}
/* ترتيب عشوائي للفيديوهات — عشوائي مختلف كل ما تفتح التطبيق، لكن ثابت أثناء نفس الجلسة عشان الفيديو ميقفزش وانت بتتفرج */
const feedShuffleSalt=Math.random().toString(36).slice(2)+Date.now();
function shuffleHash(str){
 let h=2166136261;
 for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
 return h;
}
function feedVideos(){
 return visibleVideos().slice().sort((a,b)=>shuffleHash(feedShuffleSalt+a.id)-shuffleHash(feedShuffleSalt+b.id));
}
function renderHome(){
 const list=feedVideos();

function addUnique(arr,email){arr=Array.isArray(arr)?arr:[];const e=accountKey(email)||String(email||'').trim().toLowerCase();if(e&&!arr.some(x=>String(x).toLowerCase()===e))arr.push(e);return arr}
function removeEmail(arr,email){const e=String(accountKey(email)||email||'').trim().toLowerCase();return (Array.isArray(arr)?arr:[]).filter(x=>String(x).trim().toLowerCase()!==e)}
function relList(a,key){return Array.isArray(a?.[key])?a[key]:[]}
function isFriend(email){const me=account();const e=accountKey(email);return !!(me&&e&&relList(me,'friends').some(x=>accountKey(x)===e))}
function isFollower(email){const me=account();const e=accountKey(email);return !!(me&&e&&relList(me,'followers').some(x=>accountKey(x)===e))}
function isFollowing(email){const me=account();const e=accountKey(email);return !!(me&&e&&relList(me,'following').some(x=>accountKey(x)===e))}
function hasIncomingRequest(email){const me=account();const e=accountKey(email);return !!(me&&e&&relList(me,'friendRequests').some(r=>accountKey(typeof r==='string'?r:r?.from)===e))}
function hasSentRequest(email){const me=account();const e=accountKey(email);return !!(me&&e&&relList(me,'sentFriendRequests').some(x=>accountKey(x)===e))}
function relationStatus(email){if(isFriend(email))return 'friends';if(hasIncomingRequest(email))return 'incoming';if(hasSentRequest(email))return 'sent';if(isFollowing(email))return 'following';return 'none'}
function canMessage(email){return isFriend(email)}
function sendFriendRequest(email){
 if(!requireLogin())return;
 const e=accountKey(email),me=account(),other=getAccount(e);if(!e||!me||!other||e===accountKey(me.email)||isDemoAccount(other))return;
 if(isFriend(e)){toast('أنتما أصدقاء بالفعل');return}
 if(hasIncomingRequest(e)){acceptFriendRequest(e);return}
 if(hasSentRequest(e)){toast('طلب الصداقة مُرسل بالفعل');return}
 me.following=addUnique(me.following,e);
 other.followers=addUnique(other.followers,me.email);
 me.sentFriendRequests=addUnique(me.sentFriendRequests,e);
 other.friendRequests=relList(other,'friendRequests').filter(r=>accountKey(typeof r==='string'?r:r?.from)!==accountKey(me.email));
 other.friendRequests.push({from:me.email,at:Date.now()});
 save();render();toast('📩 تم إرسال طلب الصداقة');
}
function cancelFriendRequest(email){
 if(!requireLogin())return;const e=accountKey(email),me=account(),other=getAccount(e);if(!e||!me)return;
 me.sentFriendRequests=removeEmail(me.sentFriendRequests,e);me.following=removeEmail(me.following,e);
 if(other){other.friendRequests=relList(other,'friendRequests').filter(r=>accountKey(typeof r==='string'?r:r?.from)!==accountKey(me.email));other.followers=removeEmail(other.followers,me.email)}
 save();render();toast('تم إلغاء طلب الصداقة');
}
function acceptFriendRequest(email){
 if(!requireLogin())return;const e=accountKey(email),me=account(),other=getAccount(e);if(!e||!me||!other)return;
 me.friendRequests=relList(me,'friendRequests').filter(r=>accountKey(typeof r==='string'?r:r?.from)!==e);
 other.sentFriendRequests=removeEmail(other.sentFriendRequests,me.email);
 me.friends=addUnique(me.friends,e);other.friends=addUnique(other.friends,me.email);
 me.following=addUnique(me.following,e);other.following=addUnique(other.following,me.email);
 me.followers=removeEmail(me.followers,e);other.followers=removeEmail(other.followers,me.email);
 save();render();toast('🤝 تم قبول طلب الصداقة — يمكن الآن المراسلة');
}
function rejectFriendRequest(email){
 if(!requireLogin())return;const e=accountKey(email),me=account(),other=getAccount(e);if(!e||!me)return;
 me.friendRequests=relList(me,'friendRequests').filter(r=>accountKey(typeof r==='string'?r:r?.from)!==e);
 if(other){other.sentFriendRequests=removeEmail(other.sentFriendRequests,me.email);other.following=removeEmail(other.following,me.email);other.followers=removeEmail(other.followers,me.email)}
 save();render();toast('تم رفض طلب الصداقة');
}
function removeFriend(email){
 if(!requireLogin())return;const e=accountKey(email),me=account(),other=getAccount(e);if(!e||!me)return;
 me.friends=removeEmail(me.friends,e);me.following=removeEmail(me.following,e);me.followers=removeEmail(me.followers,e);
 if(other){other.friends=removeEmail(other.friends,me.email);other.following=removeEmail(other.following,me.email);other.followers=removeEmail(other.followers,me.email)}
 save();render();toast('تمت إزالة الصداقة');
}
function toggleFriend(email){
 const status=relationStatus(email);
 if(status==='friends'){removeFriend(email);return}
 if(status==='incoming'){acceptFriendRequest(email);return}
 if(status==='sent'){cancelFriendRequest(email);return}
 sendFriendRequest(email);
}

let audioUnlocked=false;
let feedObserver=null;
function videoGesture(v){
  // أول لمسة من المستخدم تسمح للمتصفح بتشغيل الصوت، ثم نفعّل صوت الفيديو الحالي فقط.
  audioUnlocked=true;
  const card=v.closest('.video-card');
  document.querySelectorAll('#feed video').forEach(x=>{
    if(x!==v){x.pause();x.muted=true; const b=x.closest('.video-card')?.querySelector('.sound-btn'); if(b)b.textContent='🔇';}
  });
  v.muted=false;
  v.play().catch(()=>{v.muted=true;});
  const b=card?.querySelector('.sound-btn'); if(b){b.textContent=v.muted?'🔇':'🔊';b.setAttribute('aria-label',v.muted?'تشغيل الصوت':'كتم الصوت');}
}
function togglePlay(v){videoGesture(v)}
function toggleSound(e,btn){
 e.stopPropagation();
 audioUnlocked=true;
 const card=btn.closest('.video-card'),v=card?.querySelector('video'); if(!v)return;
 document.querySelectorAll('#feed video').forEach(x=>{
   if(x!==v){x.pause();x.muted=true; const b=x.closest('.video-card')?.querySelector('.sound-btn'); if(b)b.textContent='🔇';}
 });
 v.muted=!v.muted;
 if(!v.muted){v.play().catch(()=>{});btn.textContent='🔊';btn.setAttribute('aria-label','كتم الصوت')}
 else{btn.textContent='🔇';btn.setAttribute('aria-label','تشغيل الصوت')}
}
// نفس المشكلة: كانت تُستدعى عند التمرير في الفيديوهات لكنها غير موجودة أصلًا
// (لا يوجد تحميل صفحات إضافي حاليًا، فتُركت بدون أي عملية لمنع توقف الصفحة).
function loadMoreFeed(){}
function setupFeedPlayback(){
 const feed=document.getElementById('feed');
 const videos=[...document.querySelectorAll('#feed video')];
 if(!videos.length)return;
 if(feedObserver)feedObserver.disconnect();
 // نضمن أن كل فيديو مُعدّ للتشغيل التلقائي فورًا بدون أي ضغطة من المستخدم:
 // متصفحات كتير محتاجة الخاصية muted تتظبط عن طريق الـ JS كمان مش بس الـ attribute.
 videos.forEach(v=>{
   v.muted=true; v.defaultMuted=true;
   try{v.playsInline=true;}catch(e){}
 });
 if(feed && !feed.dataset.infiniteBound){
   feed.dataset.infiniteBound="1";
   feed.addEventListener('scroll',()=>{
     if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-Math.max(700,feed.clientHeight*1.5))loadMoreFeed();
   },{passive:true});
 }
 if(feed && !feed.dataset.wheelBound){
   feed.dataset.wheelBound="1";
   feed.addEventListener('wheel',()=>{setTimeout(()=>{if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-900)loadMoreFeed()},80)},{passive:true});
 }
 if(!('IntersectionObserver' in window)){
   // لا يوجد دعم لـ IntersectionObserver: شغّل أول فيديو تلقائيًا كحد أدنى.
   videos[0]?.play().catch(()=>{});
   return;
 }
 feedObserver=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
     const v=entry.target, card=v.closest('.video-card'), b=card?.querySelector('.sound-btn');
     if(entry.isIntersecting && entry.intersectionRatio>=0.5){
       videos.forEach(x=>{
         if(x!==v){x.pause();x.muted=true;const bb=x.closest('.video-card')?.querySelector('.sound-btn');if(bb)bb.textContent='🔇';}
       });
       // لا يمكن للمتصفح إجبار الصوت بدون تفاعل المستخدم. بعد أول تفاعل، ينتقل الصوت للفيديو الظاهر فقط.
       if(audioUnlocked){v.muted=false; if(b)b.textContent='🔊'; v.play().catch(()=>{v.muted=true;if(b)b.textContent='🔇';v.play().catch(()=>{});});}
       else {v.muted=true;if(b)b.textContent='🔇';v.play().catch(()=>{});}
     }else if(!entry.isIntersecting){
       v.pause();v.muted=true;if(b)b.textContent='🔇';
     }
   });
 },{threshold:[0,0.25,0.5,0.75,1]});
 videos.forEach(v=>feedObserver.observe(v));
}

function addComment(id){

 const v=state.videos.find(x=>x.id===id),a=account();if(!v||!a)return;

function autoBanForComment(email,matchedWord,text){
 const a=getAccount(email);if(!a)return;
 const now=Date.now();
 a.banned=false;
 a.bannedPermanent=false;
 a.banType='1h-comment';
 a.banHours=1;
 a.banStartedAt=now;
 a.bannedUntil=now+3600000;
 a.banReason='تعليق مسيء';
 a.lastModerationAction={type:'comment',reason:'تعليق مسيء',matchedWord:matchedWord,at:now};
 state.videos.forEach(v=>{if(String(v.ownerEmail||'').trim().toLowerCase()===String(a.email||email).trim().toLowerCase())v.blockedByBan=true});
 if(state.session?.email===a.email&&!state.session?.isAdmin){
   state.session=null;clearSession();state.screen='auth';state.ui.authMode='login';
   state.ui.banNotice='تم إيقاف حسابك لمدة ساعة بسبب تعليق مسيء. التعليق لم يتم نشره.';
 }
 save();
 try{syncChannel?.postMessage({type:'moderation-ban',email:a.email,until:a.bannedUntil})}catch(e){}
 render();
 setTimeout(()=>toast('🚫 تم حذف التعليق وإيقاف الحساب لمدة ساعة بسبب الإساءة'),50);
}

function renderFriendRequestsInMessages(me){

function searchSheet(){
 if(!state.ui.search)return '';
 return `<div class="overlay" onclick="if(event.target===this)closeSearch()"><section class="sheet search-panel"><div class="handle"></div><h2>🔍 البحث</h2><input id="searchQuery" autocomplete="off" placeholder="ابحث بالاسم أو اسم المستخدم أو الكود #..." oninput="debouncedSearch(this.value)" onkeydown="if(event.key==='Enter')runSearch(this.value)"><div id="searchResults"><div class="empty" style="height:auto;padding:25px">اكتب الاسم، اسم المستخدم، أو الكود التعريفي (#) لو في أكتر من شخص بنفس الاسم.</div></div><button class="btn btn-ghost full" style="margin-top:10px" onclick="closeSearch()">إغلاق</button></section></div>`;

let searchDebounceTimer=null;
function debouncedSearch(q){
 clearTimeout(searchDebounceTimer);
 searchDebounceTimer=setTimeout(()=>runSearch(q),110);
}
function runSearch(q){
 const box=document.getElementById('searchResults');
 if(!box)return;
 const raw=String(q||'').trim();
 const query=normalizeSearchText(raw);
 if(!query){
   box.innerHTML='<div class="empty" style="height:auto;padding:25px">اكتب اسم الشخص أو اسم المستخدم أو الكود # أو جزءًا من وصف الفيديو.</div>';
   return;
 }
 const me=account();
 const rank=(text)=>{const t=normalizeSearchText(text);if(!t.includes(query))return -1;return t.startsWith(query)?0:1};
 const people=realPeople().map(a=>{
   const name=normalizeSearchText(a.name),email=normalizeSearchText(a.email),handle=email.replace(/@.*/,'');
   const code=String(a.code||''),codeHash='#'+code;
   const r=Math.min(...[rank(a.name),rank(a.email),rank(handle),rank(code),rank(codeHash)].filter(x=>x>=0),99);
   return {a,r};
 }).filter(x=>x.r<99).sort((x,y)=>x.r-y.r).map(x=>x.a).slice(0,30);
 const dupNameCount={};
 people.forEach(a=>{const key=normalizeSearchText(a.name||'');dupNameCount[key]=(dupNameCount[key]||0)+1});
 const vids=visibleVideos().map(v=>{
   const r=Math.min(...[rank(v.ownerName),rank(v.caption)].filter(x=>x>=0),99);
   return {v,r};
 }).filter(x=>x.r<99).sort((x,y)=>x.r-y.r).map(x=>x.v).slice(0,20);
 let html='';
 if(people.length){
   html+='<div class="search-title">الأشخاص</div>';
   html+=people.map(a=>{
     const rel=me?relationStatus(a.email):'none';
     const avatar=a.avatar?`<img src="${esc(a.avatar)}" alt="${esc(a.name||'صورة الحساب')}">`:initials(a.name);
     let action='';
     if(me){
       if(rel==='friends') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إزالة الصداقة</button><button class="btn btn-sm btn-ghost" onclick="closeSearch();openChat('${esc(a.email)}')">💬</button>`;
       else if(rel==='sent') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إلغاء الطلب</button>`;
       else if(rel==='incoming') action=`<button class="btn btn-sm btn-primary" onclick="acceptFriendRequest('${esc(a.email)}')">قبول الطلب</button>`;
       else action=`<button class="btn btn-sm btn-primary" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">متابعة</button>`;
     }
     const bizTag=a.accountType==='business'?' <span class="mini-badge biz">تجاري</span>':'';
     const isDup=(dupNameCount[normalizeSearchText(a.name||'')]||0)>1;
     const codeLine=`<span${isDup?' style="color:var(--cyan);font-weight:700"':''}>كود: ${esc(userCodeLabel(a))}</span>`;
     return `<div class="search-result person-result"><button class="avatar sm" style="border:0;padding:0" onclick="closeSearch();openUserProfile('${esc(a.email)}')">${avatar}</button><div class="search-person-info" style="cursor:pointer" onclick="closeSearch();openUserProfile('${esc(a.email)}')"><b>${esc(a.name||'مستخدم')}${bizTag}</b><div class="muted">@${esc(String(a.email).split('@')[0])} · ${codeLine}</div>${isDup?`<div class="muted" style="font-size:10.5px;color:var(--warning)">⚠️ في أكتر من شخص بنفس الاسم — استخدم الكود للتأكد إنك بتختار الشخص الصح</div>`:''}</div>${action}</div>`;
   }).join('');
 }
 if(vids.length){
   html+='<div class="search-title">الفيديوهات</div>';
   html+=vids.map(v=>`<div class="search-result video-result"><video src="${esc(videoSrc(v))}" muted playsinline controls></video><div style="flex:1;min-width:0"><b>@${esc(v.ownerName||'مستخدم')}</b><div class="muted" style="margin-top:3px">${esc(v.caption||'بدون وصف')}</div><button class="btn btn-sm btn-primary" style="margin-top:7px" onclick="closeSearch();state.ui.comments='${esc(v.id)}';render()">عرض الفيديو</button></div></div>`).join('');
 }
 box.innerHTML=html||'<div class="empty" style="height:auto;padding:25px">لم يتم العثور على شخص أو فيديو بهذا الاسم أو الكود.</div>';
}

/* ---------- الأرباح (تجريبي داخل التطبيق) ---------- */
function computeEarnings(a){
 const vids=state.videos.filter(v=>v.ownerEmail===a.email&&v.status==='approved');
 const perVideo=vids.map(v=>({id:v.id,caption:v.caption,likes:v.likes.length,comments:v.comments.length,coins:v.likes.length*2+v.comments.length*1}));
 const videoCoins=perVideo.reduce((s,v)=>s+v.coins,0);
 const followerCount=Array.isArray(a.followers)?a.followers.length:0;
 const followerCoins=followerCount*100;
 const totalCoins=videoCoins+followerCoins;
 const withdrawn=Number(a.earningsWithdrawn)||0;
 const balance=Math.max(0,totalCoins-withdrawn);
 return {perVideo,videoCoins,followerCount,followerCoins,totalCoins,withdrawn,balance};
}
function myWithdrawal(a){
 if(!a)return null;
 return (state.withdrawals||[]).filter(w=>w.ownerEmail===a.email).sort((x,y)=>y.createdAt-x.createdAt)[0]||null;
}
function openWithdrawSheet(){
 const a=account();if(!a)return;
 const e=computeEarnings(a);
 if(e.balance<=0){toast('لا يوجد رصيد كافٍ للسحب حاليًا');return}
 if(myWithdrawal(a)){toast('لديك طلب سحب قائم بالفعل');return}
 state.ui.withdrawSheet=true;state.ui.withdrawWallet=WALLETS[0].id;state.ui.withdrawPhone='';render();
}
function closeWithdrawSheet(){state.ui.withdrawSheet=false;render()}
function submitWithdraw(){
 const a=account();if(!a)return;
 const e=computeEarnings(a);
 if(e.balance<=0){toast('لا يوجد رصيد كافٍ للسحب حاليًا');closeWithdrawSheet();return}
 if(myWithdrawal(a)){toast('لديك طلب سحب قائم بالفعل');closeWithdrawSheet();return}
 const phoneEl=app.querySelector('#withdrawPhone');
 const phone=String(phoneEl?phoneEl.value:state.ui.withdrawPhone||'').trim();
 const err=app.querySelector('#withdrawErr');
 const wallet=state.ui.withdrawWallet||WALLETS[0].id;
 if(err)err.style.display='none';
 if(!/^01[0125]\d{8}$/.test(phone)){
   if(err){err.textContent='اكتب رقم محفظة مصري صحيح (11 رقم يبدأ بـ 010/011/012/015)';err.style.display='block';}
   return;
 }
 const walletName=(WALLETS.find(w=>w.id===wallet)||WALLETS[0]).name;
 const coins=e.balance;
 const req={id:'w'+Date.now()+Math.random().toString(36).slice(2,7),ownerEmail:a.email,ownerName:a.name,wallet,walletName,phone,coins,amount:Number((coins*0.05).toFixed(2)),status:'pending',createdAt:Date.now()};
 state.withdrawals=state.withdrawals||[];
 state.withdrawals.push(req);
 a.earningsWithdrawn=(Number(a.earningsWithdrawn)||0)+coins;
 state.ui.withdrawSheet=false;state.ui.withdrawPhone='';
 save();render();
 toast('✅ تم إرسال طلب السحب، الطلب قيد المراجعة');
}

/* ---------- تخزين ملفات الفيديو الحقيقي على Firebase Storage (يشتغل من أي جهاز) ---------- */
async function uploadVideoFile(id,blob){
  if(!FIREBASE_READY||!storageRef) throw new Error("firebase_not_configured");
  const ref=storageRef.ref().child("videos/"+id);
  await ref.put(blob,{contentType:blob.type||"video/webm"});
  return await ref.getDownloadURL();
}
async function deleteVideoFile(id){
  if(!FIREBASE_READY||!storageRef) return;
  try{ await storageRef.ref().child("videos/"+id).delete(); }catch(e){ /* الملف مش موجود أو اتحذف قبل كده */ }
}

async function requestMediaPermissions(){

    if(retry)retry.style.display="none";
    return false;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    toast("المتصفح لا يدعم الكاميرا والميكروفون. استخدم Chrome حديثًا.");
    return false
  }
  if(!window.isSecureContext && location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){
    toast("افتح SnapVibe من رابط HTTPS حتى تعمل أذونات الكاميرا والمايك.");
    return false
  }
  try{
    const temp=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"user"}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    temp.getTracks().forEach(t=>t.stop());
    state.ui.permissions=false;
    render();
    setTimeout(startCamera,120);
    return true
  }catch(e){
    console.error("SnapVibe permission error:",e);
    state.ui.permissions=true;
    render();
    const title=app.querySelector("#permissionTitle"), text=app.querySelector("#permissionText"), retry=app.querySelector("#permissionRetry");
    if(title)title.textContent="الكاميرا والميكروفون غير مسموح بهما";
    if(text)text.innerHTML="اسمح للمتصفح باستخدام <b>الكاميرا والميكروفون</b> ثم اضغط إعادة المحاولة.<br>في Chrome على الهاتف: افتح <b>إعدادات الموقع 🔒</b> بجوار عنوان الصفحة، واجعل الكاميرا والميكروفون على <b>سماح</b>.";
    if(retry)retry.style.display="block";
    return false
  }
}

async function startCamera(){
 const v=app.querySelector("#camPreview"),fallback=app.querySelector("#camFallback"),err=app.querySelector("#camErrorText");if(!v)return;
 if(!window.isSecureContext && location.hostname!="localhost" && location.hostname!="127.0.0.1"){
   if(fallback)fallback.classList.remove("hidden");
   if(err)err.textContent="الكاميرا والميكروفون يحتاجان HTTPS أو localhost. ارفع index.html على موقع HTTPS مثل Vercel أو Netlify.";
   return;
 }
 if(!navigator.mediaDevices?.getUserMedia){
   if(fallback)fallback.classList.remove("hidden");
   if(err)err.textContent="المتصفح الحالي لا يدعم تشغيل الكاميرا. استخدم Chrome أو Edge حديثًا.";
   return;
 }
 try{
  if(!stream) stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:1080},height:{ideal:1920}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  v.srcObject=stream;
  await v.play().catch(()=>{});
  if(fallback)fallback.classList.add("hidden");
 }catch(e){
  if(fallback)fallback.classList.remove("hidden");
  if(err){
   if(location.protocol==="file:")err.textContent="الكاميرا ما بتشتغلش من ملف محلي (file://) في Chrome حتى مع الموافقة. دوس «تصوير بكاميرا الهاتف» تحت، أو ارفع الملف على استضافة HTTPS.";
   else if(location.protocol==="content:")err.textContent="الكاميرا ما بتشتغلش من شاشة التنزيلات (content://). دوس «تصوير بكاميرا الهاتف» تحت، أو افتح SnapVibe من رابط HTTPS.";
   else err.textContent=e?.name==="NotAllowedError"?"تم رفض إذن الكاميرا أو الميكروفون. افتح إعدادات الموقع 🔒 بجوار عنوان الصفحة واسمح بالوصول ثم اضغط تشغيل الكاميرا.":"تعذر تشغيل الكاميرا. جرّب Chrome على HTTPS أو localhost.";
  }
 }
}
function stopMusic(){

function setupAudioMix(){
 if(!stream)return stream;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
  mixDest=audioCtx.createMediaStreamDestination();
  micSource=audioCtx.createMediaStreamSource(stream);
  const micGain=audioCtx.createGain();micGain.gain.value=1;micSource.connect(micGain).connect(mixDest);
  if(state.ui.song!==SONGS[0]) startMusic(audioCtx,mixDest);
  const tracks=[...stream.getVideoTracks(),...mixDest.stream.getAudioTracks()];
  return new MediaStream(tracks);
 }catch(e){return stream}
}
function startMusic(ctx,dest){
 stopMusic();
 const fam=songFamily(state.ui.song);
 const notes=fam?fam.notes:[220,247,262,247];
 musicStep=0;
 const playNote=()=>{
   const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=notes[musicStep%notes.length];
   g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.055,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.34);
   o.connect(g).connect(dest);o.start();o.stop(ctx.currentTime+.36);musicStep++;
 };
 playNote();musicTimer=setInterval(playNote,380);
}
function stopCamera(){
 stopMusic();
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 recordStream=null;
 if(timer){clearInterval(timer);timer=null}
}

 if(!state.ui.recording){
  chunks=[];recordStream=setupAudioMix();
  try{
   const mime=bestMime();recorder=mime?new MediaRecorder(recordStream,{mimeType:mime}):new MediaRecorder(recordStream);
  }catch(e){toast("التسجيل غير متاح على هذا المتصفح. جرّب Chrome حديثًا.");return}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
   const type=recorder.mimeType||"video/webm";
   const blob=new Blob(chunks,{type});
   state.ui.recorded=URL.createObjectURL(blob);state.ui.recordedBlob=blob;state.ui.recordedIsBlob=true;state.ui.videoDuration=state.ui.seconds||0;state.ui.stage="preview";state.ui.recording=false;stopCamera();render();
  };

  timer=setInterval(()=>{state.ui.seconds++;const t=app.querySelector(".timer");if(t)t.textContent=timerText(state.ui.seconds);if(state.ui.seconds>=MAX_VIDEO_SECONDS)recordToggle()},1000)

}
function uploadVideo(e){
 const f=e.target.files[0];if(!f)return;
 if(!f.type.startsWith("video/")){toast("اختر ملف فيديو صحيحًا");return}
 // لا يوجد حد لعدد الفيديوهات التي يمكن نشرها. الحد الأساسي هنا هو مدة الفيديو (5 دقائق) ومساحة تخزين الجهاز/المتصفح.
 if(f.size>1024*1024*1024){toast("حجم الملف كبير جدًا لهذا المتصفح؛ جرّب ملفًا أصغر مع بقاء حد المدة 5 دقائق");return}
 const url=URL.createObjectURL(f);
 const probe=document.createElement("video");
 probe.preload="metadata";
 probe.onloadedmetadata=()=>{
   const duration=Number(probe.duration)||0;
   URL.revokeObjectURL(probe.src);
   if(duration>MAX_VIDEO_SECONDS+0.2){
     toast("الحد الأقصى للفيديو 5 دقائق فقط");
     e.target.value="";
     return;
   }
   state.ui.recorded=URL.createObjectURL(f);state.ui.recordedBlob=f;state.ui.recordedIsBlob=true;state.ui.uploadFile=f;state.ui.stage="preview";state.ui.videoDuration=duration;stopCamera();render();
 };
 probe.onerror=()=>{URL.revokeObjectURL(probe.src);toast("تعذر قراءة مدة الفيديو");e.target.value=""};
 probe.src=url;
}

async function publish(){
 if(!state.ui.recorded){toast("لا يوجد فيديو للنشر");return}
 const a=account();if(!a||!state.session){toast("سجل الدخول أولًا");return}
 if(Number(state.ui.videoDuration)>MAX_VIDEO_SECONDS+0.2){toast("الحد الأقصى للفيديو 5 دقائق فقط");return}
 if(!FIREBASE_READY){toast("⚠️ لازم تظبط إعدادات Firebase الأول عشان الفيديو يظهر لباقي الأجهزة (راجع أعلى الكود)");return}
 const id="v"+Date.now(),file=state.ui.uploadFile||state.ui.recordedBlob;
 const v={id,ownerEmail:state.session.email,ownerName:a.name,caption:app.querySelector("#caption")?.value.trim()||"فيديو جديد على SnapVibe ✨",privacy:state.ui.privacy,status:"pending",song:state.ui.song,likes:[],comments:[],createdAt:Date.now()};
 toast("⏳ جاري رفع الفيديو على السيرفر...");
 try{
   const blob=file||(state.ui.recorded?await fetch(state.ui.recorded).then(r=>r.blob()):null);
   if(!blob) throw new Error("no_file");
   v.videoURL=await uploadVideoFile(id,blob);
 }catch(e){
   console.error("SnapVibe publish error:",e);
   toast("تعذر رفع الفيديو للسيرفر. تأكد من اتصال الإنترنت وإعدادات Firebase وحاول مرة أخرى.");
   return;
 }
 state.videos.unshift(v);save();
 if(state.ui.recorded)try{URL.revokeObjectURL(state.ui.recorded)}catch(e){}
 state.ui.publish=false;state.ui.recorded=null;state.ui.recordedBlob=null;state.ui.uploadFile=null;state.ui.videoDuration=0;state.ui.captionDraft="";state.screen="profile";render();
 setTimeout(()=>toast("تم الإرسال ✅ الفيديو الآن قيد المراجعة من المطور"),80);
}

function downloadBackup(){
 try{
   const backup={exportedAt:Date.now(),accounts:state.accounts,videos:state.videos.map(stripLocalOnly),withdrawals:state.withdrawals||[]};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
   const url=URL.createObjectURL(blob);
   const link=document.createElement("a");
   link.href=url;link.download="snapvibe-backup-"+Date.now()+".json";
   document.body.appendChild(link);link.click();document.body.removeChild(link);
   setTimeout(()=>URL.revokeObjectURL(url),2000);
   return true;
 }catch(e){console.warn("Backup failed",e);return false}
}

 const backedUp=downloadBackup();
 state.accounts={};
 state.videos=[];

 try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
 save();

function init(){
  setTimeout(function(){
    try{
      var sess=null;
      try{sess=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");}catch(e){}
      state.session=(sess&&sess.email)?sess:null;
      state.screen=state.session?(state.session.isAdmin?"admin":"home"):"auth";
      if(!state.session) state.ui.authMode="login";
    }catch(e){
      state.session=null; state.screen="auth"; state.ui.authMode="login";
    }
    try{render();}catch(e){
      console.error("SnapVibe startup render error",e);
      try{state.session=null;state.screen="auth";state.ui.authMode="login";render();}catch(e2){}
    }
    setTimeout(function(){
      try{
        load();
        Object.values(state.accounts||{}).forEach(function(a){
          a.friends=Array.isArray(a.friends)?a.friends:[];
          a.followers=Array.isArray(a.followers)?a.followers:[];
          a.following=Array.isArray(a.following)?a.following:[];
          a.friendRequests=Array.isArray(a.friendRequests)?a.friendRequests:[];
          a.sentFriendRequests=Array.isArray(a.sentFriendRequests)?a.sentFriendRequests:[];
          a.messages=Array.isArray(a.messages)?a.messages:[];
        });
        if(state.screen==="home"||state.screen==="admin"){try{render();}catch(e){}}
      }catch(e){console.warn("Background state load skipped",e);}
    },0);
  },700);
}
// ارسم شاشة البداية فورًا؛ لا ننتظر أي تخزين أو IndexedDB أو مؤقت.
// هذا مهم خصوصًا عند فتح الملف من content://downloads على الهاتف.
try{render();}catch(e){
  app.innerHTML='<div class="screen splash"><div class="s-logo">S</div><div class="splash-welcome splash-title">أهلاً بيك 👋</div><div class="splash-welcome">مرحبًا بك في SnapVibe</div><div class="loader"><i></i></div></div>';
}
init();
</script>
