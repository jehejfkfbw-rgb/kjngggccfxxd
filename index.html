<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما لايت | CimaLight Pro</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #1f242d;
            --accent-color: #e50914;
            --accent-hover: #b20710;
            --text-color: #ffffff;
            --text-secondary: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; }
        
        /* الهيدر وشريط التنقل */
        header { background-color: #161b22; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent-color); cursor: pointer; }
        nav a { color: var(--text-color); text-decoration: none; margin-left: 20px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        nav a:hover { color: var(--accent-color); }
        
        /* المحتوى العام */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .hero { background: linear-gradient(45deg, #e50914, #b20710); padding: 40px; border-radius: 12px; text-align: center; margin-bottom: 30px; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero p { font-size: 16px; opacity: 0.9; }
        
        /* شبكة عرض الأفلام */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #30363d; transition: transform 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-content h3 { font-size: 18px; margin-bottom: 8px; }
        .card-content p { font-size: 13px; color: var(--text-secondary); margin-bottom: 15px; flex-grow: 1; }
        .btn { background-color: var(--accent-color); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background-color: var(--accent-hover); }
        
        /* أقسام النظام */
        .section { display: none; }
        .section.active { display: block; }
        
        /* لوحة التحكم ونماذج الإدخال */
        .form-box { background-color: var(--card-bg); padding: 30px; border-radius: 12px; max-width: 600px; margin: 0 auto; border: 1px solid #30363d; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background-color: var(--bg-color); border: 1px solid #30363d; color: white; border-radius: 6px; }
        
        /* مشغل الفيديو */
        .player-container { background-color: var(--card-bg); padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #30363d; }
        video { width: 100%; max-height: 500px; border-radius: 8px; background: black; }
        
        /* رسائل الخطأ والنجاح */
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; text-align: center; display: none; }
        .alert-error { background-color: #891e2b; color: white; }
        .alert-success { background-color: #1f6feb; color: white; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchSection('home')">🎬 CimaLight Pro</div>
        <nav>
            <a onclick="switchSection('home')">🏠 الرئيسية</a>
            <a onclick="switchSection('admin')">🛠️ لوحة تحكم المطور</a>
        </nav>
    </header>

    <div class="container">
        
        <!-- قسم الرئيسية -->
        <div id="home-section" class="section active">
            <div class="hero">
                <h1>أضخم منصة مشاهدة أفلام ومسلسلات</h1>
                <p>استمتع بأحدث الإنتاجات السينمائية بجودة عالية وبدون إعلانات مزعجة.</p>
            </div>
            
            <div style="margin-bottom: 20px;">
                <select id="filter-type" onchange="renderVideos()" style="padding: 10px; background: var(--card-bg); color: white; border: 1px solid #30363d; border-radius: 6px;">
                    <option value="الكل">عرض الكل</option>
                    <option value="فيلم">أفلام فقط</option>
                    <option value="مسلسل">مسلسلات فقط</option>
                </select>
            </div>

            <div id="video-grid" class="grid">
                <!-- يتم تعبئة الفيديوهات تلقائياً عبر JavaScript -->
            </div>

            <div id="player-section" class="player-container" style="display: none;">
                <h2 id="player-title" style="margin-bottom: 15px;"></h2>
                <video id="main-video-player" controls></video>
                <p id="player-desc" style="margin-top: 15px; color: var(--text-secondary);"></p>
            </div>
        </div>

        <!-- قسم لوحة تحكم المطور -->
        <div id="admin-section" class="section">
            <div id="login-container" class="form-box">
                <h2 style="margin-bottom: 20px; text-align: center;">تسجيل دخول المطور</h2>
                <div id="login-alert" class="alert"></div>
                <div class="form-group">
                    <label>البريد الإلكتروني للمطور:</label>
                    <input type="email" id="admin-email" placeholder="أدخل إيميلك...">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="admin-pass" placeholder="كلمة المرور...">
                </div>
                <button class="btn" onclick="loginAdmin()">دخول لوحة التحكم</button>
            </div>

            <div id="dashboard-container" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>🛠️ لوحة التحكم والإدارة (مرحباً يا مطورنا)</h2>
                    <button class="btn" style="width: auto; background: #30363d;" onclick="logoutAdmin()">تسجيل الخروج</button>
                </div>

                <div class="form-box">
                    <div id="upload-alert" class="alert"></div>
                    <h3 style="margin-bottom: 15px;">➕ إضافة محتوى جديد</h3>
                    <div class="form-group">
                        <label>عنوان الفيلم أو المسلسل:</label>
                        <input type="text" id="v-title" placeholder="أدخل العنوان...">
                    </div>
                    <div class="form-group">
                        <label>نوع المحتوى:</label>
                        <select id="v-type" onchange="checkContentType()">
                            <option value="فيلم">فيلم</option>
                            <option value="مسلسل">مسلسل</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المدة (بالدقائق):</label>
                        <input type="number" id="v-duration" value="90" min="1" max="300">
                    </div>
                    <div class="form-group">
                        <label>رابط صورة الغلاف (Thumbnail URL):</label>
                        <input type="text" id="v-thumb" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>رابط ملف الفيديو المباشر (Video URL):</label>
                        <input type="text" id="v-url" placeholder="https://www.w3schools.com/html/mov_bbb.mp4">
                    </div>
                    <div class="form-group">
                        <label>وصف قصير:</label>
                        <textarea id="v-desc" rows="3" placeholder="تفاصيل القصة..."></textarea>
                    </div>
                    <button class="btn" onclick="addNewVideo()">نشر المحتوى رسمياً</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // إعدادات بيانات المطور
        const ADMIN_EMAIL = "mohamedadel@gmail.com";
        const ADMIN_PASS = "cima2026password";

        // قاعدة بيانات أولية في المتصفح
        let videos = JSON.parse(localStorage.getItem('cimain_videos')) || [
            {
                id: 1,
                title: "رحلة الفضاء المجهولة",
                type: "فيلم",
                duration: 110,
                thumb: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=600",
                url: "https://www.w3schools.com/html/mov_bbb.mp4",
                desc: "فيلم خيال علمي شيق يستكشف أسرار الكون."
            },
            {
                id: 2,
                title: "مملكة الأساطير - الحلقة 1",
                type: "مسلسل",
                duration: 45,
                thumb: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600",
                url: "https://www.w3schools.com/html/mov_bbb.mp4",
                desc: "الحلقة الأولى من المسلسل التاريخي الضخم."
            }
        ];

        let isAdminLoggedIn = localStorage.getItem('admin_logged') === 'true';

        window.onload = function() {
            renderVideos();
            if (isAdminLoggedIn) {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'block';
            }
        };

        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            if (sectionId === 'home') document.getElementById('home-section').classList.add('active');
            if (sectionId === 'admin') document.getElementById('admin-section').classList.add('active');
        }

        function renderVideos() {
            const grid = document.getElementById('video-grid');
            const filter = document.getElementById('filter-type').value;
            grid.innerHTML = '';

            let filtered = videos;
            if (filter !== 'الكل') {
                filtered = videos.filter(v => v.type === filter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-secondary);">لا توجد عروض متاحة حالياً.</p>';
                return;
            }

            filtered.forEach(v => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${v.thumb}" alt="${v.title}">
                        <div class="card-content">
                            <h3>${v.title}</h3>
                            <p>${v.desc.substring(0, 70)}...</p>
                            <p style="font-size: 11px; color: var(--accent-color); margin-bottom: 10px;">${v.type} | ${v.duration} دقيقة</p>
                            <button class="btn" onclick="playVideo(${v.id})">مشاهدة الآن</button>
                        </div>
                    </div>
                `;
            });
        }

        function playVideo(id) {
            const v = videos.find(item => item.id === id);
            if (!v) return;

            document.getElementById('player-section').style.display = 'block';
            document.getElementById('player-title').innerText = `🎥 جاري عرض: ${v.title}`;
            document.getElementById('player-desc').innerText = v.desc;
            
            const player = document.getElementById('main-video-player');
            player.src = v.url;
            player.play();

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function loginAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();
            const alertBox = document.getElementById('login-alert');

            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                isAdminLoggedIn = true;
                localStorage.setItem('admin_logged', 'true');
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('dashboard-container').style.display = 'block';
            } else {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة!';
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            localStorage.setItem('admin_logged', 'false');
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('dashboard-container').style.display = 'none';
        }

        function addNewVideo() {
            const title = document.getElementById('v-title').value.trim();
            const type = document.getElementById('v-type').value;
            const duration = parseInt(document.getElementById('v-duration').value);
            const thumb = document.getElementById('v-thumb').value.trim();
            const url = document.getElementById('v-url').value.trim();
            const desc = document.getElementById('v-desc').value.trim();
            const alertBox = document.getElementById('upload-alert');

            alertBox.style.display = 'none';

            // الشرط الأساسي: الفيلم ممنوع أن تزيد مدته عن ساعتين (120 دقيقة)
            if (type === 'فيلم' && duration > 120) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = '❌ عذراً يا مطورنا، شرط النظام يمنع نشر أفلام تتجاوز مدتها ساعتين (120 دقيقة)!';
                return;
            }

            if (!title || !thumb || !url) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = '⚠️ يرجى تعبئة الحقول الأساسية ووضع الروابط بشكل صحيح.';
                return;
            }

            const newVid = {
                id: Date.now(),
                title,
                type,
                duration,
                thumb,
                url,
                desc: desc || 'لا يوجد وصف متاح.'
            };

            videos.push(newVid);
            localStorage.setItem('cimain_videos', JSON.stringify(videos));

            alertBox.style.display = 'block';
            alertBox.className = 'alert alert-success';
            alertBox.innerText = `🎉 تم نشر "${title}" بنجاح وأصبح متاحاً للجميع على المنصة!`;

            // تفريغ الحقول
            document.getElementById('v-title').value = '';
            document.getElementById('v-thumb').value = '';
            document.getElementById('v-url').value = '';
            document.getElementById('v-desc').value = '';

            renderVideos();
        }
    </script>
</body>
</html>
