<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06141A">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Tarab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Tarab — شارك لحظاتك بفيديوهات قصيرة، واكتشف محتوى يشبهك.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%230D9488'/%3E%3Cstop offset='1' stop-color='%230369A1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M18 24h28M32 24v22' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Tarab | طرب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">

<style>
/* =====================================================================
   Tarab — Design System (v1)
   ===================================================================== */
:root{
  --bg:#06141A;--bg2:#0A1D25;--surface:#0E252E;--surface2:#143240;--surface3:#1D4150;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --text:#F2FBFA;--muted:#8DB0B8;--muted2:#5F8189;
  --brand:#0D9488;--brand2:#0369A1;--gold:#FBBF24;
  --purple:#0D9488;--cyan:#22D3EE;--pink:#5EEAD4;
  --danger:#FF4D6D;--success:#2DD4A0;--warning:#FBBF24;
  --grad:linear-gradient(135deg,#0D9488 0%,#0891B2 55%,#0369A1 100%);
  --r-sm:12px;--r:16px;--r-lg:24px;--r-xl:30px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --navh:calc(var(--sab) + 98px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030D11;overscroll-behavior:none}
body{
  font-family:"Readex Pro","Cairo","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);display:flex;justify-content:center;align-items:center;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background:radial-gradient(60% 50% at 50% 0%,rgba(13,148,136,.22),transparent 70%),radial-gradient(40% 40% at 90% 100%,rgba(3,105,161,.14),transparent 70%),#030D11;
}
button,input,textarea{font:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;color:inherit}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(94,234,212,.7);outline-offset:2px}
h1,h2,p{margin:0}
svg{width:24px;height:24px;display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:0;height:0}

#app{width:100%;max-width:480px;height:100dvh;min-height:560px;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:481px){#app{height:min(920px,95dvh);border-radius:38px;border:1px solid var(--line2);box-shadow:0 30px 120px rgba(0,0,0,.7),0 0 0 8px rgba(255,255,255,.03)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.fade{animation:fade .32s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}

/* ---------- Brand mark (Z) ---------- */
.zmark{--zs:56px;width:var(--zs);height:var(--zs);border-radius:30%;background:var(--grad);display:grid;place-items:center;flex:none;position:relative;
  box-shadow:0 10px 30px rgba(8,145,178,.42),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 16px rgba(0,0,0,.12)}
.zmark svg{width:56%;height:56%;overflow:visible}
.zmark.draw svg path{stroke-dasharray:46;stroke-dashoffset:46;animation:zdraw 1.5s cubic-bezier(.65,0,.35,1) infinite}
@keyframes zdraw{0%{stroke-dashoffset:46}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-46}}
@keyframes zfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.1);opacity:0}}

/* ---------- Splash ---------- */
.splash{align-items:center;justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(60% 40% at 50% 38%,rgba(13,148,136,.34),transparent 72%),radial-gradient(45% 30% at 80% 90%,rgba(3,105,161,.2),transparent 70%),var(--bg)}
.splash-mark{position:relative;display:grid;place-items:center;margin-bottom:26px}
.splash-mark .zmark{--zs:124px;animation:zfloat 2.4s ease-in-out infinite;box-shadow:0 24px 70px rgba(8,145,178,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.splash-mark .ring{position:absolute;inset:0;border-radius:32%;border:2px solid rgba(94,234,212,.55);animation:ring 2.2s ease-out infinite}
.splash-mark .ring.r2{animation-delay:1.1s}
.splash-name{font-size:38px;font-weight:900;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-desc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.9;max-width:270px}
.dots{display:flex;gap:7px;margin-top:34px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s;background:#14B8A6}.dots i:nth-child(3){animation-delay:.3s;background:var(--brand2)}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1.15);opacity:1}}

/* ---------- Buttons / inputs ---------- */
.btn{border:0;border-radius:var(--r);padding:13px 18px;font-weight:800;font-size:14.5px;min-height:50px;transition:transform .15s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 28px rgba(13,148,136,.32),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#03150d}
.btn-outline-danger{background:transparent;color:var(--danger);border:1px solid rgba(255,77,109,.4)}
.btn-sm{min-height:36px;padding:7px 14px;font-size:12.5px;border-radius:12px}
.full{width:100%}
input,textarea{width:100%;background:var(--surface);color:var(--text);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder,textarea::placeholder{color:var(--muted2)}
input:focus,textarea:focus{border-color:var(--brand);background:var(--surface2);box-shadow:0 0 0 4px rgba(13,148,136,.18)}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.8;margin-top:13px}
.error{color:var(--danger);font-size:12.5px;margin-top:8px;display:none;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:700}
.pw{position:relative}.pw input{padding-inline-end:50px}
.pw .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.pw .eye svg{width:20px;height:20px}

/* ---------- Auth ---------- */
.auth{padding:calc(var(--sat) + 44px) 24px 30px;overflow:auto;
  background:radial-gradient(70% 34% at 85% 0%,rgba(13,148,136,.36),transparent 72%),radial-gradient(55% 28% at 0% 8%,rgba(3,105,161,.24),transparent 72%),var(--bg)}
.auth-head{text-align:center;margin-bottom:30px}
.auth-head .zmark{--zs:78px;margin:0 auto 20px}
.auth-head h1{font-size:28px;font-weight:900;letter-spacing:-.4px;margin-bottom:6px}
h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
.auth-switch{display:block;width:100%;margin-top:14px;border:0;background:none;color:var(--muted);font-size:13px;padding:10px;text-align:center;font-weight:600}
.auth-switch b{color:#67D9CB;font-weight:800}
.secure-warning{margin:12px 0;padding:12px 14px;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.2);border-radius:var(--r);color:#f6d47a;font-size:11.5px;line-height:1.8}
.review-box{margin:12px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);text-align:center}
.review-box b{display:block;color:var(--gold);font-size:14px;margin-bottom:4px;font-weight:800}
.review-box span{color:var(--muted);font-size:12px}
.review-note{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:11px;color:var(--muted)}
.review-note b{color:var(--text);white-space:nowrap}.review-note span{line-height:1.7}
.permission-screen{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;background:radial-gradient(60% 35% at 50% 20%,rgba(13,148,136,.25),transparent 70%)}
.permission-screen h1{font-size:21px;margin:16px 0 8px}.permission-screen p{max-width:320px;margin-bottom:20px}
.permission-icon{width:88px;height:88px;border-radius:28px;background:var(--grad);display:grid;place-items:center;font-size:34px;box-shadow:0 18px 50px rgba(8,145,178,.4)}

/* ---------- Top bars ---------- */
.topbar{height:calc(58px + var(--sat));min-height:calc(58px + var(--sat));padding-top:var(--sat);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;position:relative;
  background:rgba(4,20,26,.72);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border-bottom:1px solid var(--line);z-index:4}
.topbar .side{position:absolute;top:calc(var(--sat) + 9px);display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.06);color:var(--text)}
.topbar .side svg{width:20px;height:20px}
.topbar .right{right:12px}.topbar .left{left:12px}
.page-head{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 16px) 18px 6px}
.page-head h1{font-size:28px}
.glass-btn{width:42px;height:42px;border:1px solid var(--line2);border-radius:15px;background:rgba(14,37,48,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;display:grid;place-items:center;position:relative;flex:none}
.glass-btn svg{width:21px;height:21px}
.mini-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);vertical-align:middle}
.mini-badge.biz{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.3)}
.icon-btn{border:0;background:none;color:var(--muted);padding:4px;display:inline-grid;place-items:center}.icon-btn svg{width:17px;height:17px}

/* ---------- Home / feed ---------- */
.home-topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(var(--sat) + 10px) 14px 26px;background:linear-gradient(180deg,rgba(0,0,0,.62),transparent);pointer-events:none}
.home-topbar>*{pointer-events:auto}
.brand-lockup{display:flex;align-items:center;gap:8px}
.brand-lockup .zmark{--zs:36px;box-shadow:0 6px 18px rgba(8,145,178,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.brand-lockup b{font-size:20px;font-weight:900;letter-spacing:-.4px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.feed-tabs{display:flex;gap:3px;padding:4px;border-radius:999px;background:rgba(10,32,42,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line)}
.feed-tabs button{border:0;background:none;color:rgba(255,255,255,.72);font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:999px;transition:.25s var(--ease);white-space:nowrap}
.feed-tabs button.on{background:#fff;color:#06141A}
.top-actions{display:flex;gap:8px}
.top-search,.notification-bell{position:relative;width:42px;height:42px;border:1px solid var(--line2);border-radius:15px;background:rgba(14,37,48,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;display:grid;place-items:center}
.top-search svg,.notification-bell svg{width:21px;height:21px}
.notification-bell span{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font:800 10px/19px system-ui;text-align:center;border:2px solid #06141A}
@media(max-width:400px){.brand-lockup b{display:none}.feed-tabs button{padding:7px 11px}}
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.video-card{height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000;overflow:hidden}
.video-card>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.video-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 20%,transparent 50%,rgba(0,0,0,.86))}
.sound-btn{position:absolute;right:14px;top:calc(var(--sat) + 76px);z-index:6;width:40px;height:40px;border:1px solid var(--line2);border-radius:50%;background:rgba(10,32,42,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;display:grid;place-items:center;padding:0}
.sound-btn svg{width:19px;height:19px}
.meta{position:absolute;right:16px;left:86px;bottom:calc(var(--sab) + 104px);z-index:3}
.user-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user{font-size:15.5px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.follow-chip{border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.08);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.follow-chip.sent{border-color:var(--line2);color:var(--muted)}
.caption{font-size:13.5px;line-height:1.75;color:#EFFAF9;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.song{display:inline-flex;gap:6px;align-items:center;margin-top:10px;padding:5px 12px;border-radius:999px;background:rgba(10,32,42,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);color:#fff;font-size:11px;font-weight:700}
.song svg{width:14px;height:14px;color:#A5F3EA}
.actions{position:absolute;left:12px;bottom:calc(var(--sab) + 104px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:13px}
.avatar{display:grid;place-items:center;background:var(--grad);font-weight:800;overflow:hidden;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:48px;height:48px;border-radius:50%;border:2px solid #fff;margin-bottom:4px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.action{border:0;background:none;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.action svg{width:48px;height:48px;padding:12px;border-radius:50%;background:rgba(10,32,42,.45);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.13);transition:transform .25s var(--ease),background .2s}
.action:active svg{transform:scale(.86)}
.action span{font-size:11px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.action.liked svg{background:rgba(255,77,109,.22);color:#FF4D6D;fill:#FF4D6D;border-color:rgba(255,77,109,.55);animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:7;background:rgba(255,255,255,.14);direction:ltr}
.vprog i{display:block;height:100%;width:0;background:var(--grad);border-radius:0 3px 3px 0}
.burst{position:absolute;z-index:9;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;color:#FF4D6D;animation:burst .85s var(--ease) forwards;filter:drop-shadow(0 8px 24px rgba(255,77,109,.6))}
.burst svg{width:100%;height:100%}
@keyframes burst{0%{transform:scale(.3) rotate(-12deg);opacity:0}25%{transform:scale(1.15) rotate(6deg);opacity:1}70%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.5) translateY(-40px);opacity:0}}
.flash{position:absolute;left:50%;top:50%;z-index:9;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;pointer-events:none;animation:flash .6s var(--ease) forwards;color:#fff}
.flash svg{width:34px;height:34px}
@keyframes flash{0%{transform:scale(.6);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
.vload{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,0,.4);transition:opacity .3s,visibility .3s}
.vload.off{opacity:0;visibility:hidden}
.vload .zmark{--zs:62px}
.vload .verr{text-align:center;color:#fff;font-size:13px;line-height:2}.vload .verr button{pointer-events:auto;margin-top:6px}
.empty{height:100%;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;color:var(--muted);padding:36px;line-height:1.9;font-size:14px}
.empty svg{width:46px;height:46px;margin:0 auto 6px;color:var(--brand);opacity:.9}

/* ---------- Bottom navigation (floating glass) ---------- */
.bottom{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 10px);height:68px;border-radius:28px;z-index:20;
  background:rgba(10,32,42,.74);-webkit-backdrop-filter:blur(30px) saturate(1.7);backdrop-filter:blur(30px) saturate(1.7);border:1px solid var(--line2);box-shadow:0 14px 44px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.nav{position:relative;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:8px 8px;border-radius:18px;min-width:56px;transition:color .25s}
.nav svg{width:23px;height:23px;transition:transform .3s var(--ease)}
.nav.active{color:#fff}.nav.active svg{color:#7DE3D6;transform:translateY(-2px) scale(1.12)}
.nav.active:after{content:"";position:absolute;bottom:1px;width:16px;height:3px;border-radius:3px;background:var(--grad)}
.add{position:relative;width:56px;height:46px;border:0;border-radius:18px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(13,148,136,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.add svg{width:24px;height:24px}

/* ---------- Grids / profile ---------- */
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px var(--navh);align-content:start}
.cell{aspect-ratio:9/14;background:var(--surface);position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line)}
.cell video{width:100%;height:100%;object-fit:cover}
.discover-cell{cursor:pointer}.discover-cell video{width:100%;height:100%;object-fit:cover}
.dstat{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800}
.badge{position:absolute;top:6px;right:6px;border-radius:999px;padding:3px 8px;font-size:9.5px;font-weight:800}
.pending{background:var(--warning);color:#2a2000}.approved{background:var(--success);color:#03150d}.rejected{background:var(--danger);color:#fff}
.privacy{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);border-radius:999px;padding:3px 7px;font-size:10px}
.discover-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 6px;scrollbar-width:none}
.discover-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;border-radius:999px;padding:8px 16px;transition:.25s var(--ease)}

.page-body{flex:1;min-height:0;overflow:auto;padding:18px 18px var(--navh)}
.cover{position:relative;height:calc(150px + var(--sat));background:

  linear-gradient(135deg,#0F766E,#0E7490 60%,#0369A1)}

.code-chip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:700;direction:ltr}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:16px}

.profile-actions{display:flex;gap:8px;margin-top:14px}

.account-box{margin:6px 18px 12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}

.tile-btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2);color:var(--text);font-size:11px;font-weight:800}

.dl-btn{position:absolute;top:6px;left:6px;z-index:5;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ---------- Create / camera ---------- */
.camera{flex:1;position:relative;background:#000;overflow:hidden}
.camera>video,.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camera:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 28%,rgba(0,0,0,.62))}
.cambar{position:absolute;top:0;left:0;right:0;z-index:4;padding:calc(var(--sat) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:800}

.music{flex:0 0 auto;border:1px solid var(--line2);background:rgba(10,32,42,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:7px 13px;font-size:11px;font-weight:700}

.music-item.sel{color:#7DE3D6;font-weight:800}
.controls{position:absolute;bottom:calc(var(--sab) + 26px);left:0;right:0;z-index:4;display:flex;justify-content:center;align-items:center;gap:32px}
.rec{width:80px;height:80px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;padding:0;transition:.25s var(--ease)}
.rec i{width:60px;height:60px;border-radius:50%;background:var(--grad);display:block;transition:.25s var(--ease);box-shadow:0 0 28px rgba(8,145,178,.6)}
.rec.recording{border-color:var(--danger)}.rec.recording i{width:30px;height:30px;border-radius:9px;background:var(--danger)}
.tool{width:48px;height:48px;border:1px solid var(--line2);border-radius:50%;background:rgba(10,32,42,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;display:grid;place-items:center;padding:0}

/* ---------- Sheets ---------- */

.toast{position:absolute;left:50%;top:calc(var(--sat) + 14px);transform:translateX(-50%);z-index:300;max-width:calc(100% - 32px);background:rgba(20,50,64,.92);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line2);padding:11px 20px;border-radius:999px;font-size:12.5px;font-weight:800;text-align:center;line-height:1.6;animation:toastIn .4s var(--ease);box-shadow:0 14px 44px rgba(0,0,0,.55)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-16px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

/* ---------- Settings / lists ---------- */
.settings-sheet{padding-bottom:26px}

 const m=String(Math.floor((t%3600)/60)).padStart(2,'0');
 const s=String(t%60).padStart(2,'0');
 return `${h}:${m}:${s}`;
}

function signupRiskCheck(email,password){
  const domain=email.split("@")[1].toLowerCase();
  const local=email.split("@")[0];
  let score=0, reasons=[];
  if(DISPOSABLE_EMAIL_DOMAINS.has(domain)){score+=80;reasons.push("بريد مؤقت")}
  if(COMMON_PASSWORDS.has(password.toLowerCase())){score+=35;reasons.push("كلمة سر شائعة")}
  if(local.length<3){score+=20;reasons.push("اسم بريد قصير جدًا")}
  if(/^(.)\\1+$/.test(local)){score+=35;reasons.push("نمط بريد غير طبيعي")}
  if(/[<>"'`]/.test(email)){score+=50;reasons.push("صيغة بريد غير آمنة")}
  const attempts=signupAttempts().length;
  if(attempts>=5){score+=45;reasons.push("محاولات تسجيل كثيرة")}
  return {score,reasons,attempts};
}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null"); if(x)applyLoadedState(x);
    if(!state.session){const sess=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(sess)state.session=sess}
  }catch(e){}
  if(FIREBASE_READY && !remoteUnsub){
    try{
      remoteUnsub=remoteDoc().onSnapshot(snap=>{
        if(snap.metadata.hasPendingWrites)return;
        const x=snap.data();
        const first=!remoteLoaded; remoteLoaded=true;
        if(first) pendingSave=false; // أي تغيير قبل أول قراءة بنتجاهله بدل ما يمسح بيانات السيرفر
        if(!x)return;
        if(!first && x.updatedAt && x.updatedAt===lastSavedAt) return; // ده صدى كتابتنا إحنا، مفيش داعي نعيد رسم الشاشة (كان بيعيد تحميل الفيديوهات)
        applyLoadedState(x); render();
      },err=>{
        console.error("Firestore listen error",err);recordSystemError('firebase_listen',err?.message||String(err));
        if(!remoteErrShown){remoteErrShown=true;toast("⚠️ تعذّر الاتصال بقاعدة البيانات، تأكد من النت أو من قواعد Firestore");}
      });
    }catch(e){console.error("Firestore listener setup error",e)}
  }
}

async function downloadVideo(id,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  const v=state.videos.find(x=>x.id===id);

  const url=videoSrc(v);
  if(!url){toast("ملف الفيديو غير موجود");return}
  const name=dlName(v);
  try{
    if(url.includes("/storage/v1/object/public/")){
      // روابط Supabase: بإضافة ?download= السيرفر نفسه يرجّع الملف كتنزيل مباشر (من غير ما نحمّله في الذاكرة).
      const a=document.createElement("a");
      a.href=url+(url.includes("?")?"&":"?")+"download="+encodeURIComponent(name);
      a.rel="noopener";a.style.display="none";
      document.body.appendChild(a);a.click();a.remove();
      toast("⬇️ بدأ تنزيل الفيديو");
      return;
    }
    toast("⬇️ جاري تجهيز الفيديو…");
    const r=await fetch(url);if(!r.ok)throw new Error("http "+r.status);

    const a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(e){
    console.warn("download failed",e);
    toast("تعذّر التنزيل المباشر، هفتح الفيديو في صفحة جديدة");

}

function canViewVideo(v){
 if(!v||v.status!=="approved")return false;
 if(v.blockedByBan)return false;
 const owner=getAccount(v.ownerEmail);
 if(owner&&isBanned(owner))return false;
 const me=account();
 const isOwner=!!me&&accountKey(me.email)===accountKey(v.ownerEmail);
 if(isOwner)return true;
 if(isBlockedPair(v.ownerEmail))return false;
 // الحساب الخاص: فيديوهاته لا تظهر إلا للأصدقاء المقبولين، حتى لو كان الفيديو نفسه "عام".
 if(owner&&owner.isPrivate&&!isFriend(v.ownerEmail))return false;
 if(v.privacy==="private")return false;
 if(v.privacy==="friends")return !!me&&isFriend(v.ownerEmail);
 return true;
}

 let h=2166136261;

 return h;

 const videos=[...document.querySelectorAll('#feed video')];
 if(!videos.length)return;
 if(feedObserver)feedObserver.disconnect();
 // نضمن أن كل فيديو مُعدّ للتشغيل التلقائي فورًا بدون أي ضغطة من المستخدم:
 // متصفحات كتير محتاجة الخاصية muted تتظبط عن طريق الـ JS كمان مش بس الـ attribute.
 videos.forEach(v=>{
   v.muted=true; v.defaultMuted=true;
   try{v.playsInline=true;}catch(e){}
 });
 if(feed && !feed.dataset.infiniteBound){
   feed.dataset.infiniteBound="1";
   feed.addEventListener('scroll',()=>{
     if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-Math.max(700,feed.clientHeight*1.5))loadMoreFeed();
   },{passive:true});
 }
 if(feed && !feed.dataset.wheelBound){
   feed.dataset.wheelBound="1";
   feed.addEventListener('wheel',()=>{setTimeout(()=>{if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-900)loadMoreFeed()},80)},{passive:true});
 }
 if(!('IntersectionObserver' in window)){
   // لا يوجد دعم لـ IntersectionObserver: شغّل أول فيديو تلقائيًا كحد أدنى.
   videos[0]?.play().catch(()=>{});
   return;
 }
 feedObserver=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
     const v=entry.target, card=v.closest('.video-card'), b=card?.querySelector('.sound-btn');
     if(entry.isIntersecting && entry.intersectionRatio>=0.5){
       const nx=card?.nextElementSibling?.querySelector("video"); if(nx&&nx.preload!=="auto")nx.preload="auto";
       videos.forEach(x=>{
         if(x!==v){x.pause();x.muted=true;const bb=x.closest('.video-card')?.querySelector('.sound-btn');if(bb)bb.innerHTML=ICON.mute;}
       });
       // لا يمكن للمتصفح إجبار الصوت بدون تفاعل المستخدم. بعد أول تفاعل، ينتقل الصوت للفيديو الظاهر فقط.
       if(audioUnlocked){v.muted=false; if(b)b.innerHTML=ICON.vol; v.play().catch(()=>{v.muted=true;if(b)b.innerHTML=ICON.mute;v.play().catch(()=>{});});}
       else {v.muted=true;if(b)b.innerHTML=ICON.mute;v.play().catch(()=>{});}
     }else if(!entry.isIntersecting){
       v.pause();v.muted=true;if(b)b.innerHTML=ICON.mute;
     }
   });
 },{threshold:[0,0.25,0.5,0.75,1]});
 videos.forEach(v=>feedObserver.observe(v));
}

let searchDebounceTimer=null;
function debouncedSearch(q){
 clearTimeout(searchDebounceTimer);
 searchDebounceTimer=setTimeout(()=>runSearch(q),110);
}
function runSearch(q){
 const box=document.getElementById('searchResults');
 if(!box)return;
 const raw=String(q||'').trim();
 const query=normalizeSearchText(raw);
 if(!query){
   box.innerHTML='<div class="empty" style="height:auto;padding:25px">اكتب اسم الشخص أو اسم المستخدم أو الكود # أو جزءًا من وصف الفيديو.</div>';
   return;
 }
 const me=account();
 const rank=(text)=>{const t=normalizeSearchText(text);if(!t.includes(query))return -1;return t.startsWith(query)?0:1};
 const people=realPeople().map(a=>{
   const name=normalizeSearchText(a.name),email=normalizeSearchText(a.email),handle=email.replace(/@.*/,'');
   const code=String(a.code||''),codeHash='#'+code;
   const r=Math.min(...[rank(a.name),rank(a.email),rank(handle),rank(code),rank(codeHash)].filter(x=>x>=0),99);
   return {a,r};
 }).filter(x=>x.r<99).sort((x,y)=>x.r-y.r).map(x=>x.a).slice(0,30);
 const dupNameCount={};
 people.forEach(a=>{const key=normalizeSearchText(a.name||'');dupNameCount[key]=(dupNameCount[key]||0)+1});
 const vids=visibleVideos().map(v=>{
   const r=Math.min(...[rank(v.ownerName),rank(v.caption)].filter(x=>x>=0),99);
   return {v,r};
 }).filter(x=>x.r<99).sort((x,y)=>x.r-y.r).map(x=>x.v).slice(0,20);
 let html='';
 if(people.length){
   html+='<div class="search-title">الأشخاص</div>';
   html+=people.map(a=>{
     const rel=me?relationStatus(a.email):'none';
     const avatar=a.avatar?`<img src="${esc(a.avatar)}" alt="${esc(a.name||'صورة الحساب')}">`:initials(a.name);
     let action='';
     if(me){
       if(rel==='friends') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إزالة الصداقة</button><button class="btn btn-sm btn-ghost" onclick="closeSearch();openChat('${esc(a.email)}')">💬</button>`;
       else if(rel==='sent') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إلغاء الطلب</button>`;
       else if(rel==='incoming') action=`<button class="btn btn-sm btn-primary" onclick="acceptFriendRequest('${esc(a.email)}')">قبول الطلب</button>`;
       else action=`<button class="btn btn-sm btn-primary" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">متابعة</button>`;
     }
     const bizTag=a.accountType==='business'?' <span class="mini-badge biz">تجاري</span>':'';
     const isDup=(dupNameCount[normalizeSearchText(a.name||'')]||0)>1;
     const codeLine=`<span${isDup?' style="color:var(--cyan);font-weight:700"':''}>كود: ${esc(userCodeLabel(a))}</span>`;
     return `<div class="search-result person-result"><span class="avw"><button class="avatar sm" style="border:0;padding:0" onclick="closeSearch();openUserProfile('${esc(a.email)}')">${avatar}</button>${isCreator(a)?CREATOR_BADGE:''}</span><div class="search-person-info" style="cursor:pointer" onclick="closeSearch();openUserProfile('${esc(a.email)}')"><b>${esc(a.name||'مستخدم')}${badges(a)}${bizTag}</b><div class="muted">@${esc(String(a.email).split('@')[0])} · ${codeLine}</div>${isDup?`<div class="muted" style="font-size:10.5px;color:var(--warning)">⚠️ في أكتر من شخص بنفس الاسم — استخدم الكود للتأكد إنك بتختار الشخص الصح</div>`:''}</div>${action}</div>`;
   }).join('');
 }
 if(vids.length){
   html+='<div class="search-title">الفيديوهات</div>';
   html+=vids.map(v=>`<div class="search-result video-result"><video src="${esc(videoSrc(v))}" muted playsinline controls></video><div style="flex:1;min-width:0"><b>@${esc(v.ownerName||'مستخدم')}</b><div class="muted" style="margin-top:3px">${esc(v.caption||'بدون وصف')}</div><button class="btn btn-sm btn-primary" style="margin-top:7px" onclick="closeSearch();state.ui.comments='${esc(v.id)}';render()">عرض الفيديو</button></div></div>`).join('');
 }
 box.innerHTML=html||'<div class="empty" style="height:auto;padding:25px">لم يتم العثور على شخص أو فيديو بهذا الاسم أو الكود.</div>';
}

function computeEarnings(a){
 const vids=state.videos.filter(v=>v.ownerEmail===a.email&&v.status==='approved');
 const perVideo=vids.map(v=>({id:v.id,caption:v.caption,likes:v.likes.length,comments:v.comments.length,coins:v.likes.length*2+v.comments.length*1}));
 const videoCoins=perVideo.reduce((s,v)=>s+v.coins,0);
 const followerCount=Array.isArray(a.followers)?a.followers.length:0;
 const followerCoins=followerCount*100;
 const giftCoins=Math.max(0,Number(a.giftCoins)||0);
 const totalCoins=videoCoins+followerCoins+giftCoins;
 const withdrawn=Number(a.earningsWithdrawn)||0;
 const balance=Math.max(0,totalCoins-withdrawn);
 return {perVideo,videoCoins,followerCount,followerCoins,giftCoins,totalCoins,withdrawn,balance};
}
function myWithdrawal(a){
 if(!a)return null;
 return (state.withdrawals||[]).filter(w=>w.ownerEmail===a.email).sort((x,y)=>y.createdAt-x.createdAt)[0]||null;
}
function openWithdrawSheet(){
 const a=account();if(!a)return;
 const e=computeEarnings(a);
 if(e.balance<=0){toast('لا يوجد رصيد كافٍ للسحب حاليًا');return}
 if(myWithdrawal(a)){toast('لديك طلب سحب قائم بالفعل');return}
 state.ui.withdrawSheet=true;state.ui.withdrawWallet=WALLETS[0].id;state.ui.withdrawPhone='';render();
}

function submitWithdraw(){
 const a=account();if(!a)return;
 const e=computeEarnings(a);
 if(e.balance<=0){toast('لا يوجد رصيد كافٍ للسحب حاليًا');closeWithdrawSheet();return}
 if(myWithdrawal(a)){toast('لديك طلب سحب قائم بالفعل');closeWithdrawSheet();return}
 const phoneEl=app.querySelector('#withdrawPhone');
 const phone=String(phoneEl?phoneEl.value:state.ui.withdrawPhone||'').trim();
 const err=app.querySelector('#withdrawErr');
 const wallet=state.ui.withdrawWallet||WALLETS[0].id;
 if(err)err.style.display='none';
 if(!/^01[0125]\d{8}$/.test(phone)){
   if(err){err.textContent='اكتب رقم محفظة مصري صحيح (11 رقم يبدأ بـ 010/011/012/015)';err.style.display='block';}
   return;
 }
 const walletName=(WALLETS.find(w=>w.id===wallet)||WALLETS[0]).name;
 const coins=e.balance;
 const req={id:'w'+Date.now()+Math.random().toString(36).slice(2,7),ownerEmail:a.email,ownerName:a.name,wallet,walletName,phone,coins,amount:Number((coins*0.05).toFixed(2)),status:'pending',createdAt:Date.now()};
 state.withdrawals=state.withdrawals||[];
 state.withdrawals.push(req);
 a.earningsWithdrawn=(Number(a.earningsWithdrawn)||0)+coins;
 state.ui.withdrawSheet=false;state.ui.withdrawPhone='';
 save();render();
 toast('✅ تم إرسال طلب السحب، الطلب قيد المراجعة');
}

/* ---------- تخزين ملفات الفيديو على Supabase Storage (بدون بطاقة، يشتغل من أي جهاز) ---------- */
async function uploadVideoFile(id,blob){
  if(!SUPABASE_READY||!supabaseClient) throw new Error("supabase_not_configured");
  if(!blob) throw new Error("no_file");

  // اسم فريد + امتداد حقيقي للفيديو.
  const mime=String(blob.type||"video/webm").toLowerCase();
  const ext=mime.includes("mp4")?"mp4":mime.includes("quicktime")?"mov":"webm";
  const path=`${id}.${ext}`;

  // مهم: لا نستخدم upsert هنا؛ لأن upsert يحتاج صلاحيات إضافية
  // (SELECT/UPDATE) وقد يمنع الرفع عند وجود سياسة INSERT فقط.
  const {error:upErr}=await supabaseClient.storage
    .from(SUPABASE_BUCKET)
    .upload(path,blob,{
      contentType:mime,
      cacheControl:"3600",
      upsert:false
    });

  if(upErr){
    console.error("Supabase Storage upload error:",upErr);
    const msg=upErr.message||upErr.error_description||"upload_failed";
    throw new Error(`Supabase Storage: ${msg}`);
  }

  const {data}=supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
  if(!data?.publicUrl) throw new Error("Supabase Storage: public URL unavailable");
  return data.publicUrl;
}
async function deleteVideoFile(id){
  if(!SUPABASE_READY||!supabaseClient) return;
  try{
    await supabaseClient.storage.from(SUPABASE_BUCKET).remove([
      id, `${id}.mp4`, `${id}.webm`, `${id}.mov`
    ]);
  }catch(e){ console.warn("Supabase delete error",e); }
}

function setupAudioMix(){
 if(!stream)return stream;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
  mixDest=audioCtx.createMediaStreamDestination();
  micSource=audioCtx.createMediaStreamSource(stream);
  const micGain=audioCtx.createGain();micGain.gain.value=1;micSource.connect(micGain).connect(mixDest);
  if(state.ui.song!==SONGS[0]) startMusic(audioCtx,mixDest);
  const tracks=[...stream.getVideoTracks(),...mixDest.stream.getAudioTracks()];
  return new MediaStream(tracks);
 }catch(e){return stream}
}
function startMusic(ctx,dest){
 stopMusic();
 const fam=songFamily(state.ui.song);
 const notes=fam?fam.notes:[220,247,262,247];
 musicStep=0;
 const playNote=()=>{
   const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=notes[musicStep%notes.length];
   g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.055,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.34);
   o.connect(g).connect(dest);o.start();o.stop(ctx.currentTime+.36);musicStep++;
 };
 playNote();musicTimer=setInterval(playNote,380);
}

/* ---------- قسم الأغاني ---------- */
/* لو عندك ملفات صوت حقيقية ضيفها هنا وهتظهر فوق قايمة الأغاني: {title:'اسم الأغنية',artist:'الفنان',url:'https://.../song.mp3'} */
const SONG_LIBRARY=[];
let songCtx=null,songTimer=null,songStopT=null,songPlaying=null;
function stopPreview(){if(songTimer){clearInterval(songTimer);songTimer=null}if(songStopT){clearTimeout(songStopT);songStopT=null}songPlaying=null}
function togglePreview(name){
 if(songPlaying===name){stopPreview();refreshSongs();return}
 stopPreview();
 try{
  songCtx=songCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(songCtx.state==='suspended')songCtx.resume();
  const fam=songFamily(name)||{notes:[220,247,262,247]};
  const n=parseInt((String(name).match(/(\d+)$/)||[0,1])[1],10)||1;
  const shift=Math.pow(2,((n*5)%12)/12),gap=300+(n%6)*45,wave=['sine','triangle','square'][n%3],vol=wave==='square'?.022:.06;
  let step=0;
  const play=()=>{const t=songCtx.currentTime,o=songCtx.createOscillator(),g=songCtx.createGain();o.type=wave;o.frequency.value=fam.notes[step%fam.notes.length]*shift*((Math.floor(step/4)%2)?1.25:1);
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.34);
   o.connect(g).connect(songCtx.destination);o.start(t);o.stop(t+.36);step++};
  play();songTimer=setInterval(play,gap);songStopT=setTimeout(()=>{stopPreview();refreshSongs()},15000);songPlaying=name;
 }catch(e){toast('المتصفح ده مش بيشغل المعاينة الصوتية')}

function commentCount(v){return (v.comments||[]).reduce((s,c)=>s+1+((c.replies||[]).length),0)}

function commentPolicy(v){
 const o=getAccount(v.ownerEmail),me=account();
 if(!me)return {ok:false,msg:'سجّل الدخول عشان تعلّق'};
 if(accountKey(me.email)===accountKey(v.ownerEmail))return {ok:true};
 if(isBlockedPair(v.ownerEmail))return {ok:false,msg:'مش متاح التعليق على الفيديو ده'};
 const w=(o&&o.whoComments)||'all';
 if(w==='none')return {ok:false,msg:'صاحب الفيديو قفل التعليقات'};
 if(w==='friends'&&!isFriend(v.ownerEmail))return {ok:false,msg:'التعليقات مفتوحة لأصدقاء صاحب الفيديو بس'};
 return {ok:true};
}

function notifEnabled(){try{return localStorage.getItem('tarab_notif')==='1'&&'Notification' in window&&Notification.permission==='granted'}catch(e){return false}}
async function enableNotif(){
 if(!('Notification' in window)){toast('المتصفح ده مش بيدعم الإشعارات');return}
 const p=await Notification.requestPermission();
 if(p==='granted'){try{localStorage.setItem('tarab_notif','1');localStorage.setItem('tarab_nat',String(Date.now()))}catch(e){}toast('🔔 اتفعّلت إشعارات المتصفح')}else toast('المتصفح رفض الإذن، فعّله من إعدادات الموقع');
 render();
}
function disableNotif(){try{localStorage.setItem('tarab_notif','0')}catch(e){}render()}
function checkNotify(){
 if(!notifEnabled()||!state.session||state.session.isAdmin)return;
 let last=0;try{last=Number(localStorage.getItem('tarab_nat')||0)}catch(e){}
 const ev=notificationEvents().filter(e=>(e.at||0)>last);if(!ev.length)return;
 try{localStorage.setItem('tarab_nat',String(Math.max.apply(null,ev.map(e=>e.at||0))))}catch(e){}
 if(!document.hidden)return;
 ev.slice(0,3).forEach(e=>{try{new Notification(e.title||'Tarab',{body:e.text||'',tag:e.id})}catch(x){}});
}

  },700);
}

/* ---------- تجربة التطبيق: تفاعل الفيديو + تثبيت + اهتزاز خفيف ---------- */
let _tapT=null,_lastTap=0;
function vTap(ev,v){
  const now=Date.now();
  if(now-_lastTap<300){
    clearTimeout(_tapT);_lastTap=0;
    const card=v.closest(".video-card"),id=card?.dataset.id,vid=state.videos.find(x=>x.id===id);
    if(!state.session){requireLogin();return}
    if(card){
      const r=card.getBoundingClientRect();
      card.insertAdjacentHTML("beforeend",`<div class="burst" style="left:${ev.clientX-r.left}px;top:${ev.clientY-r.top}px">${ICON.heartfill}</div>`);
      setTimeout(()=>card.querySelector(".burst")?.remove(),900);
    }
    if(vid&&!liked(vid))likeVideo(id);
    return;
  }
  _lastTap=now;
  _tapT=setTimeout(()=>{
    if(!audioUnlocked){videoGesture(v);return}
    const card=v.closest(".video-card");
    const flash=(svg)=>{card?.querySelector(".flash")?.remove();card?.insertAdjacentHTML("beforeend",`<div class="flash">${svg}</div>`);setTimeout(()=>card?.querySelector(".flash")?.remove(),650)};
    if(v.paused){v.play().catch(()=>{});flash(ICON.play)}else{v.pause();flash(ICON.pause)}
  },300);
}
function vProg(v){const i=v.closest(".video-card")?.querySelector(".vprog i");if(i&&v.duration)i.style.width=(v.currentTime/v.duration*100)+"%"}

let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
window.addEventListener("appinstalled",()=>{deferredInstall=null;toast("✅ تم تثبيت Tarab على جهازك")});
function isStandalone(){try{return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}catch(e){return false}}
async function installApp(){
  if(deferredInstall){
    try{deferredInstall.prompt();await deferredInstall.userChoice}catch(e){}
    deferredInstall=null;closeSettings();return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  closeSettings();
  toast(ios?"من زر المشاركة اختار «إضافة إلى الشاشة الرئيسية»":"من قائمة المتصفح (⋮) اختار «تثبيت التطبيق»");
}

document.addEventListener("click",e=>{try{if(navigator.vibrate&&e.target.closest&&e.target.closest("button,.cell"))navigator.vibrate(6)}catch(_){}},true);
// أيقونة التطبيق + manifest (بتعمل على الروابط https)
(function setupPWA(){
  try{
    const mk=(size)=>{
      const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
      const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,"#0D9488");g.addColorStop(.55,"#0891B2");g.addColorStop(1,"#0369A1");
      x.fillStyle=g;x.fillRect(0,0,size,size);
      x.strokeStyle="#fff";x.lineWidth=size*.1;x.lineCap="round";x.lineJoin="round";
      const p=size*.3,q=size*.7;x.beginPath();x.moveTo(p,p);x.lineTo(q,p);x.lineTo(p,q);x.lineTo(q,q);x.stroke();
      return c.toDataURL("image/png");
    };
    const i192=mk(192),i512=mk(512);
    const ap=document.createElement("link");ap.rel="apple-touch-icon";ap.href=i192;document.head.appendChild(ap);
    if(/^https?:$/.test(location.protocol)){
      const manifest={name:"Tarab",short_name:"Tarab",description:"شارك لحظاتك بفيديوهات قصيرة",lang:"ar",dir:"rtl",display:"standalone",orientation:"portrait",background_color:"#06141A",theme_color:"#06141A",start_url:location.href.split("#")[0],icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
      const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));document.head.appendChild(l);
    }
  }catch(e){console.warn("PWA setup skipped",e)}
})();

function initBackends(){
  const fb=initFirebase(); initSupabase();
  if(fb && !remoteUnsub){try{load()}catch(e){console.warn("load after libs failed",e)}}
  return FIREBASE_READY&&SUPABASE_READY;
}
(window.__svLibs||Promise.resolve()).then(initBackends);
