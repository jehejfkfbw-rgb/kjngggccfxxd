<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0A10">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Zaply">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zaply">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Zaply — شارك لحظاتك بفيديوهات قصيرة، واكتشف محتوى يشبهك.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M20 21h24L20 43h24' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Zaply | شارك لحظاتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'">

<style>
/* =====================================================================
   Zaply — Design System (v1)
   ===================================================================== */
:root{
  --bg:#0A0A10;--bg2:#0F0F17;--surface:#15151F;--surface2:#1C1C29;--surface3:#262636;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --text:#F6F6FB;--muted:#9696AB;--muted2:#6B6B80;
  --brand:#8B5CF6;--brand2:#EC4899;--gold:#FBBF24;
  --purple:#8B5CF6;--cyan:#22D3EE;--pink:#A78BFA;
  --danger:#FF4D6D;--success:#2DD4A0;--warning:#FBBF24;
  --grad:linear-gradient(135deg,#8B5CF6 0%,#D946EF 55%,#EC4899 100%);
  --r-sm:12px;--r:16px;--r-lg:24px;--r-xl:30px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --navh:calc(var(--sab) + 98px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050508;overscroll-behavior:none}
body{
  font-family:"Cairo","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);display:flex;justify-content:center;align-items:center;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background:radial-gradient(60% 50% at 50% 0%,rgba(139,92,246,.22),transparent 70%),radial-gradient(40% 40% at 90% 100%,rgba(236,72,153,.14),transparent 70%),#050508;
}
button,input,textarea{font:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;color:inherit}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(167,139,250,.7);outline-offset:2px}
h1,h2,p{margin:0}
svg{width:24px;height:24px;display:block}
.hidden{display:none!important}
::-webkit-scrollbar{width:0;height:0}

#app{width:100%;max-width:480px;height:100dvh;min-height:560px;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:481px){#app{height:min(920px,95dvh);border-radius:38px;border:1px solid var(--line2);box-shadow:0 30px 120px rgba(0,0,0,.7),0 0 0 8px rgba(255,255,255,.03)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.fade{animation:fade .32s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}

/* ---------- Brand mark (Z) ---------- */
.zmark{--zs:56px;width:var(--zs);height:var(--zs);border-radius:30%;background:var(--grad);display:grid;place-items:center;flex:none;position:relative;
  box-shadow:0 10px 30px rgba(168,85,247,.42),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 16px rgba(0,0,0,.12)}
.zmark svg{width:56%;height:56%;overflow:visible}
.zmark.draw svg path{stroke-dasharray:46;stroke-dashoffset:46;animation:zdraw 1.5s cubic-bezier(.65,0,.35,1) infinite}
@keyframes zdraw{0%{stroke-dashoffset:46}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-46}}
@keyframes zfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.04)}}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.1);opacity:0}}

/* ---------- Splash ---------- */
.splash{align-items:center;justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(60% 40% at 50% 38%,rgba(139,92,246,.34),transparent 72%),radial-gradient(45% 30% at 80% 90%,rgba(236,72,153,.2),transparent 70%),var(--bg)}
.splash-mark{position:relative;display:grid;place-items:center;margin-bottom:26px}
.splash-mark .zmark{--zs:124px;animation:zfloat 2.4s ease-in-out infinite;box-shadow:0 24px 70px rgba(168,85,247,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.splash-mark .ring{position:absolute;inset:0;border-radius:32%;border:2px solid rgba(167,139,250,.55);animation:ring 2.2s ease-out infinite}
.splash-mark .ring.r2{animation-delay:1.1s}
.splash-name{font-size:38px;font-weight:900;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-desc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.9;max-width:270px}
.dots{display:flex;gap:7px;margin-top:34px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s;background:#C455F0}.dots i:nth-child(3){animation-delay:.3s;background:var(--brand2)}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1.15);opacity:1}}

/* ---------- Buttons / inputs ---------- */
.btn{border:0;border-radius:var(--r);padding:13px 18px;font-weight:800;font-size:14.5px;min-height:50px;transition:transform .15s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 28px rgba(192,64,240,.32),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#03150d}
.btn-outline-danger{background:transparent;color:var(--danger);border:1px solid rgba(255,77,109,.4)}
.btn-sm{min-height:36px;padding:7px 14px;font-size:12.5px;border-radius:12px}
.full{width:100%}
input,textarea{width:100%;background:var(--surface);color:var(--text);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder,textarea::placeholder{color:var(--muted2)}
input:focus,textarea:focus{border-color:var(--brand);background:var(--surface2);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.note{font-size:11px;color:var(--muted);text-align:center;line-height:1.8;margin-top:13px}
.error{color:var(--danger);font-size:12.5px;margin-top:8px;display:none;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:700}
.pw{position:relative}.pw input{padding-inline-end:50px}
.pw .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.pw .eye svg{width:20px;height:20px}

/* ---------- Auth ---------- */
.auth{padding:calc(var(--sat) + 44px) 24px 30px;overflow:auto;
  background:radial-gradient(70% 34% at 85% 0%,rgba(139,92,246,.36),transparent 72%),radial-gradient(55% 28% at 0% 8%,rgba(236,72,153,.24),transparent 72%),var(--bg)}
.auth-head{text-align:center;margin-bottom:30px}
.auth-head .zmark{--zs:78px;margin:0 auto 20px}
.auth-head h1{font-size:28px;font-weight:900;letter-spacing:-.4px;margin-bottom:6px}
h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
.auth-switch{display:block;width:100%;margin-top:14px;border:0;background:none;color:var(--muted);font-size:13px;padding:10px;text-align:center;font-weight:600}
.auth-switch b{color:#B79CFF;font-weight:800}
.secure-warning{margin:12px 0;padding:12px 14px;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.2);border-radius:var(--r);color:#f6d47a;font-size:11.5px;line-height:1.8}
.review-box{margin:12px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);text-align:center}
.review-box b{display:block;color:var(--gold);font-size:14px;margin-bottom:4px;font-weight:800}
.review-box span{color:var(--muted);font-size:12px}
.review-note{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:11px;color:var(--muted)}
.review-note b{color:var(--text);white-space:nowrap}.review-note span{line-height:1.7}
.permission-screen{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;background:radial-gradient(60% 35% at 50% 20%,rgba(139,92,246,.25),transparent 70%)}
.permission-screen h1{font-size:21px;margin:16px 0 8px}.permission-screen p{max-width:320px;margin-bottom:20px}
.permission-icon{width:88px;height:88px;border-radius:28px;background:var(--grad);display:grid;place-items:center;font-size:34px;box-shadow:0 18px 50px rgba(168,85,247,.4)}

/* ---------- Top bars ---------- */
.topbar{height:calc(58px + var(--sat));min-height:calc(58px + var(--sat));padding-top:var(--sat);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;position:relative;
  background:rgba(10,10,16,.72);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border-bottom:1px solid var(--line);z-index:4}
.topbar .side{position:absolute;top:calc(var(--sat) + 9px);display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.06);color:var(--text)}
.topbar .side svg{width:20px;height:20px}
.topbar .right{right:12px}.topbar .left{left:12px}
.page-head{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 16px) 18px 6px}
.page-head h1{font-size:28px}
.glass-btn{width:42px;height:42px;border:1px solid var(--line2);border-radius:15px;background:rgba(24,24,36,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;display:grid;place-items:center;position:relative;flex:none}
.glass-btn svg{width:21px;height:21px}
.mini-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);vertical-align:middle}
.mini-badge.biz{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.3)}
.icon-btn{border:0;background:none;color:var(--muted);padding:4px;display:inline-grid;place-items:center}.icon-btn svg{width:17px;height:17px}

/* ---------- Home / feed ---------- */
.home-topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(var(--sat) + 10px) 14px 26px;background:linear-gradient(180deg,rgba(0,0,0,.62),transparent);pointer-events:none}
.home-topbar>*{pointer-events:auto}
.brand-lockup{display:flex;align-items:center;gap:8px}
.brand-lockup .zmark{--zs:36px;box-shadow:0 6px 18px rgba(168,85,247,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.brand-lockup b{font-size:20px;font-weight:900;letter-spacing:-.4px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.feed-tabs{display:flex;gap:3px;padding:4px;border-radius:999px;background:rgba(20,20,30,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line)}
.feed-tabs button{border:0;background:none;color:rgba(255,255,255,.72);font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:999px;transition:.25s var(--ease);white-space:nowrap}
.feed-tabs button.on{background:#fff;color:#0A0A10}
.top-actions{display:flex;gap:8px}
.top-search,.notification-bell{position:relative;width:42px;height:42px;border:1px solid var(--line2);border-radius:15px;background:rgba(24,24,36,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;display:grid;place-items:center}
.top-search svg,.notification-bell svg{width:21px;height:21px}
.notification-bell span{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font:800 10px/19px system-ui;text-align:center;border:2px solid #0A0A10}
@media(max-width:400px){.brand-lockup b{display:none}.feed-tabs button{padding:7px 11px}}
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.video-card{height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000;overflow:hidden}
.video-card>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.video-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 20%,transparent 50%,rgba(0,0,0,.86))}
.sound-btn{position:absolute;right:14px;top:calc(var(--sat) + 76px);z-index:6;width:40px;height:40px;border:1px solid var(--line2);border-radius:50%;background:rgba(20,20,30,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;display:grid;place-items:center;padding:0}
.sound-btn svg{width:19px;height:19px}
.meta{position:absolute;right:16px;left:86px;bottom:calc(var(--sab) + 104px);z-index:3}
.user-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user{font-size:15.5px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.follow-chip{border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.08);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.follow-chip.sent{border-color:var(--line2);color:var(--muted)}
.caption{font-size:13.5px;line-height:1.75;color:#f4f4f8;margin-top:8px;text-shadow:0 1px 8px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.song{display:inline-flex;gap:6px;align-items:center;margin-top:10px;padding:5px 12px;border-radius:999px;background:rgba(20,20,30,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);color:#fff;font-size:11px;font-weight:700}
.song svg{width:14px;height:14px;color:#D8B4FE}
.actions{position:absolute;left:12px;bottom:calc(var(--sab) + 104px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:13px}
.avatar{display:grid;place-items:center;background:var(--grad);font-weight:800;overflow:hidden;color:#fff}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:48px;height:48px;border-radius:50%;border:2px solid #fff;margin-bottom:4px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.action{border:0;background:none;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.action svg{width:48px;height:48px;padding:12px;border-radius:50%;background:rgba(20,20,30,.45);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.13);transition:transform .25s var(--ease),background .2s}
.action:active svg{transform:scale(.86)}
.action span{font-size:11px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.action.liked svg{background:rgba(255,77,109,.22);color:#FF4D6D;fill:#FF4D6D;border-color:rgba(255,77,109,.55);animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:7;background:rgba(255,255,255,.14);direction:ltr}
.vprog i{display:block;height:100%;width:0;background:var(--grad);border-radius:0 3px 3px 0}
.burst{position:absolute;z-index:9;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;color:#FF4D6D;animation:burst .85s var(--ease) forwards;filter:drop-shadow(0 8px 24px rgba(255,77,109,.6))}
.burst svg{width:100%;height:100%}
@keyframes burst{0%{transform:scale(.3) rotate(-12deg);opacity:0}25%{transform:scale(1.15) rotate(6deg);opacity:1}70%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.5) translateY(-40px);opacity:0}}
.flash{position:absolute;left:50%;top:50%;z-index:9;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;pointer-events:none;animation:flash .6s var(--ease) forwards;color:#fff}
.flash svg{width:34px;height:34px}
@keyframes flash{0%{transform:scale(.6);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
.vload{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,0,.4);transition:opacity .3s,visibility .3s}
.vload.off{opacity:0;visibility:hidden}
.vload .zmark{--zs:62px}
.vload .verr{text-align:center;color:#fff;font-size:13px;line-height:2}.vload .verr button{pointer-events:auto;margin-top:6px}
.empty{height:100%;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;color:var(--muted);padding:36px;line-height:1.9;font-size:14px}
.empty svg{width:46px;height:46px;margin:0 auto 6px;color:var(--brand);opacity:.9}

/* ---------- Bottom navigation (floating glass) ---------- */
.bottom{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 10px);height:68px;border-radius:28px;z-index:20;
  background:rgba(20,20,30,.74);-webkit-backdrop-filter:blur(30px) saturate(1.7);backdrop-filter:blur(30px) saturate(1.7);border:1px solid var(--line2);box-shadow:0 14px 44px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.nav{position:relative;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:8px 8px;border-radius:18px;min-width:56px;transition:color .25s}
.nav svg{width:23px;height:23px;transition:transform .3s var(--ease)}
.nav.active{color:#fff}.nav.active svg{color:#C4A5FF;transform:translateY(-2px) scale(1.12)}
.nav.active:after{content:"";position:absolute;bottom:1px;width:16px;height:3px;border-radius:3px;background:var(--grad)}
.add{position:relative;width:56px;height:46px;border:0;border-radius:18px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(192,64,240,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.add svg{width:24px;height:24px}

/* ---------- Grids / profile ---------- */
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px var(--navh);align-content:start}
.cell{aspect-ratio:9/14;background:var(--surface);position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line)}
.cell video{width:100%;height:100%;object-fit:cover}
.discover-cell{cursor:pointer}.discover-cell video{width:100%;height:100%;object-fit:cover}
.dstat{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800}
.badge{position:absolute;top:6px;right:6px;border-radius:999px;padding:3px 8px;font-size:9.5px;font-weight:800}
.pending{background:var(--warning);color:#2a2000}.approved{background:var(--success);color:#03150d}.rejected{background:var(--danger);color:#fff}
.privacy{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);border-radius:999px;padding:3px 7px;font-size:10px}
.discover-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 6px;scrollbar-width:none}
.discover-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:800;border-radius:999px;padding:8px 16px;transition:.25s var(--ease)}

  if(COMMON_PASSWORDS.has(password.toLowerCase())){score+=35;reasons.push("كلمة سر شائعة")}
  if(local.length<3){score+=20;reasons.push("اسم بريد قصير جدًا")}
  if(/^(.)\\1+$/.test(local)){score+=35;reasons.push("نمط بريد غير طبيعي")}
  if(/[<>"'`]/.test(email)){score+=50;reasons.push("صيغة بريد غير آمنة")}
  const attempts=signupAttempts().length;
  if(attempts>=5){score+=45;reasons.push("محاولات تسجيل كثيرة")}
  return {score,reasons,attempts};
}

function load(){

    const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null"); if(x)applyLoadedState(x);
    if(!state.session){const sess=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(sess)state.session=sess}
  }catch(e){}
  if(FIREBASE_READY && !remoteUnsub){
    try{
      remoteUnsub=remoteDoc().onSnapshot(snap=>{
        if(snap.metadata.hasPendingWrites)return;
        const x=snap.data();
        const first=!remoteLoaded; remoteLoaded=true;
        if(first) pendingSave=false; // أي تغيير قبل أول قراءة بنتجاهله بدل ما يمسح بيانات السيرفر

        console.error("Firestore listen error",err);recordSystemError('firebase_listen',err?.message||String(err));
        if(!remoteErrShown){remoteErrShown=true;toast("⚠️ تعذّر الاتصال بقاعدة البيانات، تأكد من النت أو من قواعد Firestore");}

}

// تم فقدان هاتين الدالتين في نسخة سابقة، وهذا كان يوقف الشاشة الرئيسية بعد كل تسجيل دخول
// (الخطأ: feedVideos is not defined) ويرجع المستخدم لشاشة الدخول بدون سبب واضح.
function canViewVideo(v){
 if(!v||v.status!=="approved")return false;
 if(v.blockedByBan)return false;
 const owner=getAccount(v.ownerEmail);
 if(owner&&isBanned(owner))return false;
 const me=account();
 const isOwner=!!me&&accountKey(me.email)===accountKey(v.ownerEmail);
 if(isOwner)return true;
 // الحساب الخاص: فيديوهاته لا تظهر إلا للأصدقاء المقبولين، حتى لو كان الفيديو نفسه "عام".
 if(owner&&owner.isPrivate&&!isFriend(v.ownerEmail))return false;
 if(v.privacy==="private")return false;
 if(v.privacy==="friends")return !!me&&isFriend(v.ownerEmail);
 return true;
}

const feedShuffleSalt=Math.random().toString(36).slice(2)+Date.now();
function shuffleHash(str){
 let h=2166136261;
 for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}
 return h;
}
function allFeed(){
 return visibleVideos().slice().sort((a,b)=>shuffleHash(feedShuffleSalt+a.id)-shuffleHash(feedShuffleSalt+b.id));
}

function isFollower(email){const me=account();const e=accountKey(email);return !!(me&&e&&relList(me,'followers').some(x=>accountKey(x)===e))}

let audioUnlocked=false;
let feedObserver=null;
function videoGesture(v){
  // أول لمسة من المستخدم تسمح للمتصفح بتشغيل الصوت، ثم نفعّل صوت الفيديو الحالي فقط.
  audioUnlocked=true;
  const card=v.closest('.video-card');
  document.querySelectorAll('#feed video').forEach(x=>{
    if(x!==v){x.pause();x.muted=true; const b=x.closest('.video-card')?.querySelector('.sound-btn'); if(b)b.innerHTML=ICON.mute;}
  });
  v.muted=false;
  v.play().catch(()=>{v.muted=true;});
  const b=card?.querySelector('.sound-btn'); if(b){b.innerHTML=(v.muted?ICON.mute:ICON.vol);b.setAttribute('aria-label',v.muted?'تشغيل الصوت':'كتم الصوت');}
}
function togglePlay(v){videoGesture(v)}
function toggleSound(e,btn){
 e.stopPropagation();
 audioUnlocked=true;
 const card=btn.closest('.video-card'),v=card?.querySelector('video'); if(!v)return;
 document.querySelectorAll('#feed video').forEach(x=>{
   if(x!==v){x.pause();x.muted=true; const b=x.closest('.video-card')?.querySelector('.sound-btn'); if(b)b.innerHTML=ICON.mute;}
 });
 v.muted=!v.muted;
 if(!v.muted){v.play().catch(()=>{});btn.innerHTML=ICON.vol;btn.setAttribute('aria-label','كتم الصوت')}
 else{btn.innerHTML=ICON.mute;btn.setAttribute('aria-label','تشغيل الصوت')}
}
// نفس المشكلة: كانت تُستدعى عند التمرير في الفيديوهات لكنها غير موجودة أصلًا
// (لا يوجد تحميل صفحات إضافي حاليًا، فتُركت بدون أي عملية لمنع توقف الصفحة).
function loadMoreFeed(){}
function setupFeedPlayback(){
 const feed=document.getElementById('feed');
 const videos=[...document.querySelectorAll('#feed video')];
 if(!videos.length)return;
 if(feedObserver)feedObserver.disconnect();
 // نضمن أن كل فيديو مُعدّ للتشغيل التلقائي فورًا بدون أي ضغطة من المستخدم:
 // متصفحات كتير محتاجة الخاصية muted تتظبط عن طريق الـ JS كمان مش بس الـ attribute.
 videos.forEach(v=>{
   v.muted=true; v.defaultMuted=true;
   try{v.playsInline=true;}catch(e){}
 });
 if(feed && !feed.dataset.infiniteBound){
   feed.dataset.infiniteBound="1";
   feed.addEventListener('scroll',()=>{
     if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-Math.max(700,feed.clientHeight*1.5))loadMoreFeed();
   },{passive:true});
 }
 if(feed && !feed.dataset.wheelBound){
   feed.dataset.wheelBound="1";
   feed.addEventListener('wheel',()=>{setTimeout(()=>{if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-900)loadMoreFeed()},80)},{passive:true});
 }
 if(!('IntersectionObserver' in window)){
   // لا يوجد دعم لـ IntersectionObserver: شغّل أول فيديو تلقائيًا كحد أدنى.
   videos[0]?.play().catch(()=>{});
   return;
 }
 feedObserver=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
     const v=entry.target, card=v.closest('.video-card'), b=card?.querySelector('.sound-btn');
     if(entry.isIntersecting && entry.intersectionRatio>=0.5){
       const nx=card?.nextElementSibling?.querySelector("video"); if(nx&&nx.preload!=="auto")nx.preload="auto";
       videos.forEach(x=>{
         if(x!==v){x.pause();x.muted=true;const bb=x.closest('.video-card')?.querySelector('.sound-btn');if(bb)bb.innerHTML=ICON.mute;}
       });
       // لا يمكن للمتصفح إجبار الصوت بدون تفاعل المستخدم. بعد أول تفاعل، ينتقل الصوت للفيديو الظاهر فقط.
       if(audioUnlocked){v.muted=false; if(b)b.innerHTML=ICON.vol; v.play().catch(()=>{v.muted=true;if(b)b.innerHTML=ICON.mute;v.play().catch(()=>{});});}
       else {v.muted=true;if(b)b.innerHTML=ICON.mute;v.play().catch(()=>{});}
     }else if(!entry.isIntersecting){
       v.pause();v.muted=true;if(b)b.innerHTML=ICON.mute;
     }
   });
 },{threshold:[0,0.25,0.5,0.75,1]});
 videos.forEach(v=>feedObserver.observe(v));
}

function openSearch(){state.ui.search=true;render();setTimeout(()=>{const input=document.getElementById('searchQuery');if(input){input.focus();input.select()}},60)}
function closeSearch(){state.ui.search=false;render()}
function searchSheet(){
 if(!state.ui.search)return '';
 return `<div class="overlay" onclick="if(event.target===this)closeSearch()"><section class="sheet search-panel"><div class="handle"></div><h2>🔍 البحث</h2><input id="searchQuery" autocomplete="off" placeholder="ابحث بالاسم أو اسم المستخدم أو الكود #..." oninput="debouncedSearch(this.value)" onkeydown="if(event.key==='Enter')runSearch(this.value)"><div id="searchResults"><div class="empty" style="height:auto;padding:25px">اكتب الاسم، اسم المستخدم، أو الكود التعريفي (#) لو في أكتر من شخص بنفس الاسم.</div></div><button class="btn btn-ghost full" style="margin-top:10px" onclick="closeSearch()">إغلاق</button></section></div>`;
}
let searchDebounceTimer=null;
function debouncedSearch(q){
 clearTimeout(searchDebounceTimer);
 searchDebounceTimer=setTimeout(()=>runSearch(q),110);
}
function runSearch(q){
 const box=document.getElementById('searchResults');
 if(!box)return;
 const raw=String(q||'').trim();
 const query=normalizeSearchText(raw);
 if(!query){
   box.innerHTML='<div class="empty" style="height:auto;padding:25px">اكتب اسم الشخص أو اسم المستخدم أو الكود # أو جزءًا من وصف الفيديو.</div>';
   return;
 }
 const me=account();
 const rank=(text)=>{const t=normalizeSearchText(text);if(!t.includes(query))return -1;return t.startsWith(query)?0:1};
 const people=realPeople().map(a=>{
   const name=normalizeSearchText(a.name),email=normalizeSearchText(a.email),handle=email.replace(/@.*/,'');
   const code=String(a.code||''),codeHash='#'+code;
   const r=Math.min(...[rank(a.name),rank(a.email),rank(handle),rank(code),rank(codeHash)].filter(x=>x>=0),99);
   return {a,r};
 }).filter(x=>x.r<99).sort((x,y)=>x.r-y.r).map(x=>x.a).slice(0,30);
 const dupNameCount={};
 people.forEach(a=>{const key=normalizeSearchText(a.name||'');dupNameCount[key]=(dupNameCount[key]||0)+1});
 const vids=visibleVideos().map(v=>{
   const r=Math.min(...[rank(v.ownerName),rank(v.caption)].filter(x=>x>=0),99);
   return {v,r};
 }).filter(x=>x.r<99).sort((x,y)=>x.r-y.r).map(x=>x.v).slice(0,20);
 let html='';
 if(people.length){
   html+='<div class="search-title">الأشخاص</div>';
   html+=people.map(a=>{
     const rel=me?relationStatus(a.email):'none';
     const avatar=a.avatar?`<img src="${esc(a.avatar)}" alt="${esc(a.name||'صورة الحساب')}">`:initials(a.name);
     let action='';
     if(me){
       if(rel==='friends') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إزالة الصداقة</button><button class="btn btn-sm btn-ghost" onclick="closeSearch();openChat('${esc(a.email)}')">💬</button>`;
       else if(rel==='sent') action=`<button class="btn btn-sm btn-danger" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">إلغاء الطلب</button>`;
       else if(rel==='incoming') action=`<button class="btn btn-sm btn-primary" onclick="acceptFriendRequest('${esc(a.email)}')">قبول الطلب</button>`;
       else action=`<button class="btn btn-sm btn-primary" onclick="toggleFriend('${esc(a.email)}');setTimeout(()=>runSearch(document.getElementById('searchQuery')?.value||''),0)">متابعة</button>`;
     }
     const bizTag=a.accountType==='business'?' <span class="mini-badge biz">تجاري</span>':'';
     const isDup=(dupNameCount[normalizeSearchText(a.name||'')]||0)>1;
     const codeLine=`<span${isDup?' style="color:var(--cyan);font-weight:700"':''}>كود: ${esc(userCodeLabel(a))}</span>`;
     return `<div class="search-result person-result"><button class="avatar sm" style="border:0;padding:0" onclick="closeSearch();openUserProfile('${esc(a.email)}')">${avatar}</button><div class="search-person-info" style="cursor:pointer" onclick="closeSearch();openUserProfile('${esc(a.email)}')"><b>${esc(a.name||'مستخدم')}${bizTag}</b><div class="muted">@${esc(String(a.email).split('@')[0])} · ${codeLine}</div>${isDup?`<div class="muted" style="font-size:10.5px;color:var(--warning)">⚠️ في أكتر من شخص بنفس الاسم — استخدم الكود للتأكد إنك بتختار الشخص الصح</div>`:''}</div>${action}</div>`;
   }).join('');
 }
 if(vids.length){
   html+='<div class="search-title">الفيديوهات</div>';
   html+=vids.map(v=>`<div class="search-result video-result"><video src="${esc(videoSrc(v))}" muted playsinline controls></video><div style="flex:1;min-width:0"><b>@${esc(v.ownerName||'مستخدم')}</b><div class="muted" style="margin-top:3px">${esc(v.caption||'بدون وصف')}</div><button class="btn btn-sm btn-primary" style="margin-top:7px" onclick="closeSearch();state.ui.comments='${esc(v.id)}';render()">عرض الفيديو</button></div></div>`).join('');
 }
 box.innerHTML=html||'<div class="empty" style="height:auto;padding:25px">لم يتم العثور على شخص أو فيديو بهذا الاسم أو الكود.</div>';
}

/* ---------- الأرباح (تجريبي داخل التطبيق) ---------- */
function computeEarnings(a){
 const vids=state.videos.filter(v=>v.ownerEmail===a.email&&v.status==='approved');
 const perVideo=vids.map(v=>({id:v.id,caption:v.caption,likes:v.likes.length,comments:v.comments.length,coins:v.likes.length*2+v.comments.length*1}));
 const videoCoins=perVideo.reduce((s,v)=>s+v.coins,0);
 const followerCount=Array.isArray(a.followers)?a.followers.length:0;
 const followerCoins=followerCount*100;
 const totalCoins=videoCoins+followerCoins;
 const withdrawn=Number(a.earningsWithdrawn)||0;
 const balance=Math.max(0,totalCoins-withdrawn);
 return {perVideo,videoCoins,followerCount,followerCoins,totalCoins,withdrawn,balance};
}
function myWithdrawal(a){
 if(!a)return null;
 return (state.withdrawals||[]).filter(w=>w.ownerEmail===a.email).sort((x,y)=>y.createdAt-x.createdAt)[0]||null;
}
function openWithdrawSheet(){
 const a=account();if(!a)return;
 const e=computeEarnings(a);
 if(e.balance<=0){toast('لا يوجد رصيد كافٍ للسحب حاليًا');return}
 if(myWithdrawal(a)){toast('لديك طلب سحب قائم بالفعل');return}
 state.ui.withdrawSheet=true;state.ui.withdrawWallet=WALLETS[0].id;state.ui.withdrawPhone='';render();
}
function closeWithdrawSheet(){state.ui.withdrawSheet=false;render()}
function submitWithdraw(){
 const a=account();if(!a)return;
 const e=computeEarnings(a);
 if(e.balance<=0){toast('لا يوجد رصيد كافٍ للسحب حاليًا');closeWithdrawSheet();return}
 if(myWithdrawal(a)){toast('لديك طلب سحب قائم بالفعل');closeWithdrawSheet();return}
 const phoneEl=app.querySelector('#withdrawPhone');
 const phone=String(phoneEl?phoneEl.value:state.ui.withdrawPhone||'').trim();
 const err=app.querySelector('#withdrawErr');
 const wallet=state.ui.withdrawWallet||WALLETS[0].id;
 if(err)err.style.display='none';
 if(!/^01[0125]\d{8}$/.test(phone)){
   if(err){err.textContent='اكتب رقم محفظة مصري صحيح (11 رقم يبدأ بـ 010/011/012/015)';err.style.display='block';}
   return;
 }
 const walletName=(WALLETS.find(w=>w.id===wallet)||WALLETS[0]).name;
 const coins=e.balance;
 const req={id:'w'+Date.now()+Math.random().toString(36).slice(2,7),ownerEmail:a.email,ownerName:a.name,wallet,walletName,phone,coins,amount:Number((coins*0.05).toFixed(2)),status:'pending',createdAt:Date.now()};
 state.withdrawals=state.withdrawals||[];
 state.withdrawals.push(req);
 a.earningsWithdrawn=(Number(a.earningsWithdrawn)||0)+coins;
 state.ui.withdrawSheet=false;state.ui.withdrawPhone='';
 save();render();
 toast('✅ تم إرسال طلب السحب، الطلب قيد المراجعة');
}

 return `<div class="overlay" onclick="if(event.target===this)closeWithdrawSheet()"><section class="sheet"><div class="handle"></div><h2>طلب سحب الأرباح</h2>
 <p class="muted">الرصيد المتاح: ${fmt(e.balance)} نقطة ≈ ${egp(e.balance)} ج.م</p>

 <button class="btn btn-ghost full" style="margin-top:8px" onclick="closeWithdrawSheet()">إلغاء</button>
 </section></div>`
}

function renderProfile(){

/* ---------- تخزين ملفات الفيديو على Supabase Storage (بدون بطاقة، يشتغل من أي جهاز) ---------- */
async function uploadVideoFile(id,blob){
  if(!SUPABASE_READY||!supabaseClient) throw new Error("supabase_not_configured");
  if(!blob) throw new Error("no_file");

  // اسم فريد + امتداد حقيقي للفيديو.
  const mime=String(blob.type||"video/webm").toLowerCase();
  const ext=mime.includes("mp4")?"mp4":mime.includes("quicktime")?"mov":"webm";
  const path=`${id}.${ext}`;

  // مهم: لا نستخدم upsert هنا؛ لأن upsert يحتاج صلاحيات إضافية
  // (SELECT/UPDATE) وقد يمنع الرفع عند وجود سياسة INSERT فقط.
  const {error:upErr}=await supabaseClient.storage
    .from(SUPABASE_BUCKET)
    .upload(path,blob,{
      contentType:mime,
      cacheControl:"3600",
      upsert:false
    });

  if(upErr){
    console.error("Supabase Storage upload error:",upErr);
    const msg=upErr.message||upErr.error_description||"upload_failed";
    throw new Error(`Supabase Storage: ${msg}`);
  }

  const {data}=supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
  if(!data?.publicUrl) throw new Error("Supabase Storage: public URL unavailable");
  return data.publicUrl;
}
async function deleteVideoFile(id){
  if(!SUPABASE_READY||!supabaseClient) return;
  try{
    await supabaseClient.storage.from(SUPABASE_BUCKET).remove([
      id, `${id}.mp4`, `${id}.webm`, `${id}.mov`
    ]);
  }catch(e){ console.warn("Supabase delete error",e); }
}

async function requestMediaPermissions(){
  if(location.protocol==="content:"||location.protocol==="file:"){
    state.ui.permissions=true;render();
    const title=app.querySelector("#permissionTitle"),text=app.querySelector("#permissionText"),retry=app.querySelector("#permissionRetry");
    const isFile=location.protocol==="file:";
    if(title)title.textContent=isFile?"Chrome يمنع الكاميرا من ملف محلي":"المتصفح يمنع الكاميرا من الملف المحلي";
    if(text)text.innerHTML=isFile?"الصفحة مفتوحة كملف على جهازك مباشرة (<b>file://</b>)، وChrome بيمنع إذن الكاميرا والميكروفون من الملفات المحلية حتى لو ضغطت سماح — مفيش «إعدادات موقع 🔒» أصلًا تقدر تفتحها هنا. الحل: دوس <b>تصوير بكاميرا الهاتف</b> تحت (بيشتغل دايمًا)، أو ارفع الملف على استضافة HTTPS زي Vercel/Netlify عشان الكاميرا تشتغل جوه الصفحة نفسها.":"أنت فاتح Zaply من شاشة التنزيلات <b>content://</b>. في هذه الحالة Chrome لا يسمح لصفحة الملف المحلي بطلب الكاميرا والميكروفون. استخدم زر <b>تصوير بكاميرا الهاتف</b> أسفل، أو افتح Zaply من رابط <b>HTTPS</b>.";
    if(retry)retry.style.display="none";
    return false;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    toast("المتصفح لا يدعم الكاميرا والميكروفون. استخدم Chrome حديثًا.");
    return false
  }
  if(!window.isSecureContext && location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){
    toast("افتح Zaply من رابط HTTPS حتى تعمل أذونات الكاميرا والمايك.");
    return false
  }
  try{
    const temp=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"user"}},
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    temp.getTracks().forEach(t=>t.stop());
    state.ui.permissions=false;
    render();
    setTimeout(startCamera,120);
    return true
  }catch(e){
    console.error("Zaply permission error:",e);
    state.ui.permissions=true;
    render();
    const title=app.querySelector("#permissionTitle"), text=app.querySelector("#permissionText"), retry=app.querySelector("#permissionRetry");
    if(title)title.textContent="الكاميرا والميكروفون غير مسموح بهما";
    if(text)text.innerHTML="اسمح للمتصفح باستخدام <b>الكاميرا والميكروفون</b> ثم اضغط إعادة المحاولة.<br>في Chrome على الهاتف: افتح <b>إعدادات الموقع 🔒</b> بجوار عنوان الصفحة، واجعل الكاميرا والميكروفون على <b>سماح</b>.";
    if(retry)retry.style.display="block";
    return false
  }
}

async function startCamera(){
 const v=app.querySelector("#camPreview"),fallback=app.querySelector("#camFallback"),err=app.querySelector("#camErrorText");if(!v)return;
 if(!window.isSecureContext && location.hostname!="localhost" && location.hostname!="127.0.0.1"){
   if(fallback)fallback.classList.remove("hidden");
   if(err)err.textContent="الكاميرا والميكروفون يحتاجان HTTPS أو localhost. ارفع index.html على موقع HTTPS مثل Vercel أو Netlify.";
   return;
 }
 if(!navigator.mediaDevices?.getUserMedia){
   if(fallback)fallback.classList.remove("hidden");
   if(err)err.textContent="المتصفح الحالي لا يدعم تشغيل الكاميرا. استخدم Chrome أو Edge حديثًا.";
   return;
 }
 try{
  if(!stream) stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"},width:{ideal:1080},height:{ideal:1920}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  v.srcObject=stream;
  await v.play().catch(()=>{});
  if(fallback)fallback.classList.add("hidden");
 }catch(e){
  if(fallback)fallback.classList.remove("hidden");
  if(err){
   if(location.protocol==="file:")err.textContent="الكاميرا ما بتشتغلش من ملف محلي (file://) في Chrome حتى مع الموافقة. دوس «تصوير بكاميرا الهاتف» تحت، أو ارفع الملف على استضافة HTTPS.";
   else if(location.protocol==="content:")err.textContent="الكاميرا ما بتشتغلش من شاشة التنزيلات (content://). دوس «تصوير بكاميرا الهاتف» تحت، أو افتح Zaply من رابط HTTPS.";
   else err.textContent=e?.name==="NotAllowedError"?"تم رفض إذن الكاميرا أو الميكروفون. افتح إعدادات الموقع 🔒 بجوار عنوان الصفحة واسمح بالوصول ثم اضغط تشغيل الكاميرا.":"تعذر تشغيل الكاميرا. جرّب Chrome على HTTPS أو localhost.";
  }
 }
}
function stopMusic(){
 if(musicTimer){clearInterval(musicTimer);musicTimer=null}
 musicStep=0;
}
function setupAudioMix(){
 if(!stream)return stream;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});
  mixDest=audioCtx.createMediaStreamDestination();
  micSource=audioCtx.createMediaStreamSource(stream);
  const micGain=audioCtx.createGain();micGain.gain.value=1;micSource.connect(micGain).connect(mixDest);
  if(state.ui.song!==SONGS[0]) startMusic(audioCtx,mixDest);
  const tracks=[...stream.getVideoTracks(),...mixDest.stream.getAudioTracks()];
  return new MediaStream(tracks);
 }catch(e){return stream}
}
function startMusic(ctx,dest){
 stopMusic();
 const fam=songFamily(state.ui.song);
 const notes=fam?fam.notes:[220,247,262,247];
 musicStep=0;
 const playNote=()=>{
   const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=notes[musicStep%notes.length];
   g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.055,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.34);
   o.connect(g).connect(dest);o.start();o.stop(ctx.currentTime+.36);musicStep++;
 };
 playNote();musicTimer=setInterval(playNote,380);
}
function stopCamera(){
 stopMusic();
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 recordStream=null;
 if(timer){clearInterval(timer);timer=null}
}

function bestMime(){
 const types=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"];
 return types.find(t=>window.MediaRecorder?.isTypeSupported?.(t))||"";
}
function recordToggle(){
 if(!stream){toast("فعّل الكاميرا والميكروفون أولًا");return}
 if(!state.ui.recording){
  chunks=[];recordStream=setupAudioMix();
  try{
   const mime=bestMime();recorder=mime?new MediaRecorder(recordStream,{mimeType:mime}):new MediaRecorder(recordStream);
  }catch(e){toast("التسجيل غير متاح على هذا المتصفح. جرّب Chrome حديثًا.");return}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
   const type=recorder.mimeType||"video/webm";
   const blob=new Blob(chunks,{type});
   state.ui.recorded=URL.createObjectURL(blob);state.ui.recordedBlob=blob;state.ui.recordedIsBlob=true;state.ui.videoDuration=state.ui.seconds||0;state.ui.stage="preview";state.ui.recording=false;stopCamera();render();
  };
  recorder.start(250);state.ui.recording=true;state.ui.seconds=0;render();setTimeout(startCamera,30);
  timer=setInterval(()=>{state.ui.seconds++;const t=app.querySelector(".timer");if(t)t.textContent=timerText(state.ui.seconds);if(state.ui.seconds>=MAX_VIDEO_SECONDS)recordToggle()},1000)
 }else{
  if(timer){clearInterval(timer);timer=null}state.ui.recording=false;
  if(recorder&&recorder.state!=="inactive")recorder.stop();
 }
}
function uploadVideo(e){
 const f=e.target.files[0];if(!f)return;
 if(!f.type.startsWith("video/")){toast("اختر ملف فيديو صحيحًا");return}
 // لا يوجد حد لعدد الفيديوهات التي يمكن نشرها. الحد الأساسي هنا هو مدة الفيديو (5 دقائق) ومساحة تخزين الجهاز/المتصفح.
 if(f.size>1024*1024*1024){toast("حجم الملف كبير جدًا لهذا المتصفح؛ جرّب ملفًا أصغر مع بقاء حد المدة 5 دقائق");return}
 const url=URL.createObjectURL(f);
 const probe=document.createElement("video");
 probe.preload="metadata";
 probe.onloadedmetadata=()=>{
   const duration=Number(probe.duration)||0;
   URL.revokeObjectURL(probe.src);
   if(duration>MAX_VIDEO_SECONDS+0.2){
     toast("الحد الأقصى للفيديو 5 دقائق فقط");
     e.target.value="";
     return;
   }
   state.ui.recorded=URL.createObjectURL(f);state.ui.recordedBlob=f;state.ui.recordedIsBlob=true;state.ui.uploadFile=f;state.ui.stage="preview";state.ui.videoDuration=duration;stopCamera();render();
 };
 probe.onerror=()=>{URL.revokeObjectURL(probe.src);toast("تعذر قراءة مدة الفيديو");e.target.value=""};
 probe.src=url;
}

async function publish(){
 if(!state.ui.recorded){toast("لا يوجد فيديو للنشر");return}
 const a=account();if(!a||!state.session){toast("سجل الدخول أولًا");return}
 if(Number(state.ui.videoDuration)>MAX_VIDEO_SECONDS+0.2){toast("الحد الأقصى للفيديو 5 دقائق فقط");return}
 if(!SUPABASE_READY){toast("⚠️ لازم تظبط إعدادات Supabase الأول عشان الفيديو يترفع (راجع أعلى الكود)");return}
 const id="v"+Date.now(),file=state.ui.uploadFile||state.ui.recordedBlob;
 const v={id,ownerEmail:state.session.email,ownerName:a.name,caption:app.querySelector("#caption")?.value.trim()||"فيديو جديد على Zaply ✨",privacy:state.ui.privacy,status:"pending",song:state.ui.song,likes:[],comments:[],createdAt:Date.now()};
 toast("⏳ جاري رفع الفيديو على السيرفر...");
 try{
   const blob=file||(state.ui.recorded?await fetch(state.ui.recorded).then(r=>r.blob()):null);
   if(!blob) throw new Error("no_file");
   v.videoURL=await uploadVideoFile(id,blob);
 }catch(e){
   console.error("Zaply publish error:",e);
   recordSystemError('publish',e?.message||String(e),{ownerEmail:state.session?.email||'',videoId:id});
   toast(`❌ فشل رفع الفيديو: ${String(e?.message||e).slice(0,140)}`);
   return;
 }
 state.videos.unshift(v);save();
 if(state.ui.recorded)try{URL.revokeObjectURL(state.ui.recorded)}catch(e){}
 state.ui.publish=false;state.ui.recorded=null;state.ui.recordedBlob=null;state.ui.uploadFile=null;state.ui.videoDuration=0;state.ui.captionDraft="";state.screen="profile";render();
 setTimeout(()=>toast("تم الإرسال ✅ الفيديو الآن قيد المراجعة من المطور"),80);
}

function openBan(email){
 const e=accountKey(email);
 if(!e){toast('الحساب غير موجود');return}
 state.ui.banTarget=e;render();
}
function closeBan(){state.ui.banTarget=null;render()}
function adminBanSheet(){
 if(!state.ui.banTarget)return '';
 const a=getAccount(state.ui.banTarget);if(!a)return '';
 const blocked=isBanned(a);
 return `<div class="overlay" onclick="if(event.target===this)closeBan()"><section class="sheet"><div class="handle"></div><h2>حظر الحساب</h2><p class="muted">${esc(a.name)} · ${esc(a.email)} · كود: ${esc(userCodeLabel(a))}</p><div class="review-box" style="margin:8px 0"><b>الحالة: ${blocked?'غير نشط 🚫 — '+esc(banDetail(a)):'نشط ✅'}</b><span>اختر أحد الخيارين فقط: 24 ساعة أو حظر دائم.</span></div><button class="btn btn-danger full" onclick="banUser('${esc(a.email)}','permanent')">🚫 حظر دائم</button><button class="btn btn-primary full" style="margin-top:8px" onclick="banUser('${esc(a.email)}',24)">⏱️ حظر لمدة 24 ساعة</button>${blocked?`<button class="btn btn-success full" style="margin-top:8px" onclick="unbanUser('${esc(a.email)}')">🔓 إلغاء الحظر</button>`:''}<button class="btn btn-ghost full" style="margin-top:8px" onclick="closeBan()">إلغاء</button></section></div>`;
}
function banUser(email,mode){
 const e=accountKey(email);
 const a=getAccount(e);
 if(!e||!a){toast('الحساب غير موجود');return}
 const now=Date.now();
 const permanent=mode==='permanent';
 const hours=permanent?0:24;
 a.banned=true;
 a.bannedPermanent=permanent;
 a.banType=permanent?'permanent':'24h';
 a.banHours=hours;
 a.banStartedAt=now;
 a.bannedUntil=permanent?null:now+(24*60*60*1000);
 a.banReason='حظر من المطور';
 a.lastModerationAction={type:'ban',hours,permanent,at:now};
 state.videos.forEach(v=>{if(v.ownerEmail===e)v.blockedByBan=true});
 save();
 try{syncChannel?.postMessage({type:'ban',email:e,until:a.bannedUntil,permanent})}catch(err){}
 if(state.session?.email===e&&!state.session?.isAdmin){
   state.session=null;clearSession();state.screen='auth';state.ui.authMode='login';state.ui.banNotice=banText(a);
   state.ui.banPermanent=permanent;state.ui.banUntil=permanent?null:a.bannedUntil;
 }
 state.ui.banTarget=null;render();
 toast(permanent?'تم حظر الحساب نهائيًا':'تم حظر الحساب لمدة 24 ساعة');
}
function unbanUser(email){
 const e=accountKey(email);
 const a=getAccount(e);if(!e||!a){toast('الحساب غير موجود');return}
 a.banned=false;a.bannedPermanent=false;a.bannedUntil=null;a.banHours=0;a.banStartedAt=null;a.banReason=null;a.banType=null;a.lastModerationAction={type:'unban',at:Date.now()};
 state.videos.forEach(v=>{if(v.ownerEmail===e)v.blockedByBan=false});
 save();
 try{syncChannel?.postMessage({type:'unban',email:e})}catch(err){}
 state.ui.banTarget=null;render();toast('تم إلغاء الحظر — الحساب نشط الآن');
}
function statusVideo(id,status){const v=state.videos.find(x=>x.id===id);if(v){v.status=status;save();render();toast(status==="approved"?"تم قبول الفيديو ونشره":"تم رفض الفيديو")}}
async function deleteVideo(id){state.videos=state.videos.filter(x=>x.id!==id);await deleteVideoFile(id);save();render();toast("تم حذف الفيديو")}
function adminLogout(){state.session=null;clearSession();state.screen="auth";state.ui.authMode="login";render()}

/* ---------- إعادة ضبط النظام بالكامل (للمطور فقط) ---------- */
function openResetSystem(){state.ui.resetConfirm=true;render()}
function closeResetSystem(){state.ui.resetConfirm=false;render()}
function downloadBackup(){
 try{
   const backup={exportedAt:Date.now(),accounts:state.accounts,videos:state.videos.map(stripLocalOnly),withdrawals:state.withdrawals||[],rechargeRequests:state.rechargeRequests||[],giftTransactions:state.giftTransactions||[],systemErrors:state.systemErrors||[],adminMessages:state.adminMessages||[]};
   const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
   const url=URL.createObjectURL(blob);
   const link=document.createElement("a");
   link.href=url;link.download="zaply-backup-"+Date.now()+".json";
   document.body.appendChild(link);link.click();document.body.removeChild(link);
   setTimeout(()=>URL.revokeObjectURL(url),2000);
   return true;
 }catch(e){console.warn("Backup failed",e);return false}
}
function resetSystem(){
 const backedUp=downloadBackup();
 state.accounts={};
 state.videos=[];
 state.withdrawals=[];
 state.rechargeRequests=[];
 state.giftTransactions=[];
 state.systemErrors=[];
 state.adminMessages=[];
 state.pending=null;
 try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
 save();
 state.ui.resetConfirm=false;
 render();
 toast(backedUp?"✅ تم تنزيل نسخة احتياطية وإعادة ضبط النظام بالكامل":"⚠️ تعذّر تنزيل نسخة احتياطية، لكن تمت إعادة الضبط");
}
function resetConfirmSheet(){
 if(!state.ui.resetConfirm)return '';
 return `<div class="overlay" onclick="if(event.target===this)closeResetSystem()"><section class="sheet"><div class="handle"></div><h2>⚠️ إعادة ضبط النظام بالكامل</h2><div class="secure-warning">هيتم أولًا تنزيل نسخة احتياطية (ملف JSON) فيها كل الحسابات والفيديوهات وطلبات السحب على جهازك، وبعدها هيتم مسح كل البيانات والبدء من جديد كأن التطبيق لسه متثبت. حساب المطور نفسه ثابت ومش هيتأثر.</div><button class="btn btn-danger full" onclick="resetSystem()">تنزيل نسخة احتياطية وإعادة الضبط</button><button class="btn btn-ghost full" style="margin-top:8px" onclick="closeResetSystem()">إلغاء</button></section></div>`
}

/* ---------- Init ---------- */
function init(){
  setTimeout(function(){
    try{
      var sess=null;
      try{sess=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");}catch(e){}
      state.session=(sess&&sess.email)?sess:null;
      state.screen=state.session?(state.session.isAdmin?"admin":"home"):"auth";
      if(!state.session) state.ui.authMode="login";
    }catch(e){
      state.session=null; state.screen="auth"; state.ui.authMode="login";
    }
    try{render();}catch(e){
      console.error("Zaply startup render error",e);
      try{state.session=null;state.screen="auth";state.ui.authMode="login";render();}catch(e2){}
    }
    setTimeout(function(){
      try{
        load();
        Object.values(state.accounts||{}).forEach(function(a){
          a.friends=Array.isArray(a.friends)?a.friends:[];
          a.followers=Array.isArray(a.followers)?a.followers:[];
          a.following=Array.isArray(a.following)?a.following:[];
          a.friendRequests=Array.isArray(a.friendRequests)?a.friendRequests:[];
          a.sentFriendRequests=Array.isArray(a.sentFriendRequests)?a.sentFriendRequests:[];
          a.messages=Array.isArray(a.messages)?a.messages:[];
        });
        if(state.screen==="home"||state.screen==="admin"){try{render();}catch(e){}}
      }catch(e){console.warn("Background state load skipped",e);}
    },0);
  },700);
}
// ارسم شاشة البداية فورًا؛ لا ننتظر أي تخزين أو IndexedDB أو مؤقت.
// هذا مهم خصوصًا عند فتح الملف من content://downloads على الهاتف.
try{render();}catch(e){
  app.innerHTML=splashHTML();
}
/* ---------- رسائل المطور للمستخدمين ---------- */

 ${list.length?list.map(m=>`<div class="admin-card" style="display:block"><div class="admin-info"><b>إلى: ${esc(nm(m.to))}</b><div class="admin-cap" style="white-space:pre-wrap">${esc(m.text)}<br>${new Date(m.at).toLocaleString('ar-EG')}</div></div><div class="admin-actions"><button class="btn btn-sm btn-danger" onclick="deleteAdminMsg('${m.id}')">حذف</button></div></div>`).join(''):`<div class="empty" style="height:auto;padding:30px">لسه ما بعتّش أي رسالة.</div>`}</div>`;

function openAdminMsg(to){state.ui.adminMsg={to:to,text:''};render();setTimeout(()=>document.getElementById('adminMsgText')?.focus(),80)}
function closeAdminMsg(){state.ui.adminMsg=null;render()}
function adminMsgSheet(){
 const m=state.ui.adminMsg;if(!m)return '';
 const target=m.to==='all'?`كل المستخدمين (${adminUsers().length})`:esc(getAccount(m.to)?.name||m.to);
 return `<div class="overlay" onclick="if(event.target===this)closeAdminMsg()"><section class="sheet"><div class="handle"></div><h2>📢 رسالة من المطور</h2><div class="review-box" style="text-align:right;margin-top:0"><span>إلى</span><b style="color:var(--text);margin:2px 0 0">${target}</b></div>
 <div class="field"><label>نص الرسالة</label><textarea id="adminMsgText" rows="5" maxlength="600" placeholder="اكتب رسالتك هنا..." oninput="state.ui.adminMsg.text=this.value;document.getElementById('adminMsgCount').textContent=this.value.length">${esc(m.text||'')}</textarea><div class="note" style="text-align:left;margin-top:4px"><span id="adminMsgCount">${(m.text||'').length}</span> / 600</div></div>
 <button class="btn btn-primary full" onclick="sendAdminMsg()">إرسال ${m.to==='all'?'للجميع':'الرسالة'}</button><button class="btn btn-ghost full" style="margin-top:8px" onclick="closeAdminMsg()">إلغاء</button></section></div>`;
}
function sendAdminMsg(){
 const m=state.ui.adminMsg;if(!m)return;
 const text=String(m.text||'').trim();
 if(text.length<2){toast('اكتب نص الرسالة');return}
 const to=m.to==='all'?'all':accountKey(m.to);
 if(to!=='all'&&!getAccount(to)){toast('الحساب غير موجود');return}
 state.adminMessages=Array.isArray(state.adminMessages)?state.adminMessages:[];
 state.adminMessages.unshift({id:'am'+Date.now()+Math.random().toString(36).slice(2,6),to,text:text.slice(0,600),at:Date.now()});
 state.adminMessages=state.adminMessages.slice(0,200);
 save();state.ui.adminMsg=null;render();
 toast(to==='all'?'✅ تم إرسال الرسالة لكل المستخدمين':'✅ تم إرسال الرسالة');
}
function deleteAdminMsg(id){state.adminMessages=(state.adminMessages||[]).filter(x=>x.id!==id);save();render()}
function myAdminMessages(){
 const me=account();if(!me)return [];
 const key=accountKey(me.email),born=Number(me.createdAt)||0;
 return (state.adminMessages||[]).filter(m=>(m.to==='all'&&m.at>=born)||(m.to!=='all'&&accountKey(m.to)===key)).sort((a,b)=>b.at-a.at);
}
function adminMsgUnread(){const me=account();if(!me)return 0;const r=Number(me.adminMsgReadAt)||0;return myAdminMessages().filter(m=>m.at>r).length}
function openDevMessages(){
 if(!requireLogin())return;
 const me=account();if(me){me.adminMsgReadAt=Date.now();save()}
 state.ui.devMsgs=true;state.ui.messages=false;state.ui.notifications=false;
 if(state.screen!=="home"&&state.screen!=="profile")state.screen="home";
 render();
}
function closeDevMessages(){state.ui.devMsgs=false;render()}
function devMessagesRow(){
 const list=myAdminMessages(),unread=adminMsgUnread(),last=list[0];
 return `<button class="message-row dev-row" style="width:100%;text-align:right;color:inherit;display:flex;align-items:center;gap:12px" onclick="openDevMessages()">${zmark("",44)}<div style="flex:1;min-width:0"><b>Zaply · رسائل المطور</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?esc(last.text.slice(0,60)):'لا توجد رسائل'}</div></div>${unread?`<span class="request-badge">${unread} جديد</span>`:''}</button>`;
}
function devMessagesSheet(){
 if(!state.ui.devMsgs)return '';
 const list=myAdminMessages();
 return `<div class="overlay" onclick="if(event.target===this)closeDevMessages()"><section class="sheet"><div class="handle"></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">${zmark("",48)}<div><h2 style="margin:0">رسائل المطور</h2><div class="muted" style="font-size:12px">رسائل رسمية من فريق Zaply</div></div></div><div class="messages-list">${list.length?list.map(m=>`<div class="message-bubble"><b>${m.to==='all'?'📢 إعلان للجميع':'✉️ رسالة ليك'}</b><br><span style="white-space:pre-wrap">${esc(m.text)}</span><div class="muted" style="font-size:10px;margin-top:5px">${new Date(m.at).toLocaleString('ar-EG')}</div></div>`).join(''):`<div class="empty" style="height:auto;padding:30px">مفيش رسائل من المطور لسه.</div>`}</div><button class="btn btn-ghost full" style="margin-top:12px" onclick="closeDevMessages()">إغلاق</button></section></div>`;
}

/* ---------- تجربة التطبيق: تفاعل الفيديو + تثبيت + اهتزاز خفيف ---------- */
let _tapT=null,_lastTap=0;
function vTap(ev,v){
  const now=Date.now();
  if(now-_lastTap<300){
    clearTimeout(_tapT);_lastTap=0;
    const card=v.closest(".video-card"),id=card?.dataset.id,vid=state.videos.find(x=>x.id===id);
    if(!state.session){requireLogin();return}
    if(card){
      const r=card.getBoundingClientRect();
      card.insertAdjacentHTML("beforeend",`<div class="burst" style="left:${ev.clientX-r.left}px;top:${ev.clientY-r.top}px">${ICON.heartfill}</div>`);
      setTimeout(()=>card.querySelector(".burst")?.remove(),900);
    }
    if(vid&&!liked(vid))likeVideo(id);
    return;
  }
  _lastTap=now;
  _tapT=setTimeout(()=>{
    if(!audioUnlocked){videoGesture(v);return}
    const card=v.closest(".video-card");
    const flash=(svg)=>{card?.querySelector(".flash")?.remove();card?.insertAdjacentHTML("beforeend",`<div class="flash">${svg}</div>`);setTimeout(()=>card?.querySelector(".flash")?.remove(),650)};
    if(v.paused){v.play().catch(()=>{});flash(ICON.play)}else{v.pause();flash(ICON.pause)}
  },300);
}
function vProg(v){const i=v.closest(".video-card")?.querySelector(".vprog i");if(i&&v.duration)i.style.width=(v.currentTime/v.duration*100)+"%"}

let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
window.addEventListener("appinstalled",()=>{deferredInstall=null;toast("✅ تم تثبيت Zaply على جهازك")});
function isStandalone(){try{return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}catch(e){return false}}
async function installApp(){
  if(deferredInstall){
    try{deferredInstall.prompt();await deferredInstall.userChoice}catch(e){}
    deferredInstall=null;closeSettings();return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  closeSettings();
  toast(ios?"من زر المشاركة اختار «إضافة إلى الشاشة الرئيسية»":"من قائمة المتصفح (⋮) اختار «تثبيت التطبيق»");
}
// اهتزاز خفيف عند اللمس (على الأجهزة اللي بتدعمه)
document.addEventListener("click",e=>{try{if(navigator.vibrate&&e.target.closest&&e.target.closest("button,.cell"))navigator.vibrate(6)}catch(_){}},true);
// أيقونة التطبيق + manifest (بتعمل على الروابط https)
(function setupPWA(){
  try{
    const mk=(size)=>{
      const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
      const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,"#8B5CF6");g.addColorStop(.55,"#D946EF");g.addColorStop(1,"#EC4899");
      x.fillStyle=g;x.fillRect(0,0,size,size);
      x.strokeStyle="#fff";x.lineWidth=size*.1;x.lineCap="round";x.lineJoin="round";
      const p=size*.3,q=size*.7;x.beginPath();x.moveTo(p,p);x.lineTo(q,p);x.lineTo(p,q);x.lineTo(q,q);x.stroke();
      return c.toDataURL("image/png");
    };
    const i192=mk(192),i512=mk(512);
    const ap=document.createElement("link");ap.rel="apple-touch-icon";ap.href=i192;document.head.appendChild(ap);
    if(/^https?:$/.test(location.protocol)){
      const manifest={name:"Zaply",short_name:"Zaply",description:"شارك لحظاتك بفيديوهات قصيرة",lang:"ar",dir:"rtl",display:"standalone",orientation:"portrait",background_color:"#0A0A10",theme_color:"#0A0A10",start_url:location.href.split("#")[0],icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
      const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));document.head.appendChild(l);
    }
  }catch(e){console.warn("PWA setup skipped",e)}
})();

function initBackends(){
  const fb=initFirebase(); initSupabase();
  if(fb && !remoteUnsub){try{load()}catch(e){console.warn("load after libs failed",e)}}
  return FIREBASE_READY&&SUPABASE_READY;
}
(window.__svLibs||Promise.resolve()).then(initBackends);
// لو المكتبات وصلت متأخر (نت بطيء) نعيد المحاولة كل 3 ثواني لمدة دقيقة
(function(){let n=0;const t=setInterval(()=>{if(initBackends()||++n>20)clearInterval(t)},3000)})();
init();
